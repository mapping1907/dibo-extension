<!--
=======================================================
  요금제 비교 테이블 페이지 - 사용 가이드
=======================================================

【페이지 개요】
  STARTER / PROFESSIONAL / ENTERPRISE 3개 플랜의 기능을
  행/열 테이블 형태로 비교해주는 페이지입니다.
  API 연동 전에는 comparisonData 배열의 로컬 데이터가 표시됩니다.

【사용 전 필수 설정】
  아래 항목들을 수정하여 서비스에 맞게 커스터마이징하세요.

  1. 페이지 제목 / 설명 수정
     → <body> 내 h1, p 태그 텍스트 직접 수정

  2. 테이블 헤더 플랜명 수정
     → <div class="dibo-table-head"> 내 텍스트 직접 수정

  3. 비교 기능 데이터 수정 (API 연동 전 임시 데이터)
     → comparisonData 배열 내 항목 수정/추가/삭제
     → 각 항목 구성:
        feature      : 기능명 (테이블 첫 번째 열)
        starter      : 스타터 플랜 지원 여부/값
        professional : 프로페셔널 플랜 지원 여부/값
        enterprise   : 엔터프라이즈 플랜 지원 여부/값
     → 각 플랜 셀의 type 값:
        'check' → 검정 원 안에 체크(✓) 표시 (지원)
        'cross' → 회색 원 안에 -(−) 표시 (미지원)
        'value' → value 필드의 텍스트 표시 (예: '무제한', '100 GB')

  4. API 연동 설정 (JavaScript 영역)
     → copy_config_id : 디보(dibo) 설정 ID로 교체
     → diboToken      : 익스텐션 전역 변수로 자동 주입 (별도 선언 불필요)

  5. 데이터셋 컬럼 구성 (디보 대시보드 기준)
     → column_1: feature (기능명)
     → column_2: starter type ('check' / 'cross' / 'value')
     → column_3: starter value (type이 'value'일 때 표시할 텍스트)
     → column_4: professional type
     → column_5: professional value
     → column_6: enterprise type
     → column_7: enterprise value

=======================================================
-->
<!DOCTYPE html>
<html lang="ko">
  <head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- [수정 가능] 브라우저 탭에 표시되는 페이지 제목 -->
	<title>요금제 비교 - DIBO</title>
	<style>
	  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');

	  * {
		margin: 0;
		padding: 0;
		box-sizing: border-box;
	  }

	  body {
		font-family: 'Noto Sans KR', sans-serif;
		background: #ffffff;
		color: #1a1a1a;
		line-height: 1.6;
	  }

	  .dibo-table-container {
		max-width: 1100px;
		margin: 60px auto;
	  }

	  /* Header */
	  .dibo-table-header {
		text-align: center;
		margin-bottom: 60px;
	  }

	  .dibo-table-header h1 {
		font-size: 42px;
		font-weight: 800;
		margin-bottom: 16px;
		color: #000;
		letter-spacing: -0.02em;
	  }

	  .dibo-table-header p {
		font-size: 17px;
		color: #666;
		font-weight: 400;
		letter-spacing: -0.01em;
	  }

	  /* Comparison Table */
	  .dibo-table-comparison {
		border: 1px solid #e0e0e0;
		overflow: hidden;
		border-radius: 12px;
	  }

	  .dibo-table-head {
		display: grid;
		grid-template-columns: 2fr 1fr 1fr 1fr;
		background: #000;
		color: #fff;
	  }

	  .dibo-table-head-cell {
		padding: 24px 32px;
		font-weight: 700;
		font-size: 16px;
		text-align: center;
		border-right: 1px solid #333;
		letter-spacing: -0.01em;
	  }

	  .dibo-table-head-cell:first-child {
		text-align: left;
	  }

	  .dibo-table-head-cell:last-child {
		border-right: none;
	  }

	  .dibo-table-body {
		background: #fff;
	  }

	  .dibo-table-row {
		display: grid;
		grid-template-columns: 2fr 1fr 1fr 1fr;
		border-bottom: 1px solid #e0e0e0;
		transition: background 0.2s;
	  }

	  .dibo-table-row:hover {
		background: #fafafa;
	  }

	  .dibo-table-row:last-child {
		border-bottom: none;
	  }

	  .dibo-table-cell {
		padding: 20px 32px;
		display: flex;
		align-items: center;
		justify-content: center;
		font-size: 15px;
		border-right: 1px solid #f0f0f0;
		letter-spacing: -0.01em;
	  }

	  .dibo-table-cell:first-child {
		justify-content: flex-start;
		font-weight: 600;
		color: #1a1a1a;
	  }

	  .dibo-table-cell:last-child {
		border-right: none;
	  }

	  .dibo-table-check-icon {
		width: 24px;
		height: 24px;
		border-radius: 50%;
		background: #000;
		display: flex;
		align-items: center;
		justify-content: center;
		color: #fff;
		font-size: 12px;
		font-weight: 700;
	  }

	  .dibo-table-cross-icon {
		width: 24px;
		height: 24px;
		border-radius: 50%;
		background: #e0e0e0;
		display: flex;
		align-items: center;
		justify-content: center;
		color: #999;
		font-size: 14px;
		font-weight: 700;
	  }

	  .dibo-table-value {
		color: #666;
		font-weight: 500;
	  }

	  /* Responsive */
	  @media (max-width: 968px) {
		body {
		  padding: 60px 20px;
		}

		.dibo-table-header {
		  margin-bottom: 40px;
		}

		.dibo-table-header h1 {
		  font-size: 32px;
		}

		.dibo-table-header p {
		  font-size: 16px;
		}

		.dibo-table-comparison {
		  overflow-x: auto;
		}

		.dibo-table-head,
		.dibo-table-row {
		  min-width: 800px;
		}

		.dibo-table-head-cell,
		.dibo-table-cell {
		  font-size: 14px;
		  padding: 16px 20px;
		}
	  }

	  @media (max-width: 480px) {
		body {
		  padding: 40px 16px;
		}

		.dibo-table-header h1 {
		  font-size: 28px;
		}

		.dibo-table-header p {
		  font-size: 15px;
		}

		.dibo-table-head-cell,
		.dibo-table-cell {
		  font-size: 13px;
		  padding: 14px 16px;
		}
	  }
	</style>
  </head>
  <body>
	<div class="dibo-table-container">
	  <div class="dibo-table-header">
		<!-- [수정 가능] 섹션 메인 제목 -->
		<h1>기능 비교</h1>
		<!-- [수정 가능] 섹션 설명 문구 -->
		<p>모든 요금제의 상세 기능을 비교해보세요</p>
	  </div>

	  <div class="dibo-table-comparison">
		<!-- 테이블 헤더 - 플랜명 -->
		<div class="dibo-table-head">
		  <div class="dibo-table-head-cell">기능</div>
		  <!-- [수정 가능] 각 열의 플랜 이름 -->
		  <div class="dibo-table-head-cell">STARTER</div>
		  <div class="dibo-table-head-cell">PROFESSIONAL</div>
		  <div class="dibo-table-head-cell">ENTERPRISE</div>
		</div>

		<!-- Body -->
		<div class="dibo-table-body" id="tableBody">
		  <!-- Rows will be rendered here -->
		</div>
	  </div>
	</div>

	<script>
	  // ★ [수정 가능] 요금제 비교 기본 데이터 (API 연동 전 화면에 표시될 임시 데이터)
	  // API 연동이 완료되면 아래 데이터는 자동으로 디보 데이터셋 내용으로 대체됩니다.
	  // 각 셀의 type 값:
	  //   'check' → ✓ 지원 (검정 원 아이콘)
	  //   'cross' → − 미지원 (회색 원 아이콘)
	  //   'value' → value 필드 텍스트 표시 (예: '무제한', '100 GB', '제한적')
	  let comparisonData = [
		{
		  feature: '무료 기본 기능',          // 기능명
		  starter: { type: 'check' },         // 스타터 플랜
		  professional: { type: 'check' },    // 프로페셔널 플랜
		  enterprise: { type: 'check' }       // 엔터프라이즈 플랜
		},
		{
		  feature: '코드 출력 접근',
		  starter: { type: 'check' },
		  professional: { type: 'value', value: '무제한' },
		  enterprise: { type: 'value', value: '무제한' }
		},
		{
		  feature: '커뮤니티 지원',
		  starter: { type: 'check' },
		  professional: { type: 'check' },
		  enterprise: { type: 'check' }
		},
		{
		  feature: '기본 AI 스케치',
		  starter: { type: 'check' },
		  professional: { type: 'check' },
		  enterprise: { type: 'check' }
		},
		{
		  feature: '저장 공간 용량',
		  starter: { type: 'value', value: '100 GB' },
		  professional: { type: 'value', value: '600 GB' },
		  enterprise: { type: 'value', value: '1 TB' }
		},
		{
		  feature: '모든 기능 전체 접근',
		  starter: { type: 'cross' },
		  professional: { type: 'check' },
		  enterprise: { type: 'check' }
		},
		{
		  feature: '파일 임베드',
		  starter: { type: 'cross' },
		  professional: { type: 'check' },
		  enterprise: { type: 'check' }
		},
		{
		  feature: '실시간 화이트보드 협업',
		  starter: { type: 'cross' },
		  professional: { type: 'check' },
		  enterprise: { type: 'check' }
		},
		{
		  feature: '업데이트 탭',
		  starter: { type: 'value', value: '제한적' },
		  professional: { type: 'check' },
		  enterprise: { type: 'check' }
		},
		{
		  feature: '줌 연동',
		  starter: { type: 'value', value: '제한적' },
		  professional: { type: 'value', value: '제한적' },
		  enterprise: { type: 'value', value: '무제한' }
		},
		{
		  feature: '공개 양식',
		  starter: { type: 'check' },
		  professional: { type: 'check' },
		  enterprise: { type: 'check' }
		},
		{
		  feature: '맞춤형 알림',
		  starter: { type: 'check' },
		  professional: { type: 'check' },
		  enterprise: { type: 'check' }
		}
	  ];

	  // 비교 테이블 렌더링
	  function renderComparisonTable() {
		const tbody = document.getElementById('tableBody');

		if (comparisonData.length === 0) {
		  tbody.innerHTML = `
            <div class="dibo-table-row">
                <div class="dibo-table-cell" style="grid-column: 1 / -1; justify-content: center; color: #999;">
                    데이터를 불러오는 중...
                </div>
            </div>
        `;
		  return;
		}

		tbody.innerHTML = comparisonData.map(row => `
            <div class="dibo-table-row">
                <div class="dibo-table-cell">${row.feature}</div>
                ${renderCell(row.starter)}
                ${renderCell(row.professional)}
                ${renderCell(row.enterprise)}
            </div>
        `).join('');
	  }

	  function renderCell(cell) {
		if (cell.type === 'check') {
		  return '<div class="dibo-table-cell"><div class="dibo-table-check-icon">✓</div></div>';
		} else if (cell.type === 'cross') {
		  return '<div class="dibo-table-cell"><div class="dibo-table-cross-icon">−</div></div>';
		} else if (cell.type === 'value') {
		  return `<div class="dibo-table-cell"><span class="dibo-table-value">${cell.value}</span></div>`;
		}
		return '<div class="dibo-table-cell">−</div>';
	  }

	  // 1단계: config_id로 데이터셋 ID 조회
	  const fetchIdData = async () => {
		try {
		  const res = await axios.get(
			`https://api.di-bo.me/edit-set?config_id=copy_config_id`,
			{ headers: { 'access-token': diboToken } }
		  );

		  if (res.data && res.data.length > 0) {
			globaltableId = res.data[0].id;
			await fetchPricingData();
		  }
		} catch (error) {
		  console.error('ID 로드 실패:', error);
		}
	  };

	  // 2단계: 비교 데이터 조회 및 테이블 렌더링
	  // 컬럼 매핑 (디보 데이터셋 컬럼 순서와 일치해야 합니다):
	  //   column_1 → feature (기능명)
	  //   column_2 → starter type ('check' / 'cross' / 'value')
	  //   column_3 → starter value (type='value' 일 때 표시할 텍스트)
	  //   column_4 → professional type
	  //   column_5 → professional value
	  //   column_6 → enterprise type
	  //   column_7 → enterprise value
	  const fetchPricingData = async () => {
		if (!globaltableId) return;

		try {
		  const res = await axios.get(
			`https://api.di-bo.me/edit-set/${globaltableId}/rows?config_id=copy_config_id`,
			{ headers: { 'access-token': diboToken } }
		  );

		  const instData = res.data || [];

		  // comparisonData 초기화
		  comparisonData = [];

		  // 순서대로 데이터 추가
		  for (let i = 0; i < instData.length; i++) {
			comparisonData.push({
			  feature: instData[i].column_1 || '',
			  starter: {
				type: instData[i].column_2 || 'cross',
				value: instData[i].column_3 || ''
			  },
			  professional: {
				type: instData[i].column_4 || 'cross',
				value: instData[i].column_5 || ''
			  },
			  enterprise: {
				type: instData[i].column_6 || 'cross',
				value: instData[i].column_7 || ''
			  }
			});
		  }

		  // 테이블 렌더링
		  renderComparisonTable();

		} catch (error) {
		  console.error('데이터 로드 실패:', error);
		}
	  };

	  // 초기 로딩 표시
	  renderComparisonTable();

	  // 최초 실행
	  fetchIdData();
	</script>
  </body>
</html>
