<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이메일 인증 코드</title>
</head>
<body>
<table style="width:100%;background-color:#f5f5f5;padding:50px;font-family:Arial,sans-serif">
    <tbody>
        <tr>
            <td style="width:100%;background-color:white;padding:50px 60px">

                <!-- 서비스명 -->
                <p style="margin:0 0 20px 0;font-weight:700;font-size:22px;color:#333">{{SERVICE_NAME}}</p>

                <!-- 제목 -->
                <p style="margin:0;font-weight:700;font-size:28px;color:#333">
                    이메일 인증 코드를 발송해 드립니다
                </p>

                <!-- 수신자 인사 -->
                <p style="margin:30px 0 0 0;font-weight:500;font-size:18px;color:#333">
                    <span style="font-weight:600;font-size:22px">{{USER_EMAIL}}</span>님, 안녕하세요?
                </p>
                <p style="margin:4px 0 0 0;font-weight:500;font-size:14px;color:#a9a9a9">
                    아래 인증코드를 입력해 이메일 인증을 완료해 주세요.
                </p>

                <!-- 인증 코드 -->
                <p style="margin:60px 0 0 0;text-align:center">
                    <span style="display:inline-block;background-color:#f2f2f2;color:#333;font-size:32px;font-weight:700;padding:18px 40px;border-radius:8px;letter-spacing:8px">
                        {{AUTH_CODE}}
                    </span>
                </p>

                <!-- 유효 시간 안내 -->
                <p style="margin:20px 0 0 0;text-align:center;font-size:13px;color:#a9a9a9">
                    인증코드는 {{EXPIRE_MINUTES}}분간 유효합니다.
                </p>

                <!-- 서비스 이동 버튼 -->
                <p style="margin:30px 0 50px 0;text-align:center">
                    <a
                        style="display:inline-block;text-decoration:none;background-color:#333;color:white;font-size:16px;font-weight:600;padding:15px 20px;border-radius:4px"
                        href="{{SERVICE_URL}}"
                        target="_blank"
                    >
                        {{SERVICE_NAME}}으로 이동하기
                    </a>
                </p>

            </td>
        </tr>
    </tbody>
</table>
</body>
</html>
