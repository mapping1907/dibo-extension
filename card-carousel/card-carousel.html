<!--
=======================================================
  카드 슬라이더 / 캐러셀 - 사용 가이드
=======================================================

【페이지 개요】
  여러 장의 카드를 좌우로 넘겨볼 수 있는 슬라이더입니다.
  후기, 포트폴리오, 기능 설명, 서비스 사례 등에 활용하세요.
  PC 3장 / 태블릿 2장 / 모바일 1장(다음 카드 살짝 노출)이 표시됩니다.
  API 연동 시 입력폼 데이터를 자동으로 불러와 카드로 표시합니다.

【사용 전 필수 설정】
  1. 섹션 헤더 수정
     → HTML의 .dibo-cc-badge, .dibo-cc-title, .dibo-cc-subtitle 텍스트 직접 수정

  2. 카드 데이터 수정 (JavaScript cardsData 배열)
     → image       : 카드 상단 이미지 URL ('' 빈 문자열 설정 시 이미지 미표시)
     → tag         : 카드 카테고리 레이블 (예: '고객 후기', '포트폴리오')
     → rating      : 별점 1~5 (0 또는 미설정 시 별점 미표시)
     → title       : 카드 제목 (최대 2줄 표시 후 말줄임)
     → description : 카드 설명 (최대 3줄 표시 후 말줄임)
     → name        : 작성자 이름 ('' 또는 미설정 시 하단 영역 미표시)
     → avatar      : 작성자 프로필 이미지 URL
     → date        : 날짜 또는 출처 표기 (예: '2025.03')

  3. 카드 추가 / 삭제
     → cardsData 배열에 항목을 추가하거나 삭제하면 자동 반영됩니다.

  4. 섹션 배경색 변경
     → .dibo-cc-section { background: #f8f8f8 } 값 변경

  5. 카드 호버 색상 변경
     → .dibo-cc-arrow:hover의 background 색상 변경

  6. API 자동 연동 (디보 입력폼)
     → API 연동 성공 시: 입력폼 데이터가 자동으로 카드에 표시됩니다.
     → API 연동 실패 시: 아래 cardsData 로컬 데이터가 대신 사용됩니다.
     → 입력폼 컬럼 이름을 아래 값으로 설정하면 자동 매핑됩니다.
        제목 / title       → 카드 제목
        설명 / description → 카드 설명
        태그 / tag         → 카테고리 태그
        별점 / rating      → 별점 (1~5)
        이미지 / image     → 카드 이미지 URL
        이름 / name        → 작성자 이름
        프로필 / avatar    → 작성자 프로필 이미지 URL
        날짜 / date        → 날짜 표기

=======================================================
-->

        width: calc(100% - 32px);
      }

    }

      'rating': 'rating',
      'title': 'title',
      'description': 'description', 'content': 'description',
      'name': 'name', 'author': 'name',
      'avatar': 'avatar', 'profile': 'avatar',
      'date': 'date',
    };

    // 입력폼 목록 조회 → form_id 및 column_set 획득
    async function fetchIdData() {
      const res = await axios.get(`https://api.di-bo.me/edit-set?config_id=${CONFIG_ID}`);
      return res.data;
    }

    // 특정 입력폼의 모든 행(row) 데이터 조회
    async function fetchListData(form_id) {
      const res = await axios.get(`https://api.di-bo.me/edit-set/${form_id}/rows?config_id=${CONFIG_ID}`);
      return res.data;
    }

    // API 행 데이터 → 카드 데이터 형식으로 변환
    function mapRowsToCards(rows, columnSet) {
      // columnSet의 column_name을 기준으로 카드 필드 매핑 생성
      const fieldMap = {};
      (columnSet || []).forEach(col => {
        const nameKey = (col.column_name || '').toLowerCase().trim();
        const cardField = COLUMN_FIELD_MAP[nameKey];
        if (cardField) fieldMap[col.column] = cardField;
      });

      return rows
        .map(row => {
          const card = {};
          Object.entries(fieldMap).forEach(([colKey, cardField]) => {
            let val = row[colKey] ?? '';
            if (cardField === 'rating') val = Number(val) || 0;
            card[cardField] = val;
          });
          return card;
        })
        .filter(card => card.title || card.description); // 최소한 제목 또는 설명이 있는 카드만 표시
    }

    // ─── 캐러셀 초기화 (API 연동 → 렌더링) ──────────────
    async function initCarousel() {
      try {
        const idData = await fetchIdData();
        if (idData && idData.length > 0) {
          const form = idData[0];
          const columnSet = form.column_set || [];
          const rows = await fetchListData(form.id);
          if (rows && rows.length > 0) {
            const apiCards = mapRowsToCards(rows, columnSet);
            if (apiCards.length > 0) {
              cardsData = apiCards; // API 데이터로 교체
            }
          }
        }
      } catch (err) {
        console.warn('카드 API 연동 실패 — 기본 데이터를 사용합니다.', err);
      }
      build();
      updateArrows();
    }

    // ─── 렌더링 및 동작 로직 (수정 불필요) ────────────────

    const track    = document.getElementById('ccTrack');
    const viewport = document.getElementById('ccViewport');
    const btnPrev  = document.getElementById('ccPrev');
    const btnNext  = document.getElementById('ccNext');

    let current   = 0;
    let isDragging = false;
    let startX    = 0;
    let dragDelta = 0;

    // 별점 HTML 생성
    function renderStars(rating) {
      if (!rating) return '';
      return `<div class="dibo-cc-stars">${'★'.repeat(rating)}${'☆'.repeat(5 - rating)}</div>`;
    }

    // 카드 HTML 생성
    function build() {
      track.innerHTML = cardsData.map(card => `
        <div class="dibo-cc-card">
          ${card.image ? `
            <div class="dibo-cc-card-img-wrap">
              <img src="${card.image}" alt="${card.title}" loading="lazy" />
            </div>` : ''}
          <div class="dibo-cc-card-body">
            <div class="dibo-cc-card-meta">
              <span class="dibo-cc-card-tag">${card.tag || ''}</span>
              ${renderStars(card.rating)}
            </div>
            <h3 class="dibo-cc-card-title">${card.title}</h3>
            <p class="dibo-cc-card-desc">${card.description}</p>
            ${card.name ? `
              <div class="dibo-cc-card-footer">
                <div class="dibo-cc-author-wrap">
                  ${card.avatar ? `<img class="dibo-cc-avatar" src="${card.avatar}" alt="${card.name}" />` : ''}
                  <span class="dibo-cc-author-name">${card.name}</span>
                </div>
                <span class="dibo-cc-card-date">${card.date || ''}</span>
              </div>` : ''}
          </div>
        </div>
      `).join('');
    }

    // 카드 1장 너비 + gap 계산
    function getStep() {
      const card = track.querySelector('.dibo-cc-card');
      if (!card) return 0;
      const gap = parseInt(window.getComputedStyle(track).gap) || 24;
      return card.offsetWidth + gap;
    }

    // 현재 보이는 카드 수
    function getVisibleCount() {
      const step = getStep();
      return step > 0 ? Math.round(viewport.offsetWidth / step) : 1;
    }

    // 최대 슬라이드 인덱스
    function getMaxIndex() {
      return Math.max(0, cardsData.length - getVisibleCount());
    }

    // 이동
    function moveTo(index, animate = true) {
      current = Math.max(0, Math.min(index, getMaxIndex()));
      track.style.transition = animate
        ? 'transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)'
        : 'none';
      track.style.transform = `translateX(${-current * getStep()}px)`;
      updateArrows();
    }

    // 화살표 활성/비활성 상태 업데이트
    function updateArrows() {
      btnPrev.disabled = current <= 0;
      btnNext.disabled = current >= getMaxIndex();
    }

    // 화살표 클릭
    btnPrev.addEventListener('click', () => moveTo(current - 1));
    btnNext.addEventListener('click', () => moveTo(current + 1));

    // 키보드 방향키
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft')  moveTo(current - 1);
      if (e.key === 'ArrowRight') moveTo(current + 1);
    });

    // 드래그 / 터치 스와이프
    function getX(e) {
      return e.touches ? e.touches[0].clientX : e.clientX;
    }

    function onDragStart(e) {
      if (e.type === 'mousedown' && e.button !== 0) return;
      isDragging = true;
      dragDelta  = 0;
      startX     = getX(e);
      track.style.transition = 'none';
      viewport.classList.add('is-dragging');
    }

    function onDragMove(e) {
      if (!isDragging) return;
      dragDelta = getX(e) - startX;
      const base = -current * getStep();
      track.style.transform = `translateX(${base + dragDelta}px)`;
    }

    function onDragEnd() {
      if (!isDragging) return;
      isDragging = false;
      viewport.classList.remove('is-dragging');

      // 카드 너비의 25% 이상 드래그 시 전환
      const threshold = getStep() * 0.25;
      if      (dragDelta < -threshold) moveTo(current + 1);
      else if (dragDelta >  threshold) moveTo(current - 1);
      else moveTo(current); // 미달 시 원위치
    }

    // 드래그 후 카드 내부 링크 클릭 방지
    track.addEventListener('click', e => {
      if (Math.abs(dragDelta) > 5) e.preventDefault();
    });

    // 마우스 이벤트
    viewport.addEventListener('mousedown', onDragStart);
    window.addEventListener('mousemove', onDragMove);
    window.addEventListener('mouseup', onDragEnd);

    // 터치 이벤트
    viewport.addEventListener('touchstart', onDragStart, { passive: true });
    viewport.addEventListener('touchmove',  onDragMove,  { passive: true });
    viewport.addEventListener('touchend',   onDragEnd);

    // 창 크기 변경 시 위치 재계산
    window.addEventListener('resize', () => moveTo(current, false));

    // 초기화 (API 연동 후 렌더링)
    initCarousel();
  </script>

</body>
</html>
