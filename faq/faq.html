<!--
=======================================================
  FAQ 페이지 - 사용 가이드
=======================================================

【페이지 개요】
  카테고리별 자주 묻는 질문(FAQ) 목록과 검색 기능을 제공하는 페이지입니다.
  API 연동 전에는 faqData 배열의 로컬 데이터가 표시되며,
  연동 후에는 디보(dibo) 데이터셋의 내용으로 자동 대체됩니다.

【사용 전 필수 설정】
  아래 항목들을 수정하여 서비스에 맞게 커스터마이징하세요.

  1. 페이지 제목 / 설명 수정
     → <body> 내 h1, p 태그 텍스트 직접 수정

  2. FAQ 기본 데이터 수정 (API 연동 전 임시 데이터)
     → faqData 배열 내 항목 수정/추가/삭제
     → 각 항목: category(영문ID), categoryName(표시명), question(질문), answer(답변)

  3. API 연동 설정 (JavaScript 영역)
     → copy_config_id : 디보(dibo) 설정 ID로 교체
     → diboToken     : 익스텐션 전역 변수로 자동 주입 (별도 선언 불필요)

  4. 데이터셋 컬럼 구성 (디보 대시보드 기준)
     → column_1: category (영문 ID)
     → column_2: categoryName (카테고리 표시명)
     → column_3: question (질문)
     → column_4: answer (답변)

=======================================================
-->
<!DOCTYPE html>

		},
		{
		  category: 'technical',
		  categoryName: '기술지원',

	  // Initialize
	  const faqList = document.getElementById('faqList');
	  const searchInput = document.getElementById('searchInput');

	  const categoryList = document.getElementById('categoryList');

	  let currentCategory = 'all';

	  // Render Categories (동적 생성)
	  function renderCategories(data) {
		// 중복 제거: categoryName 기준
		const uniqueCategories = [];
		const seenNames = new Set();

		data.forEach(item => {
		  if (!seenNames.has(item.categoryName)) {
			seenNames.add(item.categoryName);
			uniqueCategories.push({
			  category: item.category,
			  categoryName: item.categoryName
			});
		  }
		});

		// "전체보기"를 제외한 나머지 카테고리 추가
		const categoryHTML = uniqueCategories.map(cat => `
            <li class="dibo-faq-category-item">
                <a href="#" class="dibo-faq-category-link" data-category="${cat.category}">${cat.categoryName}</a>
            </li>
        `).join('');

		// 전체보기 뒤에 추가
		categoryList.innerHTML = `
            <li class="dibo-faq-category-item">
                <a href="#" class="dibo-faq-category-link active" data-category="all">전체보기</a>
            </li>
        ${categoryHTML}
        `;

		// 이벤트 리스너 재등록
		attachCategoryEvents();
	  }

	  // Category 클릭 이벤트 등록
	  function attachCategoryEvents() {
		const categoryLinks = document.querySelectorAll('.dibo-faq-category-link');
		categoryLinks.forEach(link => {
		  link.addEventListener('click', function(e) {
			e.preventDefault();
			categoryLinks.forEach(l => l.classList.remove('active'));
			this.classList.add('active');
			currentCategory = this.dataset.category;
			filterFAQs();
		  });
		});
	  }

	  // Render FAQ items
	  function renderFAQs(data) {
		faqList.innerHTML = data.map(item => `
            <div class="dibo-faq-item" data-category="${item.category}">
                <div class="dibo-faq-question">
                    <div class="dibo-faq-q-icon">Q</div>
                    <div class="dibo-faq-question-content">
                        <div class="dibo-faq-category-tag">${item.categoryName}</div>
                        <div class="dibo-faq-question-text">${item.question}</div>
                    </div>
                    <span class="dibo-faq-arrow"></span>
                </div>
                <div class="dibo-faq-answer">
                    <div class="dibo-faq-answer-content">${item.answer}</div>
                </div>
            </div>
        `).join('');

		// Add click event to questions
		document.querySelectorAll('.dibo-faq-question').forEach(question => {
		  question.addEventListener('click', function() {
			const item = this.closest('.dibo-faq-item');
			const wasActive = item.classList.contains('active');

			// Close all other items
			document.querySelectorAll('.dibo-faq-item').forEach(faq => {
			  faq.classList.remove('active');
			});

			// Toggle current item
			if (!wasActive) {
			  item.classList.add('active');
			}
		  });
		});
	  }

	  // Filter FAQs
	  function filterFAQs() {
		const searchTerm = searchInput.value.toLowerCase();
		const items = document.querySelectorAll('.dibo-faq-item');
		let visibleCount = 0;

		items.forEach(item => {
		  const question = item.querySelector('.dibo-faq-question-text').textContent.toLowerCase();
		  const answer = item.querySelector('.dibo-faq-answer-content').textContent.toLowerCase();
		  const category = item.dataset.category;
		  const matchesSearch = question.includes(searchTerm) || answer.includes(searchTerm);
		  const matchesCategory = currentCategory === 'all' || category === currentCategory;

		  if (matchesSearch && matchesCategory) {
			item.classList.remove('hidden');
			visibleCount++;
		  } else {
			item.classList.add('hidden');
		  }
		});

		// Show/hide no results message
		if (visibleCount === 0) {
		  noResults.classList.add('show');
		} else {
		  noResults.classList.remove('show');
		}
	  }

	  // Search input
	  searchInput.addEventListener('input', filterFAQs);

	  // Initial render
	  renderCategories(faqData);
	  renderFAQs(faqData);

	  // ------------------------
	  // DIBO API 연동
	  // ------------------------

	  // 1단계: config_id로 데이터셋 ID 조회
	  const fetchIdData = async () => {
		try {
		  const res = await axios.get(
			`https://api.di-bo.me/edit-set?config_id=copy_config_id`,
			{ headers: { 'access-token': diboToken } }
		  );

		  if (res.data && res.data.length > 0) {
			globalfaqId = res.data[0].id;
			await fetchFaqData();
		  }
		} catch (error) {
		  console.error('ID 로드 실패:', error);
		}
	  };

	  // 2단계: FAQ 데이터 조회 및 화면 렌더링
	  // 컬럼 매핑 (디보 데이터셋 컬럼 순서와 일치해야 합니다):
	  //   column_1 → category (카테고리 영문 ID)
	  //   column_2 → categoryName (카테고리 표시명)
	  //   column_3 → question (질문)
	  //   column_4 → answer (답변)
	  const fetchFaqData = async () => {
		if (!globalfaqId) return;

		try {
		  const res = await axios.get(
			`https://api.di-bo.me/edit-set/${globalfaqId}/rows?config_id=copy_config_id`,
			{ headers: { 'access-token': diboToken } }
		  );

		  const instData = res.data || [];

		  // ✅ faqData 초기화
		  faqData = [];

		  // ✅ 순서대로 append
		  for (let i = 0; i < instData.length; i++) {
			faqData.push({
			  category: instData[i].column_1,
			  categoryName: instData[i].column_2,
			  question: instData[i].column_3,
			  answer: instData[i].column_4
			});
		  }

		  // ✅ 카테고리 + FAQ 렌더링 + 필터 재적용
		  renderCategories(faqData);
		  renderFAQs(faqData);
		  filterFAQs();

		} catch (error) {
		  console.error('데이터 로드 실패:', error);
		}
	  };

	  // 최초 실행
	  fetchIdData();
	</script>
  </body>
</html>
