<!--
=======================================================
  카테고리 필터형 콘텐츠 리스트 - 사용 가이드
=======================================================

【페이지 개요】
  카테고리 버튼 클릭으로 콘텐츠를 즉시 필터링하는 그리드 섹션입니다.
  포트폴리오, 시공사례, 프로젝트, 블로그형 콘텐츠 등에 활용하세요.
  카테고리는 cardsData 배열에서 자동으로 추출되어 버튼이 생성됩니다.

【사용 전 필수 설정】
  1. 섹션 헤더 수정
     → HTML의 .dibo-fc-badge, .dibo-fc-title, .dibo-fc-subtitle 텍스트 직접 수정

  2. 카드 데이터 수정 (JavaScript cardsData 배열)
     → category     : 필터링 기준 영문 ID (예: 'interior', 'web')
     → categoryName : 카드 및 버튼에 표시될 카테고리 이름 (예: '인테리어', '웹')
     → image        : 카드 이미지 URL ('' 설정 시 이미지 영역 미표시)
     → title        : 카드 제목
     → description  : 카드 설명 (2줄 초과 시 말줄임 처리)
     → date         : 날짜 또는 출처 표기 (예: '2025.03')
     → link         : 카드 클릭 시 이동할 URL ('#'으로 설정 시 이동 없음)

  3. 카드 추가 / 삭제
     → cardsData 배열에 항목을 추가/삭제하면 카드와 카테고리 버튼이 자동 반영됩니다.

  4. 섹션 배경색 변경
     → .dibo-fc-section { background: } 값 변경

=======================================================
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- [수정 가능] 브라우저 탭에 표시되는 페이지 제목 -->
  <title>포트폴리오</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #ffffff;
    }

    /* ===== 섹션 ===== */
    /* [수정 가능] 섹션 배경색 */
    .dibo-fc-section {
      padding: 80px 0;
      background: #ffffff;
    }

    .dibo-fc-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 40px;
    }

    /* ===== 섹션 헤더 ===== */
    .dibo-fc-header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 48px;
    }

    .dibo-fc-badge {
      display: inline-block;
      background: #000;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 5px 14px;
      border-radius: 100px;
      align-self: flex-start;
    }

    .dibo-fc-title {
      font-size: 38px;
      font-weight: 800;
      color: #000;
      letter-spacing: -0.03em;
      line-height: 1.25;
    }

    .dibo-fc-subtitle {
      font-size: 17px;
      color: #666;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    /* ===== 필터 탭 + 카운트 행 ===== */
    .dibo-fc-filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 36px;
    }

    /* 탭 가로 스크롤 (모바일) */
    .dibo-fc-tabs-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      flex: 1;
    }

    .dibo-fc-tabs-wrap::-webkit-scrollbar {
      display: none;
    }

    .dibo-fc-tabs {
      display: flex;
      gap: 8px;
      width: max-content;
    }

    .dibo-fc-tab {
      flex-shrink: 0;
      padding: 10px 22px;
      border-radius: 100px;
      border: 1.5px solid #e0e0e0;
      background: #fff;
      color: #666;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .dibo-fc-tab:hover {
      border-color: #999;
      color: #333;
    }

    .dibo-fc-tab.active {
      background: #000;
      border-color: #000;
      color: #fff;
      font-weight: 700;
    }

    /* 카운트 표시 */
    .dibo-fc-count {
      font-size: 14px;
      color: #999;
      font-weight: 400;
      letter-spacing: -0.01em;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .dibo-fc-count strong {
      color: #1a1a1a;
      font-weight: 700;
    }

    /* ===== 카드 그리드 ===== */
    /* [수정 가능] 3 → 원하는 열 수로 변경 (grid-template-columns) */
    .dibo-fc-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    /* ===== 카드 진입 애니메이션 ===== */
    @keyframes dibo-fc-in {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== 카드 ===== */
    .dibo-fc-card {
      display: block;
      text-decoration: none;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #eee;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: dibo-fc-in 0.4s var(--anim-delay, 0s) ease both;
    }

    .dibo-fc-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.1);
    }

    .dibo-fc-card.is-hidden {
      display: none;
    }

    /* 카드 이미지 영역 */
    .dibo-fc-card-img {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #e8e8e8;
    }

    .dibo-fc-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .dibo-fc-card:hover .dibo-fc-card-img img {
      transform: scale(1.06);
    }

    /* 이미지 위 카테고리 레이블 */
    .dibo-fc-card-img-tag {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 100px;
      letter-spacing: -0.01em;
      backdrop-filter: blur(4px);
    }

    /* 카드 본문 */
    .dibo-fc-card-body {
      padding: 20px 22px 22px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dibo-fc-card-title {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.02em;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .dibo-fc-card-desc {
      font-size: 14px;
      color: #777;
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.7;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 카드 하단 */
    .dibo-fc-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
      padding-top: 14px;
      border-top: 1px solid #f0f0f0;
    }

    .dibo-fc-card-date {
      font-size: 13px;
      color: #aaa;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .dibo-fc-card-link {
      font-size: 13px;
      font-weight: 600;
      color: #333;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s, gap 0.2s;
    }

    .dibo-fc-card:hover .dibo-fc-card-link {
      color: #000;
      gap: 7px;
    }

    /* 빈 결과 */
    .dibo-fc-empty {
      display: none;
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
    }

    .dibo-fc-empty.show {
      display: block;
    }

    .dibo-fc-empty p {
      font-size: 17px;
      color: #aaa;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    /* ===== 반응형: 태블릿 ===== */
    @media (max-width: 960px) {
      .dibo-fc-section { padding: 60px 0; }
      .dibo-fc-container { padding: 0 24px; }
      .dibo-fc-title { font-size: 32px; }
      .dibo-fc-subtitle { font-size: 15px; }
      .dibo-fc-header { margin-bottom: 40px; }
      .dibo-fc-filter-row { margin-bottom: 28px; }

      .dibo-fc-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
    }

    /* ===== 반응형: 모바일 ===== */
    @media (max-width: 599px) {
      .dibo-fc-section { padding: 48px 0; }
      .dibo-fc-container { padding: 0 16px; }
      .dibo-fc-title { font-size: 26px; }
      .dibo-fc-subtitle { font-size: 14px; }
      .dibo-fc-header { margin-bottom: 32px; gap: 10px; }

      .dibo-fc-tab {
        padding: 9px 16px;
        font-size: 13px;
      }

      .dibo-fc-count { font-size: 13px; }

      .dibo-fc-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .dibo-fc-card-body { padding: 14px 16px 16px; gap: 6px; }
      .dibo-fc-card-title { font-size: 14px; }
      .dibo-fc-card-desc { display: none; } /* 모바일에서 설명 숨김 */
      .dibo-fc-card-img-tag { font-size: 11px; padding: 3px 8px; }
    }
  </style>
</head>
<body>

  <section class="dibo-fc-section">
    <div class="dibo-fc-container">

      <!-- 섹션 헤더 -->
      <div class="dibo-fc-header">
        <!-- [수정 가능] 섹션 뱃지 -->
        <span class="dibo-fc-badge">PORTFOLIO</span>
        <!-- [수정 가능] 섹션 메인 제목 -->
        <h2 class="dibo-fc-title">포트폴리오</h2>
        <!-- [수정 가능] 섹션 부제목 -->
        <p class="dibo-fc-subtitle">다양한 프로젝트 사례를 카테고리별로 확인하세요</p>
      </div>

      <!-- 필터 탭 + 결과 카운트 -->
      <div class="dibo-fc-filter-row">
        <div class="dibo-fc-tabs-wrap">
          <!-- 카테고리 버튼 (cardsData 기반으로 자동 생성) -->
          <div class="dibo-fc-tabs" id="diboFcTabs"></div>
        </div>
        <div class="dibo-fc-count">
          <strong id="diboFcCount">0</strong>개
        </div>
      </div>

      <!-- 카드 그리드 -->
      <div class="dibo-fc-grid" id="diboFcGrid">
        <!-- 카드 (JS로 자동 생성) -->
        <div class="dibo-fc-empty" id="diboFcEmpty">
          <p>해당 카테고리의 콘텐츠가 없습니다</p>
        </div>
      </div>

    </div>
  </section>

  <script>
    // ★ [수정 가능] 카드 데이터
    // 항목 추가/삭제 시 카드와 카테고리 버튼이 자동으로 반영됩니다.
    //
    //   category     : 필터링 기준 영문 ID (버튼 data-filter 값으로 사용)
    //   categoryName : 카드 및 버튼에 표시될 한글 이름
    //   image        : 카드 이미지 URL ('' 설정 시 이미지 영역 미표시)
    //   title        : 카드 제목
    //   description  : 카드 설명 (2줄 이상은 말줄임 처리)
    //   date         : 날짜 또는 출처 표기
    //   link         : 카드 클릭 시 이동 URL
    const cardsData = [
      {
        category: 'interior',
        categoryName: '인테리어',
        image: 'https://picsum.photos/seed/fc-i1/480/360',
        title: '모던 미니멀 거실 인테리어',
        description: '화이트 베이스에 우드 소재를 접목한 따뜻한 감성의 거실 공간.',
        date: '2025.01',
        link: '#'
      },
      {
        category: 'interior',
        categoryName: '인테리어',
        image: 'https://picsum.photos/seed/fc-i2/480/360',
        title: '주방 리모델링 전/후 비교',
        description: '노후화된 주방을 아일랜드 키친으로 탈바꿈. 수납 공간도 2배로 늘렸습니다.',
        date: '2025.01',
        link: '#'
      },
      {
        category: 'interior',
        categoryName: '인테리어',
        image: 'https://picsum.photos/seed/fc-i3/480/360',
        title: '원룸 인테리어 스타일링',
        description: '작은 공간도 영리하게. 가구 배치와 조명 하나로 넓어 보이는 원룸 연출.',
        date: '2025.02',
        link: '#'
      },
      {
        category: 'exterior',
        categoryName: '외관/외장',
        image: 'https://picsum.photos/seed/fc-e1/480/360',
        title: '단독주택 외벽 리뉴얼',
        description: '낡은 외벽을 갈아입혀 새집처럼. 방수 처리와 단열재를 함께 시공했습니다.',
        date: '2025.01',
        link: '#'
      },
      {
        category: 'exterior',
        categoryName: '외관/외장',
        image: 'https://picsum.photos/seed/fc-e2/480/360',
        title: '카페 간판 및 파사드 시공',
        description: '브랜드 아이덴티티에 맞는 파사드 디자인으로 유동인구 유입 증가.',
        date: '2025.02',
        link: '#'
      },
      {
        category: 'exterior',
        categoryName: '외관/외장',
        image: 'https://picsum.photos/seed/fc-e3/480/360',
        title: '빌라 공용 현관 개선',
        description: '노후 빌라 공용부분 개선 프로젝트. 타일 교체부터 도어 교체까지 일괄 시공.',
        date: '2025.02',
        link: '#'
      },
      {
        category: 'commercial',
        categoryName: '상업공간',
        image: 'https://picsum.photos/seed/fc-c1/480/360',
        title: '강남 뷰티샵 인테리어',
        description: '프리미엄 뷰티 브랜드에 맞는 고급스러운 공간. 조명과 자재 선택이 포인트.',
        date: '2025.02',
        link: '#'
      },
      {
        category: 'commercial',
        categoryName: '상업공간',
        image: 'https://picsum.photos/seed/fc-c2/480/360',
        title: '소형 카페 풀패키지 시공',
        description: '15평 소형 카페를 감성적으로. 인테리어부터 가구 제작까지 토털 솔루션.',
        date: '2025.03',
        link: '#'
      },
      {
        category: 'commercial',
        categoryName: '상업공간',
        image: 'https://picsum.photos/seed/fc-c3/480/360',
        title: '의원 대기실 환경 개선',
        description: '환자 경험을 높이는 편안한 대기 공간. 소음 차단과 동선 최적화에 집중.',
        date: '2025.03',
        link: '#'
      },
      {
        category: 'residential',
        categoryName: '주거공간',
        image: 'https://picsum.photos/seed/fc-r1/480/360',
        title: '30평대 아파트 전체 리모델링',
        description: '오래된 아파트를 신축 느낌으로. 오픈형 구조 변경으로 공간감이 대폭 향상.',
        date: '2025.01',
        link: '#'
      },
      {
        category: 'residential',
        categoryName: '주거공간',
        image: 'https://picsum.photos/seed/fc-r2/480/360',
        title: '신혼부부 드림 하우스',
        description: '신혼 라이프스타일에 맞춘 맞춤형 주거 설계. 수납과 공간 활용에 최우선.',
        date: '2025.02',
        link: '#'
      },
      {
        category: 'residential',
        categoryName: '주거공간',
        image: 'https://picsum.photos/seed/fc-r3/480/360',
        title: '50평 전원주택 셀프 설계',
        description: '건축주와 함께 설계한 나만의 전원주택. 자연채광을 최우선으로 고려했습니다.',
        date: '2025.03',
        link: '#'
      }
    ];

    // ─── 렌더링 및 필터 로직 (수정 불필요) ────────────────

    const tabsContainer = document.getElementById('diboFcTabs');
    const grid          = document.getElementById('diboFcGrid');
    const countEl       = document.getElementById('diboFcCount');
    const emptyEl       = document.getElementById('diboFcEmpty');

    let currentFilter = 'all';

    // 카테고리 목록 추출 (중복 제거, 순서 유지)
    function getCategories() {
      const seen = new Set();
      const list = [];
      cardsData.forEach(card => {
        if (!seen.has(card.category)) {
          seen.add(card.category);
          list.push({ id: card.category, name: card.categoryName });
        }
      });
      return list;
    }

    // 필터 탭 버튼 생성
    function buildTabs() {
      const categories = getCategories();
      tabsContainer.innerHTML = [
        `<button class="dibo-fc-tab active" data-filter="all">전체</button>`,
        ...categories.map(c =>
          `<button class="dibo-fc-tab" data-filter="${c.id}">${c.name}</button>`)
      ].join('');

      tabsContainer.querySelectorAll('.dibo-fc-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          tabsContainer.querySelectorAll('.dibo-fc-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          applyFilter(btn.dataset.filter);
        });
      });
    }

    // 카드 생성
    function buildCards() {
      // 기존 카드 제거 (empty 메시지 제외)
      grid.querySelectorAll('.dibo-fc-card').forEach(c => c.remove());

      cardsData.forEach(card => {
        const el = document.createElement('a');
        el.className = 'dibo-fc-card';
        el.href = card.link || '#';
        el.dataset.category = card.category;
        el.innerHTML = `
          ${card.image ? `
            <div class="dibo-fc-card-img">
              <img src="${card.image}" alt="${card.title}" loading="lazy" />
              <span class="dibo-fc-card-img-tag">${card.categoryName}</span>
            </div>` : ''}
          <div class="dibo-fc-card-body">
            <h3 class="dibo-fc-card-title">${card.title}</h3>
            <p class="dibo-fc-card-desc">${card.description}</p>
            <div class="dibo-fc-card-footer">
              <span class="dibo-fc-card-date">${card.date || ''}</span>
              <span class="dibo-fc-card-link">자세히 보기 →</span>
            </div>
          </div>
        `;
        grid.insertBefore(el, emptyEl);
      });
    }

    // 필터 적용 + 스태거 애니메이션
    function applyFilter(filter) {
      currentFilter = filter;
      const cards = grid.querySelectorAll('.dibo-fc-card');
      let visibleCount = 0;

      cards.forEach(card => {
        const matches = filter === 'all' || card.dataset.category === filter;

        if (matches) {
          card.classList.remove('is-hidden');
          // 애니메이션 재실행 (스태거 딜레이 적용)
          card.style.setProperty('--anim-delay', `${visibleCount * 0.06}s`);
          card.style.animation = 'none';
          void card.offsetWidth; // reflow
          card.style.animation = '';
          visibleCount++;
        } else {
          card.classList.add('is-hidden');
        }
      });

      countEl.textContent = visibleCount;

      // 빈 결과 표시
      if (visibleCount === 0) {
        emptyEl.classList.add('show');
      } else {
        emptyEl.classList.remove('show');
      }
    }

    // 초기화
    buildTabs();
    buildCards();
    applyFilter('all');
  </script>

</body>
</html>
