<!DOCTYPE html>
<!--
  ================================================================
  ✦ 디보(dibo) 익스텐션 | 대화형 순차 노출 진단 폼 – 마케팅·광고·컨설팅
  ================================================================

  【페이지 개요】
  챗봇처럼 질문이 하나씩 순차적으로 노출되는 대화형 진단 폼입니다.
  단순 신청서가 아닌 무료 진단·컨설팅 서비스처럼 느껴지게 하여 리드 품질과
  전환율을 동시에 높입니다. 총 5단계 질문으로 예산·채널·목표·담당자 정보를
  자연스럽게 수집합니다. 마케팅·광고·컨설팅 에이전시, B2B 서비스 랜딩 페이지에 적합합니다.

  【SEO 키워드】
  마케팅 에이전시 무료 상담 신청, 광고 무료 진단 폼, 대화형 순차 노출 폼,
  챗봇형 리드 수집 폼, B2B 디지털 마케팅 문의

  【사용 전 필수 설정】
  1. 질문 항목 수정
     → 각 질문의 제목 텍스트 및 선택지 옵션 버튼 HTML 수정

  2. 총 질문 수 수정
     → TOTAL 상수 (현재: 5개 질문)

  3. 폼 제목·설명 수정
     → 헤더의 배지·제목·부제목 HTML 텍스트 수정

  4. 테마 컬러 수정
     → CSS에서 #00c896 (그린) 값을 브랜드 컬러로 일괄 변경

  5. 폼 제출 처리 연동  ★ [수정 필수]
     → handleSubmit 함수 내부에 실제 API 엔드포인트 연동 코드 추가

  【대화형 폼 조작 방법】
  - 텍스트 입력 질문 : 내용 입력 후 [다음] 버튼 또는 Enter 키로 진행
  - 선택지 질문 : 버튼 클릭으로 응답 (복수 선택 가능한 항목 포함)
  - 상단 진행 바로 현재 진행률을 실시간으로 확인할 수 있습니다
  ================================================================
-->
<html lang="ko">
<head>
<!-- ================================================
   DIBO F04 · 대화형 순차 노출 폼 · 마케팅 에이전시 버전
   class prefix : dibo-f04-
   아임웹 코드위젯 즉시 적용
   모달에 넣고 사용학세요 (권장 너비 480px)
   ================================================ -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  .dibo-f04-wrap {
    max-width: 520px;
    margin: 0 auto;
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0f0f0f;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 12px 48px rgba(0,0,0,0.6);
  }

  /* ── 헤더 ── */
  .dibo-f04-header {
    padding: 28px 28px 0;
  }

  .dibo-f04-badge {
    display: inline-block;
    background: rgba(0,200,150,0.12);
    border: 1px solid rgba(0,200,150,0.3);
    color: #00c896;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
    letter-spacing: 0.3px;
  }

  .dibo-f04-header h2 {
    margin: 0 0 4px;
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.5px;
    line-height: 1.3;
  }

  .dibo-f04-header p {
    margin: 0 0 20px;
    font-size: 13px;
    color: #555;
  }

  /* ── 진행 바 ── */
  .dibo-f04-prog-wrap {
    padding: 0 28px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .dibo-f04-prog-bar {
    flex: 1;
    height: 3px;
    background: #222;
    border-radius: 3px;
    overflow: hidden;
  }

  .dibo-f04-prog-fill {
    height: 100%;
    background: #00c896;
    border-radius: 3px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .dibo-f04-prog-text {
    font-size: 11px;
    color: #555;
    font-weight: 600;
    white-space: nowrap;
  }

  .dibo-f04-prog-text span {
    color: #00c896;
  }

  /* ── 질문 목록 ── */
  .dibo-f04-body {
    padding: 0 28px 28px;
  }

  .dibo-f04-q-item {
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    margin-bottom: 20px;
    pointer-events: none;
  }

  .dibo-f04-q-item.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: all;
  }

  .dibo-f04-q-item.answered {
    opacity: 0.35;
  }

  .dibo-f04-q-item.answered .dibo-f04-q-label::after {
    content: ' ✓';
    color: #00c896;
  }

  .dibo-f04-q-label {
    font-size: 13px;
    font-weight: 600;
    color: #aaa;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dibo-f04-q-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    background: #00c896;
    color: #0f0f0f;
    border-radius: 50%;
    font-size: 10px;
    font-weight: 800;
    flex-shrink: 0;
  }

  /* ── 텍스트 입력 ── */
  .dibo-f04-input-row {
    display: flex;
    gap: 8px;
  }

  .dibo-f04-input {
    flex: 1;
    height: 44px;
    border: 1.5px solid #2a2a2a;
    border-radius: 10px;
    padding: 0 14px;
    font-size: 14px;
    color: #fff;
    background: #1a1a1a;
    outline: none;
    transition: border-color 0.2s;
    box-sizing: border-box;
    font-family: inherit;
  }

  .dibo-f04-input:focus { border-color: #00c896; }
  .dibo-f04-input::placeholder { color: #444; }

  .dibo-f04-input[type="tel"] {}

  .dibo-f04-confirm {
    height: 44px;
    padding: 0 16px;
    background: #00c896;
    color: #0f0f0f;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s, transform 0.1s;
    white-space: nowrap;
  }

  .dibo-f04-confirm:hover { background: #00e0aa; }
  .dibo-f04-confirm:active { transform: scale(0.97); }

  /* ── 버튼 선택형 ── */
  .dibo-f04-btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .dibo-f04-choice {
    padding: 9px 16px;
    border: 1.5px solid #2a2a2a;
    border-radius: 8px;
    background: #1a1a1a;
    color: #aaa;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .dibo-f04-choice:hover {
    border-color: #00c896;
    color: #00c896;
  }

  .dibo-f04-choice.selected {
    background: rgba(0,200,150,0.12);
    border-color: #00c896;
    color: #00c896;
  }

  /* ── 개인정보 동의 ── */
  .dibo-f04-agree {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    cursor: pointer;
  }

  .dibo-f04-checkbox {
    width: 16px;
    height: 16px;
    accent-color: #00c896;
    margin-top: 2px;
    flex-shrink: 0;
    cursor: pointer;
  }

  .dibo-f04-agree-text {
    font-size: 11px;
    color: #555;
    line-height: 1.5;
  }

  .dibo-f04-agree-link {
    color: #00c896;
    text-decoration: underline;
    cursor: pointer;
  }

  /* ── 최종 제출 버튼 ── */
  .dibo-f04-submit-wrap {
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events: none;
    margin-top: 4px;
  }

  .dibo-f04-submit-wrap.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: all;
  }

  .dibo-f04-submit {
    width: 100%;
    height: 50px;
    background: #00c896;
    color: #0f0f0f;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: -0.3px;
    transition: background 0.2s, transform 0.1s;
    font-family: inherit;
    margin-top: 14px;
  }

  .dibo-f04-submit:hover { background: #00e0aa; }
  .dibo-f04-submit:active { transform: scale(0.98); }
  .dibo-f04-submit:disabled {
    background: #0d3d30;
    color: #1a6654;
    cursor: default;
    transform: none;
  }

  /* ── 완료 ── */
  .dibo-f04-thanks {
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 48px 28px;
    text-align: center;
    gap: 10px;
  }

  .dibo-f04-thanks-icon { font-size: 48px; }

  .dibo-f04-thanks-title {
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.5px;
  }

  .dibo-f04-thanks-card {
    background: #1a1a1a;
    border: 1px solid rgba(0,200,150,0.3);
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 13px;
    color: #888;
    line-height: 1.9;
    width: 100%;
    box-sizing: border-box;
    text-align: left;
  }

  .dibo-f04-thanks-card strong { color: #00c896; }

  .dibo-f04-thanks-msg {
    font-size: 13px;
    color: #555;
    line-height: 1.7;
  }
</style>
</head>
<body>
<div class="dibo-f04-wrap">

  <div class="dibo-f04-header">
    <div class="dibo-f04-badge">🚀 무료 광고 진단</div>
    <h2>왜 광고 성과가<br>안 나오는 걸까요?</h2>
    <p>몇 가지 질문에 답하면 무료로 진단해 드립니다</p>
  </div>

  <div class="dibo-f04-prog-wrap">
    <div class="dibo-f04-prog-bar">
      <div class="dibo-f04-prog-fill" id="diboF04Fill"></div>
    </div>
    <div class="dibo-f04-prog-text"><span id="diboF04CurQ">0</span> / 5</div>
  </div>

  <div class="dibo-f04-body" id="diboF04Body">

    <!-- Q1: 회사명 (텍스트) -->
    <div class="dibo-f04-q-item" id="diboF04Q1">
      <div class="dibo-f04-q-label">
        <span class="dibo-f04-q-num">1</span>
        회사(브랜드)명을 알려주세요
      </div>
      <div class="dibo-f04-input-row">
        <input class="dibo-f04-input" type="text" id="diboF04A1" placeholder="예) 디보 마케팅" maxlength="30" />
        <button class="dibo-f04-confirm" data-q="1">확인 →</button>
      </div>
    </div>

    <!-- Q2: 월 광고 예산 (선택) -->
    <div class="dibo-f04-q-item" id="diboF04Q2">
      <div class="dibo-f04-q-label">
        <span class="dibo-f04-q-num">2</span>
        월 광고 예산 규모는?
      </div>
      <div class="dibo-f04-btn-group">
        <button class="dibo-f04-choice" data-q="2" data-v="100만원 미만">100만원 미만</button>
        <button class="dibo-f04-choice" data-q="2" data-v="100~300만원">100~300만원</button>
        <button class="dibo-f04-choice" data-q="2" data-v="300~500만원">300~500만원</button>
        <button class="dibo-f04-choice" data-q="2" data-v="500만원 이상">500만원 이상</button>
      </div>
    </div>

    <!-- Q3: 광고 채널 (선택, 복수) -->
    <div class="dibo-f04-q-item" id="diboF04Q3">
      <div class="dibo-f04-q-label">
        <span class="dibo-f04-q-num">3</span>
        현재 집행 중인 광고 채널은? (복수 선택)
      </div>
      <div class="dibo-f04-btn-group" id="diboF04A3">
        <button class="dibo-f04-choice" data-v="네이버">네이버</button>
        <button class="dibo-f04-choice" data-v="카카오">카카오</button>
        <button class="dibo-f04-choice" data-v="인스타/페이스북">인스타/페이스북</button>
        <button class="dibo-f04-choice" data-v="유튜브">유튜브</button>
        <button class="dibo-f04-choice" data-v="없음">현재 없음</button>
      </div>
      <div style="margin-top:10px;">
        <button class="dibo-f04-confirm" data-q="3">확인 →</button>
      </div>
    </div>

    <!-- Q4: 광고 목표 (선택) -->
    <div class="dibo-f04-q-item" id="diboF04Q4">
      <div class="dibo-f04-q-label">
        <span class="dibo-f04-q-num">4</span>
        가장 원하는 광고 목표는?
      </div>
      <div class="dibo-f04-btn-group">
        <button class="dibo-f04-choice" data-q="4" data-v="브랜드 인지도">브랜드 인지도</button>
        <button class="dibo-f04-choice" data-q="4" data-v="리드(상담) 확보">리드(상담) 확보</button>
        <button class="dibo-f04-choice" data-q="4" data-v="매출 직접 전환">매출 직접 전환</button>
        <button class="dibo-f04-choice" data-q="4" data-v="앱 설치/유입">앱 설치/유입</button>
      </div>
    </div>

    <!-- Q5: 연락처 (텍스트) -->
    <div class="dibo-f04-q-item" id="diboF04Q5">
      <div class="dibo-f04-q-label">
        <span class="dibo-f04-q-num">5</span>
        담당자 성함과 연락처를 남겨주세요
      </div>
      <div class="dibo-f04-input-row" style="margin-bottom:10px;">
        <input class="dibo-f04-input" type="text" id="diboF04Name" placeholder="홍길동" maxlength="20" />
      </div>
      <div class="dibo-f04-input-row" style="margin-bottom:10px;">
        <input class="dibo-f04-input" type="tel" id="diboF04Tel" placeholder="010-0000-0000" maxlength="13" />
      </div>
      <label class="dibo-f04-agree">
        <input class="dibo-f04-checkbox" type="checkbox" id="diboF04Agree" />
        <span class="dibo-f04-agree-text">
          <span class="dibo-f04-agree-link">[필수] 개인정보 수집·이용 동의</span>에 동의합니다.
        </span>
      </label>
    </div>

    <!-- 제출 -->
    <div class="dibo-f04-submit-wrap" id="diboF04SubmitWrap">
      <button class="dibo-f04-submit" id="diboF04Submit" disabled>무료 광고 진단 신청하기</button>
    </div>

    <!-- 완료 -->
    <div class="dibo-f04-thanks" id="diboF04Thanks">
      <div class="dibo-f04-thanks-icon">🎯</div>
      <p class="dibo-f04-thanks-title">진단 신청 완료!</p>
      <div class="dibo-f04-thanks-card" id="diboF04ThanksCard"></div>
      <p class="dibo-f04-thanks-msg">영업일 기준 1일 내 담당 매니저가 연락드립니다.<br>진단 리포트는 상담 시 무료 제공됩니다.</p>
    </div>
  </div>

</div>

<script>
/* ── Dibo Edit API ── */
var diboF04EditId = null;
(async function () {
  try {
    var res = await axios.get('https://api.di-bo.me/edit-set?config_id=copy_config_id', {
      headers: { 'access-token': diboLoginManager.access_token }
    });
    diboF04EditId = res.data[0]?.id || null;
  } catch (e) { console.error('[F04] Edit Set 조회 실패:', e); }
})();

async function diboF04PostEdit(name, tel, brand, budget, channels, goal) {
  if (!diboF04EditId) return;
  const fd = new FormData();
  fd.append('req_body', JSON.stringify({ config_id: 'copy_config_id' }));
  fd.append('column_01', name);      // 이름
  fd.append('column_02', tel);       // 연락처
  fd.append('column_03', brand);     // 브랜드명
  fd.append('column_04', budget);    // 월 광고 예산
  fd.append('column_05', channels);  // 광고 채널 (복수선택, 쉼표 구분)
  fd.append('column_06', goal);      // 광고 목표
  fd.append('column_07', ''); fd.append('column_08', '');
  fd.append('column_09', ''); fd.append('column_10', '');
  try {
    await axios.post(
      'https://api.di-bo.me/edit-set/' + diboF04EditId + '/rows',
      fd,
      { headers: { 'access-token': diboLoginManager?.access_token } }
    );
  } catch (e) { console.error('[F04] 데이터 제출 실패:', e); }
}

(function () {
  var answers = { q1:'', q2:'', q3:[], q4:'', name:'', tel:'' };
  var completed = 0;
  var TOTAL = 5;

  function getQ(n) { return document.getElementById('diboF04Q' + n); }

  function showQ(n) {
    var el = getQ(n);
    if (!el) return;
    setTimeout(function () { el.classList.add('visible'); }, 50);
  }

  function markDone(n) {
    var el = getQ(n);
    if (el) el.classList.add('answered');
    completed = Math.max(completed, n);
    updateProgress();
  }

  function updateProgress() {
    var pct = Math.round((completed / TOTAL) * 100);
    document.getElementById('diboF04Fill').style.width = pct + '%';
    document.getElementById('diboF04CurQ').textContent = completed;
  }

  /* ── Q1: 텍스트 확인 버튼 ── */
  document.querySelector('[data-q="1"]').addEventListener('click', function () {
    var v = document.getElementById('diboF04A1').value.trim();
    if (!v) return;
    answers.q1 = v;
    markDone(1);
    showQ(2);
  });
  document.getElementById('diboF04A1').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.querySelector('[data-q="1"]').click();
  });

  /* ── Q2: 단일 선택 ── */
  document.querySelectorAll('[data-q="2"]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('[data-q="2"]').forEach(function(b){ b.classList.remove('selected'); });
      this.classList.add('selected');
      answers.q2 = this.dataset.v;
      markDone(2);
      showQ(3);
    });
  });

  /* ── Q3: 복수 선택 + 확인 ── */
  document.getElementById('diboF04A3').querySelectorAll('.dibo-f04-choice').forEach(function (btn) {
    btn.addEventListener('click', function () {
      this.classList.toggle('selected');
    });
  });
  document.querySelector('[data-q="3"]').addEventListener('click', function () {
    var sel = Array.from(document.getElementById('diboF04A3').querySelectorAll('.dibo-f04-choice.selected'))
                   .map(function(b){ return b.dataset.v; });
    if (!sel.length) return;
    answers.q3 = sel;
    markDone(3);
    showQ(4);
  });

  /* ── Q4: 단일 선택 ── */
  document.querySelectorAll('[data-q="4"]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('[data-q="4"]').forEach(function(b){ b.classList.remove('selected'); });
      this.classList.add('selected');
      answers.q4 = this.dataset.v;
      markDone(4);
      showQ(5);
      setTimeout(function () {
        document.getElementById('diboF04SubmitWrap').classList.add('visible');
      }, 500);
    });
  });

  /* ── Q5: 연락처 입력 ── */
  var telEl   = document.getElementById('diboF04Tel');
  var nameEl  = document.getElementById('diboF04Name');
  var agreeEl = document.getElementById('diboF04Agree');
  var submitEl= document.getElementById('diboF04Submit');

  telEl.addEventListener('input', function () {
    var v = telEl.value.replace(/\D/g,'');
    if (v.length <= 3)      telEl.value = v;
    else if (v.length <= 7) telEl.value = v.slice(0,3)+'-'+v.slice(3);
    else                    telEl.value = v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7,11);
    validateContact();
  });
  nameEl.addEventListener('input', validateContact);
  agreeEl.addEventListener('change', validateContact);

  function validateContact() {
    var ok = nameEl.value.trim().length >= 2 &&
             telEl.value.replace(/\D/g,'').length >= 10 &&
             agreeEl.checked;
    submitEl.disabled = !ok;
    if (ok) markDone(5);
  }

  /* ── 제출 ── */
  submitEl.addEventListener('click', function () {
    if (this.disabled) return;
    answers.name = nameEl.value.trim();
    answers.tel  = telEl.value;
    diboF04PostEdit(
      answers.name,
      answers.tel,
      answers.q1,
      answers.q2,
      answers.q3.join(', '),
      answers.q4
    );

    document.getElementById('diboF04ThanksCard').innerHTML =
      '🏢 브랜드: <strong>' + answers.q1 + '</strong><br>' +
      '💰 예산: <strong>' + answers.q2 + '</strong><br>' +
      '📢 채널: <strong>' + answers.q3.join(', ') + '</strong><br>' +
      '🎯 목표: <strong>' + answers.q4 + '</strong><br>' +
      '👤 담당자: <strong>' + answers.name + '</strong>';

    document.getElementById('diboF04Fill').style.width = '100%';
    document.getElementById('diboF04CurQ').textContent = TOTAL;

    /* 폼 영역 숨기고 완료 표시 */
    var items = document.querySelectorAll('.dibo-f04-q-item, .dibo-f04-submit-wrap');
    items.forEach(function(el){ el.style.display = 'none'; });
    document.getElementById('diboF04Thanks').style.display = 'flex';
  });

  /* 첫 질문 노출 */
  showQ(1);
})();
</script>
</body>
</html>
