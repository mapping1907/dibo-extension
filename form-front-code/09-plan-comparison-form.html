<!DOCTYPE html>
<!--
  ================================================================
  ✦ 디보(dibo) 익스텐션 | 비교 플랜 선택 폼 – 헬스·PT·구독·멤버십 서비스업
  ================================================================

  【페이지 개요】
  베이직/스탠다드/프리미엄 3가지 플랜을 카드 형태로 나란히 비교하고,
  원하는 플랜 클릭 시 바로 신청 폼이 슬라이드다운으로 열리는 폼입니다.
  추천 배지 표시로 특정 플랜의 선택을 유도할 수 있으며, 다크 테마(#0a0a0a)에
  오렌지 포인트 컬러를 사용합니다. 헬스·PT·학원·SaaS·구독 서비스에 적합합니다.

  【SEO 키워드】
  PT 패키지 신청, 헬스 회원권 상담, 플랜 선택 폼,
  구독 서비스 신청, 멤버십 등록 상담

  【사용 전 필수 설정】
  1. 플랜 카드 수정
     → .dibo-f09-plan 의 data-plan(플랜명), data-price(금액),
        .dibo-f09-plan-count(횟수), .dibo-f09-plan-unit(단위),
        .dibo-f09-plan-price, .dibo-f09-feat 텍스트 수정

  2. 추천 배지 위치 수정
     → .dibo-f09-recommend 요소를 원하는 플랜 카드 내 첫 자식으로 이동

  3. 버튼 텍스트 수정
     → 제출 버튼 문구 (현재: "등록 상담 신청하기")

  4. 테마 컬러 수정
     → CSS에서 #ff6b35 (오렌지) 값을 브랜드 컬러로 일괄 변경

  5. 폼 제출 처리 연동  ★ [수정 필수]
     → diboF09Submit click 핸들러 내부에 실제 API 엔드포인트 연동 코드 추가

  【UX 흐름】
  ① 플랜 카드 클릭 → 선택 강조 + 신청 폼 슬라이드다운
  ② 이름·연락처·동의 입력 → 버튼 활성화
  ③ 제출 → 선택 플랜 정보 포함 완료 화면 전환
  ================================================================
-->
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- ================================================
   DIBO F09 · 비교 플랜 선택 폼 · 헬스/PT 버전
   class prefix : dibo-f09-
   아임웹 코드위젯 즉시 적용
   ================================================ -->
<style>
  .dibo-f09-wrap {
    max-width: 520px;
    margin: 0 auto;
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0a0a0a;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 12px 48px rgba(255,107,53,0.2);
  }

  /* ── 헤더 ── */
  .dibo-f09-header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .dibo-f09-badge {
    display: inline-block;
    background: rgba(255,107,53,0.12);
    border: 1px solid rgba(255,107,53,0.3);
    color: #ff6b35;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
    letter-spacing: 0.2px;
  }

  .dibo-f09-header h2 { margin: 0 0 4px; font-size: 20px; font-weight: 800; color: #fff; letter-spacing: -0.5px; line-height: 1.3; }
  .dibo-f09-header p  { margin: 0; font-size: 12px; color: #555; }

  /* ── 플랜 카드 ── */
  .dibo-f09-plans {
    display: flex;
    gap: 10px;
    padding: 20px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .dibo-f09-plan {
    flex: 1;
    background: #1a1a1a;
    border: 1.5px solid #2a2a2a;
    border-radius: 14px;
    padding: 16px 12px;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    text-align: center;
  }

  .dibo-f09-plan:hover { border-color: #ff6b35; }
  .dibo-f09-plan.selected { border-color: #ff6b35; background: rgba(255,107,53,0.08); }

  .dibo-f09-recommend {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    background: #ff6b35;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 20px;
    white-space: nowrap;
    letter-spacing: 0.3px;
  }

  .dibo-f09-plan-icon { font-size: 26px; margin-bottom: 8px; line-height: 1; }

  .dibo-f09-plan-name {
    font-size: 13px;
    font-weight: 700;
    color: #ccc;
    margin-bottom: 4px;
    letter-spacing: -0.2px;
  }

  .dibo-f09-plan.selected .dibo-f09-plan-name { color: #ff6b35; }

  .dibo-f09-plan-count {
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -1px;
    line-height: 1;
    margin-bottom: 2px;
  }

  .dibo-f09-plan-unit { font-size: 10px; color: #555; margin-bottom: 10px; }

  .dibo-f09-plan-price {
    font-size: 14px;
    font-weight: 700;
    color: #888;
    margin-bottom: 12px;
    letter-spacing: -0.3px;
  }

  .dibo-f09-plan.selected .dibo-f09-plan-price { color: #ff6b35; }

  .dibo-f09-features {
    display: flex;
    flex-direction: column;
    gap: 4px;
    text-align: left;
  }

  .dibo-f09-feat {
    font-size: 11px;
    color: #555;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .dibo-f09-plan.selected .dibo-f09-feat { color: #888; }

  .dibo-f09-feat-dot {
    width: 4px;
    height: 4px;
    background: #333;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .dibo-f09-plan.selected .dibo-f09-feat-dot { background: #ff6b35; }

  /* ── 신청 폼 (슬라이드다운) ── */
  .dibo-f09-form-wrap {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .dibo-f09-form-wrap.open { max-height: 400px; }

  .dibo-f09-form-inner {
    padding: 20px 24px 24px;
  }

  .dibo-f09-selected-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,107,53,0.1);
    border: 1px solid rgba(255,107,53,0.3);
    color: #ff6b35;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 10px;
    margin-bottom: 16px;
  }

  .dibo-f09-fields {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }

  .dibo-f09-field {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .dibo-f09-label { font-size: 11px; font-weight: 600; color: #555; }

  .dibo-f09-input {
    height: 44px;
    border: 1.5px solid #2a2a2a;
    border-radius: 8px;
    padding: 0 12px;
    font-size: 14px;
    color: #fff;
    background: #1a1a1a;
    outline: none;
    transition: border-color 0.2s;
    box-sizing: border-box;
    font-family: inherit;
    width: 100%;
  }

  .dibo-f09-input:focus { border-color: #ff6b35; }
  .dibo-f09-input::placeholder { color: #444; }

  .dibo-f09-agree { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 14px; cursor: pointer; }
  .dibo-f09-checkbox { width: 15px; height: 15px; accent-color: #ff6b35; margin-top: 2px; flex-shrink: 0; cursor: pointer; }
  .dibo-f09-agree-text { font-size: 11px; color: #555; line-height: 1.55; }
  .dibo-f09-agree-link { color: #ff6b35; text-decoration: underline; cursor: pointer; }

  .dibo-f09-submit {
    width: 100%;
    height: 50px;
    background: #ff6b35;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: -0.3px;
    transition: background 0.2s, transform 0.1s;
    font-family: inherit;
  }

  .dibo-f09-submit:hover  { background: #e85e2a; }
  .dibo-f09-submit:active { transform: scale(0.98); }
  .dibo-f09-submit:disabled { background: #3a1f10; color: #6a3f20; cursor: default; transform: none; }

  /* ── 완료 ── */
  .dibo-f09-thanks {
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 44px 24px;
    text-align: center;
    gap: 8px;
  }

  .dibo-f09-thanks-icon  { font-size: 44px; }
  .dibo-f09-thanks-title { font-size: 18px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
  .dibo-f09-thanks-card  {
    background: rgba(255,107,53,0.1);
    border: 1px solid rgba(255,107,53,0.3);
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 13px;
    color: #ff6b35;
    font-weight: 600;
    line-height: 1.8;
  }
  .dibo-f09-thanks-msg { font-size: 12px; color: #555; line-height: 1.7; }
</style>
</head>
<body>
<div class="dibo-f09-wrap">

  <div class="dibo-f09-header">
    <div class="dibo-f09-badge">💪 PT 패키지</div>
    <h2>나에게 맞는 플랜을<br>선택해보세요</h2>
    <p>플랜을 클릭하면 바로 신청 폼이 열립니다</p>
  </div>

  <!-- 플랜 카드 -->
  <div class="dibo-f09-plans" id="diboF09Plans">

    <div class="dibo-f09-plan" data-plan="베이직" data-price="390,000원">
      <div class="dibo-f09-plan-icon">🌱</div>
      <div class="dibo-f09-plan-name">베이직</div>
      <div class="dibo-f09-plan-count">10</div>
      <div class="dibo-f09-plan-unit">회 패키지</div>
      <div class="dibo-f09-plan-price">390,000원</div>
      <div class="dibo-f09-features">
        <div class="dibo-f09-feat"><div class="dibo-f09-feat-dot"></div>1:1 PT 10회</div>
        <div class="dibo-f09-feat"><div class="dibo-f09-feat-dot"></div>체성분 분석</div>
        <div class="dibo-f09-feat"><div class="dibo-f09-feat-dot"></div>기초 식단 가이드</div>
      </div>
    </div>

    <div class="dibo-f09-plan" data-plan="스탠다드" data-price="690,000원">
      <div class="dibo-f09-recommend">🔥 추천</div>
      <div class="dibo-f09-plan-icon">⚡</div>
      <div class="dibo-f09-plan-name">스탠다드</div>
      <div class="dibo-f09-plan-count">20</div>
      <div class="dibo-f09-plan-unit">회 패키지</div>
      <div class="dibo-f09-plan-price">690,000원</div>
      <div class="dibo-f09-features">
        <div class="dibo-f09-feat"><div class="dibo-f09-feat-dot"></div>1:1 PT 20회</div>
        <div class="dibo-f09-feat"><div class="dibo-f09-feat-dot"></div>맞춤 식단 설계</div>
        <div class="dibo-f09-feat"><div class="dibo-f09-feat-dot"></div>월 1회 인바디</div>
      </div>
    </div>

    <div class="dibo-f09-plan" data-plan="프리미엄" data-price="1,190,000원">
      <div class="dibo-f09-plan-icon">🏆</div>
      <div class="dibo-f09-plan-name">프리미엄</div>
      <div class="dibo-f09-plan-count">30</div>
      <div class="dibo-f09-plan-unit">회 패키지</div>
      <div class="dibo-f09-plan-price">1,190,000원</div>
      <div class="dibo-f09-features">
        <div class="dibo-f09-feat"><div class="dibo-f09-feat-dot"></div>1:1 PT 30회</div>
        <div class="dibo-f09-feat"><div class="dibo-f09-feat-dot"></div>전담 트레이너</div>
        <div class="dibo-f09-feat"><div class="dibo-f09-feat-dot"></div>무제한 식단 관리</div>
      </div>
    </div>

  </div>

  <!-- 신청 폼 -->
  <div class="dibo-f09-form-wrap" id="diboF09FormWrap">
    <div class="dibo-f09-form-inner" id="diboF09FormInner">
      <div class="dibo-f09-selected-badge" id="diboF09SelBadge">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7L5.5 10.5L12 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="diboF09SelName"></span>
      </div>

      <div class="dibo-f09-fields">
        <div class="dibo-f09-field">
          <span class="dibo-f09-label">이름</span>
          <input class="dibo-f09-input" type="text" id="diboF09Name" placeholder="홍길동" maxlength="20" />
        </div>
        <div class="dibo-f09-field">
          <span class="dibo-f09-label">연락처</span>
          <input class="dibo-f09-input" type="tel" id="diboF09Tel" placeholder="010-0000-0000" maxlength="13" />
        </div>
      </div>

      <label class="dibo-f09-agree">
        <input class="dibo-f09-checkbox" type="checkbox" id="diboF09Agree" />
        <span class="dibo-f09-agree-text">
          <span class="dibo-f09-agree-link">[필수] 개인정보 수집·이용 동의</span>에 동의합니다.
        </span>
      </label>

      <button class="dibo-f09-submit" id="diboF09Submit" disabled>등록 상담 신청하기</button>
    </div>
  </div>

  <!-- 완료 -->
  <div class="dibo-f09-thanks" id="diboF09Thanks">
    <div class="dibo-f09-thanks-icon">💪</div>
    <p class="dibo-f09-thanks-title">신청 완료!</p>
    <div class="dibo-f09-thanks-card" id="diboF09ThanksCard"></div>
    <p class="dibo-f09-thanks-msg">담당 트레이너가 빠르게 연락드립니다.<br>첫 상담은 헬스장 방문 또는 전화로 진행됩니다.</p>
  </div>

</div>

<script>
(function () {
  var selPlan = '', selPrice = '';
  var formOpen = false;

  var nameEl   = document.getElementById('diboF09Name');
  var telEl    = document.getElementById('diboF09Tel');
  var agreeEl  = document.getElementById('diboF09Agree');
  var submitEl = document.getElementById('diboF09Submit');

  /* ── 플랜 선택 ── */
  document.getElementById('diboF09Plans').querySelectorAll('.dibo-f09-plan').forEach(function (card) {
    card.addEventListener('click', function () {
      document.getElementById('diboF09Plans').querySelectorAll('.dibo-f09-plan').forEach(function(c){ c.classList.remove('selected'); });
      this.classList.add('selected');
      selPlan  = this.dataset.plan;
      selPrice = this.dataset.price;

      document.getElementById('diboF09SelName').textContent = selPlan + ' 플랜 · ' + selPrice;

      if (!formOpen) {
        document.getElementById('diboF09FormWrap').classList.add('open');
        formOpen = true;
      }
    });
  });

  /* ── 전화번호 포맷 ── */
  telEl.addEventListener('input', function () {
    var v = telEl.value.replace(/\D/g,'');
    if (v.length <= 3)      telEl.value = v;
    else if (v.length <= 7) telEl.value = v.slice(0,3)+'-'+v.slice(3);
    else                    telEl.value = v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7,11);
    validate();
  });
  nameEl.addEventListener('input', validate);
  agreeEl.addEventListener('change', validate);

  function validate() {
    submitEl.disabled = !(selPlan &&
      nameEl.value.trim().length >= 2 &&
      telEl.value.replace(/\D/g,'').length >= 10 &&
      agreeEl.checked);
  }

  /* ── 제출 ── */
  submitEl.addEventListener('click', function () {
    if (this.disabled) return;
    postEditData();
    document.getElementById('diboF09ThanksCard').innerHTML =
      '🏋️ ' + selPlan + ' 플랜 · ' + selPrice + '<br>👤 ' + nameEl.value;

    document.getElementById('diboF09Plans').style.display = 'none';
    document.getElementById('diboF09FormInner').style.display = 'none';
    document.getElementById('diboF09Thanks').style.display   = 'flex';
  });

  /* ── Edit API 연동 ── */
  var form_id = null;

  (async function () {
    try {
      var res = await axios.get('https://api.di-bo.me/edit-set?config_id=copy_config_id', {
        headers: { 'access-token': diboLoginManager.access_token }
      });
      form_id = res.data[0]?.id || null;
    } catch (e) {}
  })();

  function postEditData() {
    if (!form_id) return;
    var fd = new FormData();
    fd.append('req_body', JSON.stringify({ config_id: 'copy_config_id' }));
    fd.append('column_01', selPlan);
    fd.append('column_02', selPrice);
    fd.append('column_03', nameEl.value);
    fd.append('column_04', telEl.value);
    fd.append('column_05', '동의');
    fd.append('column_06', '');
    fd.append('column_07', '');
    fd.append('column_08', '');
    fd.append('column_09', '');
    fd.append('column_10', '');
    axios.post('https://api.di-bo.me/edit-set/' + form_id + '/rows', fd, {
      headers: { 'access-token': diboLoginManager?.access_token }
    }).catch(function (e) { console.error('입력폼 데이터 생성 실패:', e); });
  }
})();
</script>
</body>
</html>
