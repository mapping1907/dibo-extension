<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- ================================================
   DIBO F06 · 스크롤 트리거 슬라이드업 폼 · 웨딩 버전
   class prefix : dibo-f06-
   아임웹 코드위젯 즉시 적용
   ================================================ -->
<style>
  /* ── 래퍼 (fixed 하단) ── */
  .dibo-f06-wrap {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 9999;
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    transform: translateY(100%);
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
  }

  .dibo-f06-wrap.is-visible {
    transform: translateY(0);
    pointer-events: all;
  }

  /* ── 카드 ── */
  .dibo-f06-card {
    background: #fff;
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -8px 40px rgba(201,169,110,0.2), 0 -2px 12px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  /* ── 상단 핸들 + 닫기 ── */
  .dibo-f06-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px 0;
  }

  .dibo-f06-handle {
    width: 36px;
    height: 4px;
    background: #e8e0d0;
    border-radius: 4px;
    margin: 0 auto;
  }

  .dibo-f06-close {
    width: 28px;
    height: 28px;
    background: #f5f0e8;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 16px;
    transition: background 0.2s;
    flex-shrink: 0;
    font-family: inherit;
  }

  .dibo-f06-close:hover { background: #ede5d5; color: #666; }

  /* ── 콘텐츠 ── */
  .dibo-f06-inner {
    padding: 16px 24px 28px;
  }

  /* PC: 가로 레이아웃 */
  @media (min-width: 768px) {
    .dibo-f06-wrap {
      left: 50%;
      right: auto;
      transform: translateX(-50%) translateY(100%);
      width: 640px;
      bottom: 0;
    }
    .dibo-f06-wrap.is-visible {
      transform: translateX(-50%) translateY(0);
    }
    .dibo-f06-body {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    .dibo-f06-left  { flex: 1; }
    .dibo-f06-right { flex: 1; }
  }

  .dibo-f06-badge {
    display: inline-block;
    background: #fdf6ec;
    color: #c9a96e;
    border: 1px solid #e8d5b0;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 8px;
    letter-spacing: 0.2px;
  }

  .dibo-f06-title {
    font-size: 18px;
    font-weight: 800;
    color: #1a1a1a;
    margin: 0 0 4px;
    letter-spacing: -0.5px;
    line-height: 1.35;
  }

  .dibo-f06-desc {
    font-size: 12px;
    color: #aaa;
    margin: 0 0 16px;
    line-height: 1.6;
  }

  /* ── 필드 ── */
  .dibo-f06-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 10px;
  }

  .dibo-f06-label {
    font-size: 11px;
    font-weight: 600;
    color: #888;
  }

  .dibo-f06-input {
    height: 44px;
    border: 1.5px solid #e8e0d0;
    border-radius: 8px;
    padding: 0 12px;
    font-size: 14px;
    color: #1a1a1a;
    background: #fafaf8;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    box-sizing: border-box;
    font-family: inherit;
    width: 100%;
  }

  .dibo-f06-input:focus { border-color: #c9a96e; background: #fff; }
  .dibo-f06-input::placeholder { color: #ccc; }

  .dibo-f06-row {
    display: flex;
    gap: 10px;
  }

  .dibo-f06-row .dibo-f06-field { flex: 1; }

  /* 인원 선택 */
  .dibo-f06-select {
    height: 44px;
    border: 1.5px solid #e8e0d0;
    border-radius: 8px;
    padding: 0 12px;
    font-size: 14px;
    color: #1a1a1a;
    background: #fafaf8;
    outline: none;
    transition: border-color 0.2s;
    box-sizing: border-box;
    font-family: inherit;
    width: 100%;
    cursor: pointer;
    appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 7L11 1' stroke='%23c9a96e' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 12px center;
  }

  .dibo-f06-select:focus { border-color: #c9a96e; }

  .dibo-f06-agree {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 14px;
    cursor: pointer;
  }

  .dibo-f06-checkbox {
    width: 15px;
    height: 15px;
    accent-color: #c9a96e;
    margin-top: 2px;
    flex-shrink: 0;
    cursor: pointer;
  }

  .dibo-f06-agree-text { font-size: 11px; color: #aaa; line-height: 1.55; }
  .dibo-f06-agree-link { color: #c9a96e; text-decoration: underline; cursor: pointer; }

  .dibo-f06-submit {
    width: 100%;
    height: 50px;
    background: #c9a96e;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: -0.3px;
    transition: background 0.2s, transform 0.1s;
    font-family: inherit;
  }

  .dibo-f06-submit:hover  { background: #b8985f; }
  .dibo-f06-submit:active { transform: scale(0.98); }
  .dibo-f06-submit:disabled { background: #e0d0b0; cursor: default; transform: none; }

  /* ── 완료 ── */
  .dibo-f06-thanks {
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 12px 24px 32px;
    text-align: center;
    gap: 8px;
  }

  .dibo-f06-thanks-icon  { font-size: 40px; }
  .dibo-f06-thanks-title { font-size: 17px; font-weight: 800; color: #1a1a1a; letter-spacing: -0.4px; }
  .dibo-f06-thanks-msg   { font-size: 12px; color: #aaa; line-height: 1.7; }
</style>
</head>
<body>
<div class="dibo-f06-wrap" id="diboF06Wrap">
  <div class="dibo-f06-card">

    <div class="dibo-f06-topbar">
      <div style="flex:1"></div>
      <div class="dibo-f06-handle"></div>
      <div style="flex:1; display:flex; justify-content:flex-end;">
        <button class="dibo-f06-close" id="diboF06Close">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M1 1L11 11M11 1L1 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="dibo-f06-inner">
      <div class="dibo-f06-body">

        <!-- 왼쪽: 헤드 -->
        <div class="dibo-f06-left">
          <div class="dibo-f06-badge">💍 맞춤 웨딩 견적</div>
          <p class="dibo-f06-title">우리 예식만을 위한<br>맞춤 견적 받아보세요</p>
          <p class="dibo-f06-desc">예식일과 인원을 알려주시면<br>웨딩 플래너가 직접 연락드립니다.</p>
        </div>

        <!-- 오른쪽: 폼 -->
        <div class="dibo-f06-right">
          <div id="diboF06FormArea">
            <div class="dibo-f06-field">
              <span class="dibo-f06-label">예식 희망일</span>
              <input class="dibo-f06-input" type="date" id="diboF06Date" />
            </div>

            <div class="dibo-f06-row">
              <div class="dibo-f06-field">
                <span class="dibo-f06-label">예상 하객 수</span>
                <select class="dibo-f06-select" id="diboF06Guests">
                  <option value="">선택</option>
                  <option value="~100명">~100명</option>
                  <option value="100~200명">100~200명</option>
                  <option value="200~300명">200~300명</option>
                  <option value="300명 이상">300명 이상</option>
                </select>
              </div>
              <div class="dibo-f06-field">
                <span class="dibo-f06-label">연락처</span>
                <input class="dibo-f06-input" type="tel" id="diboF06Tel" placeholder="010-0000-0000" maxlength="13" />
              </div>
            </div>

            <label class="dibo-f06-agree">
              <input class="dibo-f06-checkbox" type="checkbox" id="diboF06Agree" />
              <span class="dibo-f06-agree-text">
                <span class="dibo-f06-agree-link">[필수] 개인정보 수집·이용 동의</span>에 동의합니다.
              </span>
            </label>

            <button class="dibo-f06-submit" id="diboF06Submit" disabled>맞춤 견적 받아보기</button>
          </div>

          <div class="dibo-f06-thanks" id="diboF06Thanks">
            <div class="dibo-f06-thanks-icon">💐</div>
            <p class="dibo-f06-thanks-title">견적 신청 완료!</p>
            <p class="dibo-f06-thanks-msg">웨딩 플래너가 영업일 기준 1일 내<br>연락드리겠습니다.</p>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>

<script>
(function () {
  var wrap    = document.getElementById('diboF06Wrap');
  var closeBtn= document.getElementById('diboF06Close');
  var dateEl  = document.getElementById('diboF06Date');
  var guestsEl= document.getElementById('diboF06Guests');
  var telEl   = document.getElementById('diboF06Tel');
  var agreeEl = document.getElementById('diboF06Agree');
  var submitEl= document.getElementById('diboF06Submit');
  var STORAGE_KEY = 'diboF06Closed';

  /* 세션 내 이미 닫은 경우 표시 안함 */
  if (sessionStorage.getItem(STORAGE_KEY)) return;

  /* ── 스크롤 트리거 (40%) ── */
  function checkScroll() {
    var scrolled = window.scrollY || document.documentElement.scrollTop;
    var total    = document.documentElement.scrollHeight - window.innerHeight;
    if (total <= 0) return;
    if (scrolled / total >= 0.4) {
      wrap.classList.add('is-visible');
      window.removeEventListener('scroll', checkScroll);
    }
  }
  window.addEventListener('scroll', checkScroll);
  /* 페이지가 짧으면 3초 후 자동 노출 */
  setTimeout(function () { wrap.classList.add('is-visible'); }, 3000);

  /* ── 닫기 ── */
  closeBtn.addEventListener('click', function () {
    wrap.classList.remove('is-visible');
    sessionStorage.setItem(STORAGE_KEY, '1');
  });

  /* ── 전화번호 포맷 ── */
  telEl.addEventListener('input', function () {
    var v = telEl.value.replace(/\D/g,'');
    if (v.length <= 3)      telEl.value = v;
    else if (v.length <= 7) telEl.value = v.slice(0,3)+'-'+v.slice(3);
    else                    telEl.value = v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7,11);
    validate();
  });
  dateEl.addEventListener('change', validate);
  guestsEl.addEventListener('change', validate);
  agreeEl.addEventListener('change', validate);

  function validate() {
    submitEl.disabled = !(
      dateEl.value &&
      guestsEl.value &&
      telEl.value.replace(/\D/g,'').length >= 10 &&
      agreeEl.checked
    );
  }

  /* ── 제출 ── */
  submitEl.addEventListener('click', function () {
    if (this.disabled) return;
    document.getElementById('diboF06FormArea').style.display = 'none';
    document.getElementById('diboF06Thanks').style.display   = 'flex';
    sessionStorage.setItem(STORAGE_KEY, '1');
  });
})();
</script>
</body>
</html>
