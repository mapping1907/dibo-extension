<!DOCTYPE html>
<!--
  ================================================================
  ✦ 디보(dibo) 익스텐션 | 이탈 방지 팝업 (Exit Intent Popup)
  ================================================================

  【페이지 개요】
  사용자가 페이지를 떠나려는 순간 팝업을 표시해
  문의·쿠폰·상담 신청으로 전환을 유도하는 컴포넌트입니다.

  【지원 트리거 3종】
  ① mouseExit  — PC: 마우스 커서가 화면 상단을 벗어날 때
  ② timeOnPage — 페이지 진입 후 일정 시간 체류 시 (모바일 포함)
  ③ scrollUp   — 아래로 스크롤 후 위로 올릴 때 (모바일 대표 트리거)
  + mobileBack — 모바일 뒤로가기 감지 (실험적 옵션)

  【재노출 방지 규칙】
  - 팝업은 세션(탭)당 1회만 자동 표시됩니다.
  - 사용자가 "오늘 하루 보지 않기" 선택 시 → 다음 날까지 미표시

  【사용 전 필수 설정】
  1. triggers 항목에서 원하는 트리거 true/false 설정
  2. 팝업 콘텐츠(badge, headline, benefits, button) 수정
  3. button.url → 실제 랜딩/신청 페이지 URL로 교체         ★ [수정 필수]
  ================================================================
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이탈 방지 팝업</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* 페이지 예시 배경 (팝업과 무관) */
    .demo-bg {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 10px;
      color: #9ca3af;
      font-size: 15px;
    }
    .demo-bg-icon { font-size: 48px; }

    /* ================================================================
       오버레이
       ================================================================ */
    .dibo-exit-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.62);
      z-index: 9100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .dibo-exit-overlay.is-visible {
      opacity: 1;
      visibility: visible;
    }

    /* ================================================================
       팝업 박스
       ================================================================ */
    .dibo-exit-popup {
      position: relative;
      background: #fff;
      border-radius: 22px;
      width: 100%;
      max-width: 460px;
      overflow: hidden;
      box-shadow: 0 28px 72px rgba(0, 0, 0, 0.32);
      transform: scale(0.88) translateY(32px);
      opacity: 0;
      transition: transform 0.36s cubic-bezier(0.34, 1.4, 0.64, 1),
                  opacity 0.3s ease;
    }

    .dibo-exit-overlay.is-visible .dibo-exit-popup {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    /* ---- 닫기(×) 버튼 ---- */
    .exit-close-x {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 20;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.18);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .exit-close-x:hover { background: rgba(255, 255, 255, 0.32); }

    .exit-close-x svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: rgba(255, 255, 255, 0.9);
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    /* ================================================================
       상단 헤더 (그라디언트 배경)
       ================================================================ */
    .exit-header {
      background: linear-gradient(135deg, #1e1b4b 0%, #4f46e5 60%, #7c3aed 100%);
      padding: 32px 28px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* 장식용 원 */
    .exit-header::before,
    .exit-header::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      pointer-events: none;
    }

    .exit-header::before {
      width: 220px;
      height: 220px;
      top: -80px;
      right: -60px;
    }

    .exit-header::after {
      width: 140px;
      height: 140px;
      bottom: -50px;
      left: -30px;
    }

    .exit-header-icon {
      font-size: 42px;
      line-height: 1;
      margin-bottom: 12px;
      display: block;
      position: relative;
      z-index: 1;
      animation: iconShake 0.6s ease 0.4s both;
    }

    @keyframes iconShake {
      0%   { transform: rotate(0deg); }
      20%  { transform: rotate(-8deg); }
      40%  { transform: rotate(8deg); }
      60%  { transform: rotate(-5deg); }
      80%  { transform: rotate(5deg); }
      100% { transform: rotate(0deg); }
    }

    .exit-header-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 5px 14px;
      border-radius: 20px;
      letter-spacing: 0.04em;
      position: relative;
      z-index: 1;
    }

    /* ================================================================
       본문
       ================================================================ */
    .exit-body {
      padding: 26px 28px 22px;
    }

    /* ---- 카운트다운 타이머 ---- */
    .exit-countdown-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #fef2f2;
      border: 1.5px solid #fecaca;
      border-radius: 10px;
      padding: 10px 16px;
      margin-bottom: 20px;
    }

    .countdown-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      flex-shrink: 0;
      animation: countdownPulse 1s ease-in-out infinite;
    }

    @keyframes countdownPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    .countdown-label {
      font-size: 13px;
      color: #6b7280;
    }

    .countdown-time {
      font-size: 18px;
      font-weight: 800;
      color: #ef4444;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      min-width: 48px;
      text-align: center;
    }

    .countdown-time.is-expired {
      font-size: 13px;
      color: #9ca3af;
      font-weight: 500;
      letter-spacing: 0;
    }

    /* ---- 헤드라인 ---- */
    .exit-headline {
      font-size: 21px;
      font-weight: 800;
      color: #0f0f1a;
      line-height: 1.3;
      margin-bottom: 8px;
      word-break: keep-all;
    }

    .exit-subheadline {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.75;
      margin-bottom: 20px;
      word-break: keep-all;
    }

    /* ---- 혜택 목록 ---- */
    .exit-benefits {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 22px;
    }

    .exit-benefits li {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #374151;
      font-weight: 500;
    }

    .benefit-check {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .benefit-check svg {
      width: 11px;
      height: 11px;
      fill: none;
      stroke: #fff;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ---- CTA 버튼 ---- */
    .exit-cta {
      display: block;
      width: 100%;
      padding: 15px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: filter 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(79, 70, 229, 0.38);
    }

    .exit-cta:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(79, 70, 229, 0.46);
    }

    .exit-cta:active { transform: translateY(0); }

    /* ================================================================
       하단 바
       ================================================================ */
    .exit-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px 14px;
      border-top: 1px solid #f0f0f3;
    }

    .exit-dismiss-btn {
      font-size: 13px;
      color: #9ca3af;
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
      padding: 2px 4px;
      transition: color 0.2s;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .exit-dismiss-btn:hover { color: #6b7280; }

    .exit-hide-today {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }

    .exit-hide-today input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #4f46e5;
      cursor: pointer;
      margin: 0;
    }

    .exit-hide-today span {
      font-size: 12px;
      color: #9ca3af;
    }

    /* ================================================================
       반응형
       ================================================================ */
    @media (max-width: 480px) {
      .dibo-exit-overlay {
        align-items: flex-end;
        padding: 0;
      }

      .dibo-exit-popup {
        border-radius: 20px 20px 0 0;
        max-width: 100%;
        transform: translateY(60px);
      }

      .dibo-exit-overlay.is-visible .dibo-exit-popup {
        transform: translateY(0);
      }

      .exit-header { padding: 26px 20px 22px; }
      .exit-header-icon { font-size: 36px; }
      .exit-body { padding: 20px 20px 18px; }
      .exit-headline { font-size: 18px; }
    }
  </style>
</head>
<body>

<!-- 페이지 콘텐츠 예시 -->
<div class="demo-bg">
  <div class="demo-bg-icon">🖥️</div>
  <p>페이지 콘텐츠 영역</p>
  <p style="font-size:13px; color:#b0b8c9; line-height:1.8;">① 마우스를 화면 맨 위쪽으로 이동하거나<br>② 아래로 스크롤 후 위로 올리면 팝업이 표시됩니다.</p>
</div>
<!-- scrollUp 트리거 테스트용 더미 높이 -->
<div style="height:1200px; background:linear-gradient(to bottom,#f0f2f5,#e4e8f0);"></div>

<!-- ================================================================
     이탈 방지 팝업 마크업
     ================================================================ -->
<div class="dibo-exit-overlay" id="jsExitOverlay" role="dialog" aria-modal="true" aria-labelledby="jsExitHeadline">
  <div class="dibo-exit-popup" id="jsExitPopup">

    <!-- × 버튼 -->
    <button class="exit-close-x" id="jsCloseX" aria-label="팝업 닫기">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>

    <!-- 헤더 -->
    <div class="exit-header">
      <span class="exit-header-icon" id="jsHeaderIcon"></span>
      <span class="exit-header-badge" id="jsBadge"></span>
    </div>

    <!-- 본문 -->
    <div class="exit-body">

      <!-- 카운트다운 -->
      <div class="exit-countdown-wrap" id="jsCountdownWrap" style="display:none;">
        <span class="countdown-dot"></span>
        <span class="countdown-label" id="jsCountdownLabel"></span>
        <span class="countdown-time" id="jsCountdownTime">--:--</span>
      </div>

      <h2 class="exit-headline" id="jsExitHeadline"></h2>
      <p class="exit-subheadline" id="jsSubheadline"></p>

      <ul class="exit-benefits" id="jsBenefits"></ul>

      <a class="exit-cta" id="jsCtaBtn" href="#" target="_self"></a>
    </div>

    <!-- 하단 -->
    <div class="exit-footer">
      <button class="exit-dismiss-btn" id="jsDismissBtn"></button>
      <label class="exit-hide-today" id="jsHideTodayLabel">
        <input type="checkbox" id="jsHideTodayCheck">
        <span>오늘 하루 보지 않기</span>
      </label>
    </div>

  </div>
</div>

<script>
/* ================================================================
   【이탈 방지 팝업 설정】
   ================================================================ */
const exitConfig = {

  // ── 트리거 ─────────────────────────────────────────────────
  triggers: {
    mouseExit:  true,   // [수정 가능] PC: 마우스가 화면 상단 밖으로 나갈 때
    timeOnPage: true,   // [수정 가능] 페이지 체류 시간 초과 시 (timeDelay 설정)
    scrollUp:   true,   // [수정 가능] 아래로 스크롤 후 위로 다시 올릴 때
    mobileBack: false,  // [수정 가능] 모바일 뒤로가기 감지 (실험적)
  },

  mouseExitThreshold: 15,  // [수정 가능] 마우스 Y 좌표 기준 (px, 이하 → 이탈 판정)
  timeDelay:        20000, // [수정 가능] 체류 시간 트리거 지연 (ms) — 기본 20초
  scrollUpMinDown:    400, // [수정 가능] 스크롤 트리거 최소 스크롤 다운량 (px)
  scrollUpAmount:     180, // [수정 가능] 피크 대비 이만큼 위로 올리면 발동 (px)

  closeOnBackdrop: true,   // [수정 가능] 배경 클릭 시 닫기 여부

  // ── 카운트다운 타이머 ──────────────────────────────────────
  countdown: {
    enabled: true,       // [수정 가능] 카운트다운 표시 여부
    seconds: 300,        // [수정 가능] 카운트다운 시작 시간 (초)
    label:   '이 혜택은',
    suffix:  '후 만료됩니다',
  },

  // ── 콘텐츠 ────────────────────────────────────────────────
  headerIcon:  '🎁',                          // [수정 가능] 상단 아이콘 (이모지)
  badge:       '잠깐, 떠나기 전에!',          // [수정 가능] 배지 텍스트
  headline:    '무료 상담 혜택이 준비되어 있어요', // [수정 가능] 헤드라인
  subheadline: '지금 신청하시면 전문가와 1:1 무료 상담 후\n맞춤 견적을 즉시 받아보실 수 있습니다.', // [수정 가능] 설명 (\n = 줄바꿈)

  benefits: [             // [수정 가능] 혜택 목록 (빈 배열 [] 이면 숨김)
    '전문가 1:1 무료 상담 (30분)',
    '맞춤 견적 당일 제공',
    '첫 달 이용료 50% 할인 쿠폰',
  ],

  button: {
    text:   '무료 상담 신청하기 →',  // [수정 가능] 버튼 텍스트
    url:    '#',                     // ★ [수정 필수] 신청 페이지 URL
    newTab: false,                   // [수정 가능] 새 탭 열기 여부
  },

  dismissText: '아니요, 그냥 나갈게요', // [수정 가능] 하단 닫기 텍스트
  hideToday:   true,                   // [수정 가능] '오늘 하루 보지 않기' 표시 여부
  storageKey:  'dibo-exit-popup',      // [수정 가능] 저장소 키 (페이지별로 고유 키 권장)
};

/* ================================================================
   이하 코드는 수정하지 않아도 됩니다
   ================================================================ */
(function () {
  let triggered = false;
  let countdownTimer = null;
  let scrollPeak = 0;
  let timeoutId  = null;

  // ── 초기화 ────────────────────────────────────────────────
  if (isDismissedToday()) return;
  renderPopup();
  attachTriggers();

  // ── 표시 여부 판단 ───────────────────────────────────────
  function isDismissedToday() {
    try {
      return localStorage.getItem(exitConfig.storageKey) === new Date().toDateString();
    } catch { return false; }
  }

  function dismissToday() {
    try { localStorage.setItem(exitConfig.storageKey, new Date().toDateString()); } catch {}
  }

  // ── 팝업 렌더링 ──────────────────────────────────────────
  function renderPopup() {
    document.getElementById('jsHeaderIcon').textContent   = exitConfig.headerIcon || '';
    document.getElementById('jsBadge').textContent        = exitConfig.badge || '';
    document.getElementById('jsExitHeadline').textContent = exitConfig.headline || '';
    document.getElementById('jsSubheadline').innerHTML    =
      (exitConfig.subheadline || '').replace(/\n/g, '<br>');

    // 혜택 목록
    const ul = document.getElementById('jsBenefits');
    (exitConfig.benefits || []).forEach(text => {
      const li = document.createElement('li');
      li.innerHTML = `
        <span class="benefit-check">
          <svg viewBox="0 0 12 10"><polyline points="1,5 4.5,9 11,1"/></svg>
        </span>
        ${text}
      `;
      ul.appendChild(li);
    });
    if (!exitConfig.benefits || !exitConfig.benefits.length) ul.style.display = 'none';

    // CTA 버튼
    const cta = document.getElementById('jsCtaBtn');
    cta.textContent = exitConfig.button.text || '자세히 보기';
    cta.href        = exitConfig.button.url || '#';
    cta.target      = exitConfig.button.newTab ? '_blank' : '_self';
    if (exitConfig.button.newTab) cta.rel = 'noopener noreferrer';

    // 하단 닫기 텍스트
    document.getElementById('jsDismissBtn').textContent = exitConfig.dismissText || '닫기';

    // 오늘 하루 보지 않기
    if (!exitConfig.hideToday) {
      document.getElementById('jsHideTodayLabel').style.display = 'none';
    }

    // 카운트다운
    if (!exitConfig.countdown || !exitConfig.countdown.enabled) {
      document.getElementById('jsCountdownWrap').style.display = 'none';
    }
  }

  // ── 팝업 표시 ────────────────────────────────────────────
  function showPopup(triggerType) {
    if (triggered) return;
    triggered = true;
    document.getElementById('jsExitOverlay').classList.add('is-visible');
    removeAllTriggers();
    document.body.style.overflow = 'hidden';

    // 카운트다운 시작
    if (exitConfig.countdown && exitConfig.countdown.enabled) {
      const wrap = document.getElementById('jsCountdownWrap');
      wrap.style.display = 'flex';
      document.getElementById('jsCountdownLabel').textContent =
        exitConfig.countdown.label || '';
      const suffix = exitConfig.countdown.suffix || '';
      startCountdown(exitConfig.countdown.seconds || 300, suffix);
    }
  }

  // ── 팝업 닫기 ────────────────────────────────────────────
  function closePopup() {
    document.getElementById('jsExitOverlay').classList.remove('is-visible');
    document.body.style.overflow = '';
    if (countdownTimer) clearInterval(countdownTimer);

    if (exitConfig.hideToday &&
        document.getElementById('jsHideTodayCheck').checked) {
      dismissToday();
    }
  }

  // ── 카운트다운 ───────────────────────────────────────────
  function startCountdown(totalSeconds, suffix) {
    const el = document.getElementById('jsCountdownTime');
    let remaining = totalSeconds;

    function tick() {
      if (remaining <= 0) {
        clearInterval(countdownTimer);
        el.textContent = '혜택 만료';
        el.classList.add('is-expired');
        return;
      }
      const m = Math.floor(remaining / 60).toString().padStart(2, '0');
      const s = (remaining % 60).toString().padStart(2, '0');
      el.textContent = `${m}:${s}`;
      remaining--;
    }

    tick();
    countdownTimer = setInterval(tick, 1000);
  }

  // ── 트리거 등록 ──────────────────────────────────────────
  function attachTriggers() {
    // ① 마우스 이탈 (PC) — document.documentElement 에 붙여야 안정적으로 발동
    if (exitConfig.triggers.mouseExit) {
      document.documentElement.addEventListener('mouseleave', onMouseLeave);
    }

    // ② 체류 시간
    if (exitConfig.triggers.timeOnPage) {
      timeoutId = setTimeout(() => showPopup('time'), exitConfig.timeDelay || 20000);
    }

    // ③ 스크롤 업
    if (exitConfig.triggers.scrollUp) {
      window.addEventListener('scroll', onScroll, { passive: true });
    }

    // ④ 모바일 뒤로가기 (실험적)
    if (exitConfig.triggers.mobileBack) {
      history.pushState(null, '', location.href);
      window.addEventListener('popstate', onPopState);
    }
  }

  function removeAllTriggers() {
    document.documentElement.removeEventListener('mouseleave', onMouseLeave);
    window.removeEventListener('scroll', onScroll);
    window.removeEventListener('popstate', onPopState);
    if (timeoutId) clearTimeout(timeoutId);
  }

  // ── 각 트리거 핸들러 ─────────────────────────────────────

  // ① 마우스 상단 이탈
  function onMouseLeave(e) {
    if (e.clientY <= (exitConfig.mouseExitThreshold || 15)) {
      showPopup('mouseExit');
    }
  }

  // ③ 스크롤 업 감지
  function onScroll() {
    const current = window.scrollY;
    if (current > scrollPeak) {
      scrollPeak = current;
    } else if (scrollPeak > (exitConfig.scrollUpMinDown || 400)) {
      const upAmount = scrollPeak - current;
      if (upAmount > (exitConfig.scrollUpAmount || 180)) {
        showPopup('scrollUp');
      }
    }
  }

  // ④ 뒤로가기 감지
  function onPopState() {
    history.pushState(null, '', location.href); // 다시 밀어 넣어 이탈 방지
    showPopup('mobileBack');
  }

  // ── 닫기 이벤트 바인딩 ───────────────────────────────────
  document.getElementById('jsCloseX').addEventListener('click', closePopup);
  document.getElementById('jsDismissBtn').addEventListener('click', closePopup);

  if (exitConfig.closeOnBackdrop) {
    document.getElementById('jsExitOverlay').addEventListener('click', function (e) {
      if (e.target === this) closePopup();
    });
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closePopup();
  });

})();
</script>

</body>
</html>
