<!DOCTYPE html>
<!--
  ================================================================
  ✦ 디보(dibo) 익스텐션 | 팝업 관리
  ================================================================

  【페이지 개요】
  운영자가 설정값만 바꿔 팝업을 켜고 끄는 관리형 팝업입니다.
  이벤트·공지·쿠폰·점검 안내 등 다양한 목적으로 활용 가능합니다.

  【사용 전 필수 설정】
  1. enabled  : true(활성) / false(비활성)       ★ [수정 필수]
  2. startDate / endDate : 팝업 노출 기간 설정   ★ [수정 필수]
     (빈 문자열 '' 이면 해당 제한 없음)
  3. 팝업 콘텐츠(image, badge, title, description, button) 수정

  【동작 방식】
  ① enabled 가 false → 팝업 미표시
  ② 현재 날짜가 startDate ~ endDate 범위 밖 → 팝업 미표시
  ③ 사용자가 "오늘 하루 보지 않기" 선택 후 재방문 → 당일 미표시
  ④ 위 조건 모두 통과 → delay(ms) 후 팝업 표시
  ================================================================
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>팝업 관리</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* ---- 페이지 예시 배경 (팝업과 무관) ---- */
    .demo-bg {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 12px;
      color: #9ca3af;
      font-size: 15px;
    }
    .demo-bg-icon { font-size: 48px; margin-bottom: 4px; }

    /* ================================================================
       팝업 오버레이
       ================================================================ */
    .dibo-popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.58);
      z-index: 9000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.28s ease, visibility 0.28s ease;
    }

    .dibo-popup-overlay.is-visible {
      opacity: 1;
      visibility: visible;
    }

    /* ================================================================
       팝업 박스
       ================================================================ */
    .dibo-popup {
      position: relative;
      background: #fff;
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.28);
      transform: scale(0.92) translateY(24px);
      opacity: 0;
      transition: transform 0.32s cubic-bezier(0.34, 1.36, 0.64, 1),
                  opacity 0.28s ease;
    }

    .dibo-popup-overlay.is-visible .dibo-popup {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    /* ---- 닫기(×) 버튼 ---- */
    .popup-close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 10;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.32);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      line-height: 1;
    }

    .popup-close-btn:hover { background: rgba(0, 0, 0, 0.52); }

    .popup-close-btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #fff;
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    /* ---- 상단 이미지 ---- */
    .popup-image-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      display: none; /* JS로 image 있을 때 block */
    }

    .popup-image-wrap.has-image { display: block; }

    .popup-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ---- 콘텐츠 영역 ---- */
    .popup-body {
      padding: 28px 28px 24px;
    }

    /* 이미지 없을 때 상단 여백 확보 (닫기 버튼과 겹침 방지) */
    .popup-no-image .popup-body {
      padding-top: 52px;
    }

    /* 배지 */
    .popup-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #6366f1;
      background: #eef2ff;
      padding: 5px 13px;
      border-radius: 20px;
      margin-bottom: 14px;
    }

    /* 제목 */
    .popup-title {
      font-size: 20px;
      font-weight: 800;
      color: #0f0f1a;
      line-height: 1.35;
      margin-bottom: 10px;
      word-break: keep-all;
    }

    /* 설명 */
    .popup-description {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.75;
      margin-bottom: 22px;
      word-break: keep-all;
    }

    /* CTA 버튼 */
    .popup-cta {
      display: block;
      width: 100%;
      padding: 14px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: filter 0.2s, transform 0.15s;
    }

    .popup-cta:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .popup-cta:active { transform: translateY(0); }

    /* ---- 하단 바 (오늘 하루 / 닫기) ---- */
    .popup-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 20px 14px;
      border-top: 1px solid #f0f0f3;
    }

    /* 오늘 하루 보지 않기 */
    .popup-hide-today {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      user-select: none;
    }

    .popup-hide-today input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #6366f1;
      cursor: pointer;
      flex-shrink: 0;
      margin: 0;
    }

    .popup-hide-today span {
      font-size: 13px;
      color: #9ca3af;
    }

    /* 닫기 텍스트 버튼 */
    .popup-close-text {
      font-size: 13px;
      color: #9ca3af;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
      font-family: 'Noto Sans KR', sans-serif;
      transition: color 0.2s;
    }

    .popup-close-text:hover { color: #4b5563; }

    /* ================================================================
       팝업 타입별 스타일 변형
       ================================================================ */

    /* 공지(notice) 타입 */
    .dibo-popup.type-notice .popup-badge {
      color: #f59e0b;
      background: #fffbeb;
    }
    .dibo-popup.type-notice .popup-cta {
      background: linear-gradient(135deg, #f59e0b, #f97316);
    }

    /* 쿠폰(coupon) 타입 */
    .dibo-popup.type-coupon .popup-badge {
      color: #10b981;
      background: #ecfdf5;
    }
    .dibo-popup.type-coupon .popup-cta {
      background: linear-gradient(135deg, #10b981, #059669);
    }
    /* 쿠폰 코드 박스 */
    .coupon-code-box {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      border: 1.5px dashed #d1fae5;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 20px;
    }
    .dibo-popup.type-coupon .coupon-code-box { display: flex; }
    .coupon-code-label { font-size: 12px; color: #6b7280; }
    .coupon-code-value {
      font-size: 20px;
      font-weight: 800;
      color: #10b981;
      letter-spacing: 0.08em;
    }
    .coupon-copy-btn {
      font-size: 12px;
      font-weight: 600;
      color: #10b981;
      background: #d1fae5;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .coupon-copy-btn:hover { background: #a7f3d0; }
    .coupon-copy-btn.copied { color: #6b7280; background: #e5e7eb; }

    /* 점검(maintenance) 타입 */
    .dibo-popup.type-maintenance .popup-badge {
      color: #ef4444;
      background: #fef2f2;
    }
    .dibo-popup.type-maintenance .popup-cta {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }

    /* ================================================================
       반응형
       ================================================================ */
    @media (max-width: 480px) {
      .dibo-popup-overlay {
        align-items: flex-end;
        padding: 0;
      }

      .dibo-popup {
        border-radius: 20px 20px 0 0;
        max-width: 100%;
        transform: translateY(60px);
      }

      .dibo-popup-overlay.is-visible .dibo-popup {
        transform: translateY(0);
      }

      .popup-body { padding: 24px 22px 20px; }
      .popup-no-image .popup-body { padding-top: 48px; }
      .popup-title { font-size: 18px; }
    }
  </style>
</head>
<body>
<!-- ================================================================
     팝업 마크업 (JS가 동적으로 콘텐츠 채움)
     ================================================================ -->
<div class="dibo-popup-overlay" id="jsOverlay" role="dialog" aria-modal="true">
  <div class="dibo-popup" id="jsPopup">

    <!-- 닫기(×) 버튼 -->
    <button class="popup-close-btn" id="jsCloseBtnX" aria-label="팝업 닫기">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>

    <!-- 상단 이미지 -->
    <div class="popup-image-wrap" id="jsImageWrap">
      <img id="jsImage" src="" alt="">
    </div>

    <!-- 본문 -->
    <div class="popup-body">
      <div class="popup-badge" id="jsBadge"></div>
      <h2 class="popup-title" id="jsTitle"></h2>
      <p class="popup-description" id="jsDescription"></p>

      <!-- 쿠폰 코드 박스 (type='coupon' 일 때만 표시) -->
      <div class="coupon-code-box" id="jsCouponBox">
        <div>
          <div class="coupon-code-label">쿠폰 코드</div>
          <div class="coupon-code-value" id="jsCouponCode"></div>
        </div>
        <button class="coupon-copy-btn" id="jsCopyBtn">복사하기</button>
      </div>

      <a class="popup-cta" id="jsCtaBtn" href="#" target="_self"></a>
    </div>

    <!-- 하단: 오늘 하루 보지 않기 / 닫기 -->
    <div class="popup-footer">
      <label class="popup-hide-today" id="jsHideTodayLabel">
        <input type="checkbox" id="jsHideTodayCheck">
        <span>오늘 하루 보지 않기</span>
      </label>
      <button class="popup-close-text" id="jsCloseBtnText">닫기</button>
    </div>

  </div>
</div>

<script>
/* ================================================================
   【팝업 기본 설정】                                 ← [수정 가능]
   ================================================================ */
const popupConfig = {

  enabled:   true,          // ★ [수정 필수] 팝업 활성화 여부 (false = 비활성)
  startDate: '',            // ★ [수정 가능] 노출 시작일 'YYYY-MM-DD' ('' = 제한 없음)
  endDate:   '',            // ★ [수정 가능] 노출 종료일 'YYYY-MM-DD' ('' = 제한 없음)

  delay: 800,               // [수정 가능] 페이지 로드 후 팝업 표시까지 지연 시간(ms)
  closeOnBackdrop: true,    // [수정 가능] 배경 클릭 시 닫기 여부

  // ── 팝업 타입 ─────────────────────────────────────────────
  // 'event'       : 이벤트 공지 (인디고/보라 버튼)
  // 'notice'      : 일반 공지   (주황 버튼)
  // 'coupon'      : 쿠폰 안내   (초록 버튼 + 쿠폰 코드)
  // 'maintenance' : 점검 안내   (빨강 버튼)
  type: 'event',            // ★ [수정 필수] 팝업 타입

  // ── 팝업 콘텐츠 ───────────────────────────────────────────
  image:       'https://picsum.photos/seed/popup-event/880/495', // [수정 가능] 상단 이미지 URL (없으면 '' 입력)
  badge:       '🎁 특별 이벤트',                                  // [수정 가능] 상단 배지 텍스트 (없으면 '' 입력)
  title:       '신규 가입 혜택 안내',                              // [수정 가능] 팝업 제목
  description: '지금 가입하시면 첫 달 이용료 50% 할인 쿠폰을\n즉시 발급해 드립니다. 이번 기회를 놓치지 마세요!', // [수정 가능] 팝업 설명 (\n = 줄바꿈)
  couponCode:  'DIBO2025',  // [수정 가능] 쿠폰 코드 (type='coupon' 일 때만 표시)

  button: {
    text:   '지금 혜택 받기',   // [수정 가능] 버튼 텍스트
    url:    '#',                // ★ [수정 필수] 버튼 클릭 시 이동할 URL
    newTab: false               // [수정 가능] 새 탭 열기 여부
  },

  hideToday: true,             // [수정 가능] '오늘 하루 보지 않기' 옵션 표시 여부

  // localStorage 키 — 페이지마다 다른 팝업이 필요하면 고유 키 사용
  storageKey: 'dibo-popup-dismiss'
};

/* ================================================================
   이하 코드는 수정하지 않아도 됩니다
   ================================================================ */

(function () {
  // ① enabled 체크
  if (!popupConfig.enabled) return;

  // ② 날짜 범위 체크
  if (!isInDateRange()) return;

  // ③ 오늘 하루 보지 않기 체크
  if (isDismissedToday()) return;

  // ④ 팝업 렌더링 → delay 후 표시
  renderPopup();
  setTimeout(showPopup, Math.max(0, popupConfig.delay));

  /* ---- 날짜 범위 유효성 ---- */
  function isInDateRange() {
    const now = new Date();
    now.setHours(0, 0, 0, 0);
    if (popupConfig.startDate) {
      const start = new Date(popupConfig.startDate);
      if (now < start) return false;
    }
    if (popupConfig.endDate) {
      const end = new Date(popupConfig.endDate);
      end.setHours(23, 59, 59, 999);
      if (now > end) return false;
    }
    return true;
  }

  /* ---- localStorage 기반 당일 숨김 ---- */
  function isDismissedToday() {
    const stored = localStorage.getItem(popupConfig.storageKey);
    return stored === new Date().toDateString();
  }

  function dismissToday() {
    localStorage.setItem(popupConfig.storageKey, new Date().toDateString());
  }

  /* ---- 팝업 콘텐츠 렌더링 ---- */
  function renderPopup() {
    const popup = document.getElementById('jsPopup');

    // 타입 클래스
    popup.classList.add('type-' + (popupConfig.type || 'event'));

    // 이미지
    const imageWrap = document.getElementById('jsImageWrap');
    if (popupConfig.image) {
      imageWrap.classList.add('has-image');
      document.getElementById('jsImage').src = popupConfig.image;
      document.getElementById('jsImage').alt = popupConfig.title;
    } else {
      popup.classList.add('popup-no-image');
    }

    // 배지
    const badge = document.getElementById('jsBadge');
    if (popupConfig.badge) {
      badge.textContent = popupConfig.badge;
    } else {
      badge.style.display = 'none';
    }

    // 제목 / 설명
    document.getElementById('jsTitle').textContent = popupConfig.title;
    document.getElementById('jsDescription').innerHTML =
      (popupConfig.description || '').replace(/\n/g, '<br>');

    // 쿠폰 코드 (type='coupon')
    if (popupConfig.type === 'coupon' && popupConfig.couponCode) {
      document.getElementById('jsCouponCode').textContent = popupConfig.couponCode;
      document.getElementById('jsCopyBtn').addEventListener('click', function () {
        navigator.clipboard.writeText(popupConfig.couponCode).then(() => {
          this.textContent = '복사됨 ✓';
          this.classList.add('copied');
          setTimeout(() => {
            this.textContent = '복사하기';
            this.classList.remove('copied');
          }, 2000);
        });
      });
    }

    // CTA 버튼
    const cta = document.getElementById('jsCtaBtn');
    cta.textContent = popupConfig.button.text || '자세히 보기';
    cta.href = popupConfig.button.url || '#';
    cta.target = popupConfig.button.newTab ? '_blank' : '_self';
    if (popupConfig.button.newTab) cta.rel = 'noopener noreferrer';

    // 오늘 하루 보지 않기
    if (!popupConfig.hideToday) {
      document.getElementById('jsHideTodayLabel').style.display = 'none';
    }
  }

  /* ---- 팝업 표시 / 숨김 ---- */
  function showPopup() {
    document.getElementById('jsOverlay').classList.add('is-visible');
    document.body.style.overflow = 'hidden';
  }

  function closePopup() {
    const overlay = document.getElementById('jsOverlay');
    overlay.classList.remove('is-visible');
    document.body.style.overflow = '';

    // 오늘 하루 보지 않기 체크된 경우
    if (popupConfig.hideToday &&
        document.getElementById('jsHideTodayCheck').checked) {
      dismissToday();
    }
  }

  /* ---- 이벤트 바인딩 ---- */
  // × 버튼
  document.getElementById('jsCloseBtnX').addEventListener('click', closePopup);
  // 하단 닫기 버튼
  document.getElementById('jsCloseBtnText').addEventListener('click', closePopup);
  // 배경 클릭
  if (popupConfig.closeOnBackdrop) {
    document.getElementById('jsOverlay').addEventListener('click', function (e) {
      if (e.target === this) closePopup();
    });
  }
  // ESC 키
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closePopup();
  });

})();
</script>

</body>
</html>
