<!DOCTYPE html>
<!--
  ================================================================
  ✦ 디보(dibo) 익스텐션 | 인터랙티브 플랜 비교 팝업 – SaaS·서비스형 사이트
  ================================================================

  【페이지 개요】
  중앙 모달 형태로 등장하는 Stripe 스타일의 인터랙티브 플랜 비교 팝업입니다.
  사용자가 카드를 직접 클릭하고 월간/연간 요금을 토글하며 탐색하는 능동적 UX를
  제공합니다. SaaS, 구독 서비스, 멤버십 기반 사이트의 전환율 향상에 최적화되어 있습니다.

  【SEO 키워드】
  플랜 비교 팝업, 요금제 비교 모달, SaaS 가격표 팝업, 월간 연간 토글, 인터랙티브 팝업

  【사용 전 필수 설정】
  1. config_id  ★ [수정 필수]
     → 스크립트 내 `copy_config_id`를 디보 백오피스에서 발급받은 실제 ID로 교체하세요.
  2. 플랜 데이터
     → 스크립트 내 `SAMPLE_PLANS` 배열의 name, monthlyPrice, annualPrice, features 등을
       실제 서비스 플랜에 맞게 수정하세요.
  3. CTA 링크
     → 각 플랜의 `ctaLink`를 실제 결제·가입 페이지 URL로 교체하세요.

  【동작 방식】
  - 페이지 로드 1.2초 후 중앙 오버레이 모달로 등장합니다.
  - 월간/연간 버튼 클릭 시 가격이 페이드 전환됩니다.
  - 플랜 카드 클릭 시 퍼플 테두리 + glow로 선택 강조되고 나머지는 흐려집니다.
  - × 버튼, 배경 오버레이 클릭, ESC 키로 팝업을 닫습니다.
  - 세션 종료 전까지 닫은 팝업은 재등장하지 않습니다.
  ================================================================
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인터랙티브 플랜 비교 팝업 — DIBO Popup Series #02</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ================================================================
       데모 배경 (팝업과 무관 — 실제 사이트에는 포함되지 않음)
       ================================================================ */
    .demo-page {
      min-height: 200vh;
      background: linear-gradient(160deg, #f0f4ff 0%, #f5f3ff 45%, #fdf4ff 70%, #f0f9ff 100%);
    }

    .demo-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 40px 20px;
    }

    .demo-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #635BFF;
      background: rgba(99, 91, 255, 0.08);
      border: 1px solid rgba(99, 91, 255, 0.2);
      padding: 5px 14px;
      border-radius: 99px;
      margin-bottom: 28px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .demo-hero h1 {
      font-size: clamp(28px, 5vw, 52px);
      font-weight: 800;
      color: #1a1a2e;
      line-height: 1.2;
      letter-spacing: -0.03em;
      margin-bottom: 18px;
      word-break: keep-all;
    }

    .demo-hero p {
      font-size: clamp(14px, 2vw, 18px);
      color: #6b7280;
      line-height: 1.75;
      max-width: 480px;
      margin-bottom: 48px;
      word-break: keep-all;
    }

    .demo-show-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: #635BFF;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      letter-spacing: -0.01em;
      box-shadow: 0 4px 20px rgba(99, 91, 255, 0.4);
      transition: filter 0.2s, transform 0.15s;
    }

    .demo-show-btn:hover {
      filter: brightness(1.12);
      transform: translateY(-2px);
    }

    .demo-show-btn svg {
      stroke: #fff;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .demo-section {
      max-width: 700px;
      margin: 0 auto;
      padding: 80px 24px;
      text-align: center;
    }

    .demo-section h2 {
      font-size: clamp(22px, 3vw, 36px);
      font-weight: 800;
      color: #1a1a2e;
      letter-spacing: -0.025em;
      margin-bottom: 14px;
      word-break: keep-all;
    }

    .demo-section p {
      font-size: 15px;
      color: #6b7280;
      line-height: 1.8;
    }


    /* ================================================================
       팝업 오버레이
       ================================================================ */
    .dibo-plan-overlay {
      position: fixed;
      inset: 0;
      z-index: 9000;
      background: rgba(10, 10, 30, 0.58);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;

      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .dibo-plan-overlay.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .dibo-plan-overlay.is-closing {
      opacity: 0 !important;
      pointer-events: none;
      transition: opacity 0.25s ease !important;
    }

    /* ================================================================
       팝업 모달
       ================================================================ */
    .dibo-plan-modal {
      position: relative;
      width: 100%;
      max-width: 880px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: #ffffff;
      border-radius: 24px;
      box-shadow:
        0 30px 90px rgba(10, 10, 30, 0.24),
        0 8px 24px rgba(10, 10, 30, 0.08);
      scrollbar-width: thin;
      scrollbar-color: rgba(99, 91, 255, 0.25) transparent;

      transform: scale(0.96);
      opacity: 0;
      transition:
        transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.4s ease-out;
    }

    .dibo-plan-overlay.is-visible .dibo-plan-modal {
      transform: scale(1);
      opacity: 1;
    }

    .dibo-plan-overlay.is-closing .dibo-plan-modal {
      transform: scale(0.95) !important;
      opacity: 0 !important;
      transition:
        transform 0.25s ease !important,
        opacity 0.25s ease !important;
    }

    .dibo-plan-modal::-webkit-scrollbar { width: 5px; }
    .dibo-plan-modal::-webkit-scrollbar-track { background: transparent; }
    .dibo-plan-modal::-webkit-scrollbar-thumb {
      background: rgba(99, 91, 255, 0.25);
      border-radius: 3px;
    }

    /* ---- 닫기 버튼 ---- */
    .plan-close-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 10;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1.5px solid #e8e8ef;
      background: #f9f9fb;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s, transform 0.22s;
    }

    .plan-close-btn:hover {
      background: #f0f0ff;
      border-color: #635BFF;
      transform: rotate(90deg);
    }

    .plan-close-btn svg {
      width: 14px;
      height: 14px;
      stroke: #9ca3af;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      transition: stroke 0.2s;
    }

    .plan-close-btn:hover svg { stroke: #635BFF; }

    /* ---- 모달 헤더 ---- */
    .plan-modal-header {
      padding: 38px 40px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .plan-modal-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #635BFF;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .plan-eyebrow-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #635BFF;
      animation: planPulse 2s ease-in-out infinite;
    }

    @keyframes planPulse {
      0%, 100% { opacity: 1;   transform: scale(1);    }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    .plan-modal-title {
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 800;
      color: #1a1a2e;
      letter-spacing: -0.03em;
      line-height: 1.25;
      word-break: keep-all;
      max-width: 540px;
    }

    .plan-modal-desc {
      font-size: 14px;
      color: #9ca3af;
      line-height: 1.7;
      max-width: 400px;
      word-break: keep-all;
    }

    /* ---- 월간 / 연간 토글 ---- */
    .plan-billing-toggle {
      display: inline-flex;
      align-items: center;
      background: #f3f4f6;
      border-radius: 99px;
      padding: 4px;
      gap: 2px;
      margin-top: 6px;
    }

    .plan-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 20px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #9ca3af;
      background: transparent;
      border: none;
      border-radius: 99px;
      cursor: pointer;
      transition: background 0.25s, color 0.25s, box-shadow 0.25s;
      white-space: nowrap;
    }

    .plan-toggle-btn.is-active {
      background: #ffffff;
      color: #1a1a2e;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .plan-toggle-save-badge {
      font-size: 10px;
      font-weight: 700;
      color: #16a34a;
      background: rgba(22, 163, 74, 0.1);
      padding: 2px 7px;
      border-radius: 99px;
      letter-spacing: 0.02em;
    }

    /* ================================================================
       플랜 카드 그리드
       ================================================================ */
    .plan-cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      padding: 28px 40px 40px;
    }

    /* ================================================================
       플랜 카드
       ================================================================ */
    .plan-card {
      position: relative;
      background: #ffffff;
      border: 1.5px solid #e8e8ef;
      border-radius: 18px;
      padding: 26px 22px 22px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition:
        border-color 0.22s,
        box-shadow 0.22s,
        transform 0.22s,
        opacity 0.22s,
        background 0.22s;
    }

    .plan-card:hover {
      transform: translateY(-4px);
      border-color: #635BFF;
      box-shadow: 0 8px 28px rgba(99, 91, 255, 0.15);
    }

    .plan-card.is-recommended {
      background: #fbfaff;
      border-color: rgba(99, 91, 255, 0.28);
    }

    .plan-card.is-selected {
      border: 2px solid #635BFF !important;
      box-shadow:
        0 0 0 4px rgba(99, 91, 255, 0.12),
        0 10px 32px rgba(99, 91, 255, 0.22) !important;
      transform: translateY(-4px);
    }

    .plan-card.is-deselected {
      opacity: 0.5;
      transform: translateY(0) !important;
    }

    /* 추천 배지 */
    .plan-recommend-badge {
      position: absolute;
      top: -13px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #7C6FFF 0%, #635BFF 100%);
      padding: 4px 14px;
      border-radius: 99px;
      letter-spacing: 0.04em;
      white-space: nowrap;
      box-shadow: 0 3px 12px rgba(99, 91, 255, 0.45);
    }

    /* 플랜 이름 */
    .plan-name {
      font-size: 12px;
      font-weight: 700;
      color: #635BFF;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .plan-tagline {
      font-size: 13px;
      color: #9ca3af;
      line-height: 1.5;
      margin-bottom: 18px;
      word-break: keep-all;
    }

    /* 가격 영역 */
    .plan-price-wrap {
      margin-bottom: 20px;
      transition: opacity 0.2s ease;
    }

    .plan-price {
      display: flex;
      align-items: baseline;
      gap: 3px;
      line-height: 1;
    }

    .plan-price-amount {
      font-size: 30px;
      font-weight: 800;
      color: #1a1a2e;
      letter-spacing: -0.04em;
    }

    .plan-price-free {
      font-size: 26px;
      font-weight: 800;
      color: #1a1a2e;
      letter-spacing: -0.03em;
    }

    .plan-price-unit {
      font-size: 13px;
      font-weight: 500;
      color: #9ca3af;
    }

    .plan-price-note {
      font-size: 11px;
      color: #16a34a;
      font-weight: 600;
      margin-top: 5px;
    }

    /* 구분선 */
    .plan-divider {
      height: 1px;
      background: #f0f0f4;
      margin-bottom: 16px;
    }

    /* 기능 목록 */
    .plan-features {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 20px;
      flex: 1;
    }

    .plan-feature-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      color: #374151;
      line-height: 1.45;
    }

    .plan-feature-item.is-unavailable {
      color: #d1d5db;
    }

    .plan-feature-icon {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      margin-top: 1px;
    }

    .plan-feature-icon svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    /* CTA 버튼 */
    .plan-cta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 13px 16px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: -0.01em;
      transition: filter 0.2s, transform 0.15s, box-shadow 0.2s, background 0.2s, border-color 0.2s;
    }

    .plan-cta-btn.is-primary {
      background: #635BFF;
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 16px rgba(99, 91, 255, 0.42);
    }

    .plan-cta-btn.is-primary:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(99, 91, 255, 0.55);
    }

    .plan-cta-btn.is-secondary {
      background: transparent;
      color: #635BFF;
      border: 1.5px solid rgba(99, 91, 255, 0.28);
    }

    .plan-cta-btn.is-secondary:hover {
      background: rgba(99, 91, 255, 0.06);
      border-color: #635BFF;
      transform: translateY(-1px);
    }

    .plan-cta-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
      transition: transform 0.2s;
    }

    .plan-cta-btn:hover svg { transform: translateX(2px); }

    /* 선택 인디케이터 */
    .plan-selected-indicator {
      display: none;
      position: absolute;
      top: 14px;
      right: 14px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #635BFF;
      align-items: center;
      justify-content: center;
    }

    .plan-card.is-selected .plan-selected-indicator {
      display: flex;
    }

    .plan-selected-indicator svg {
      width: 11px;
      height: 11px;
      stroke: #fff;
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ================================================================
       반응형
       ================================================================ */
    @media (max-width: 760px) {
      .plan-cards-grid {
        grid-template-columns: 1fr;
        padding: 24px 20px 32px;
        gap: 24px;
      }

      .plan-modal-header { padding: 30px 20px 0; }

      .plan-card { padding: 24px 20px 20px; }

      .dibo-plan-modal { border-radius: 20px; }
    }

    @media (max-width: 480px) {
      .plan-modal-title { font-size: 20px; }
      .plan-toggle-btn { padding: 8px 14px; font-size: 12px; }
    }
  </style>
</head>
<body>

<!-- ================================================================
     데모 배경 콘텐츠 (팝업과 무관)
     ================================================================ -->
<div class="demo-page">

  <div class="demo-hero">
    <div class="demo-badge">DIBO Popup Series #02</div>
    <h1>인터랙티브 플랜 비교 팝업<br>Interactive</h1>
    <p>Stripe에서 영감받은 플랜 비교 UI.<br>
    페이지 로드 1.2초 후 중앙 모달로 자동 등장합니다.</p>
    <button class="demo-show-btn" onclick="showPopupDirect()" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      팝업 다시 보기
    </button>
  </div>

  <div class="demo-section">
    <h2>직관적인 플랜 비교 UX</h2>
    <p>카드를 클릭해 플랜을 선택하고, 토글로 월간/연간 요금을 전환하세요.<br>
    SaaS·구독 서비스의 전환율을 높이는 인터랙티브 팝업입니다.</p>
  </div>

</div><!-- /.demo-page -->


<!-- ================================================================
     인터랙티브 플랜 비교 팝업 마크업
     ================================================================ -->
<div class="dibo-plan-overlay" id="jsPlanOverlay" role="dialog" aria-modal="true" aria-label="플랜 비교">
  <div class="dibo-plan-modal" id="jsPlanModal">

    <!-- 닫기 버튼 -->
    <button class="plan-close-btn" id="jsCloseBtn" aria-label="팝업 닫기" type="button">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>

    <!-- 헤더 -->
    <div class="plan-modal-header">
      <div class="plan-modal-eyebrow">
        <span class="plan-eyebrow-dot"></span>
        <span>플랜 비교</span>
      </div>
      <h2 class="plan-modal-title" id="jsPlanTitle"></h2>
      <p class="plan-modal-desc" id="jsPlanDesc"></p>

      <!-- 월간 / 연간 토글 -->
      <div class="plan-billing-toggle">
        <button class="plan-toggle-btn is-active" id="jsMonthlyBtn" type="button">월간</button>
        <button class="plan-toggle-btn" id="jsAnnualBtn" type="button">
          연간
          <span class="plan-toggle-save-badge">20% 절약</span>
        </button>
      </div>
    </div>

    <!-- 플랜 카드 그리드 (JS로 렌더링) -->
    <div class="plan-cards-grid" id="jsPlanCards"></div>

  </div>
</div>

<script>
/* ================================================================
   샘플 데이터 — API 호출 실패 시 폴백
   ================================================================ */
var SAMPLE_POPUP = [
  {
    id: 'sample-plan-popup-1',
    status: 'active',
    schedule: { type: 'always', startAt: null, endAt: null },
    title: '지금 시작하고 더 많은 기능을 누리세요',
    description: '합리적인 요금으로 비즈니스를 성장시키세요.\n언제든지 플랜을 변경할 수 있습니다.',
    imageUrl: null,
    linkUrl: '#',
    linkTarget: '_blank',
    showPages: []
  }
];

var SAMPLE_PLANS = [
  {
    id: 'plan-starter',
    name: '스타터',
    tagline: '처음 시작하는 소규모 팀을 위해',
    monthlyPrice: 0,
    annualPrice: 0,
    recommended: false,
    features: [
      { text: '페이지 3개',       available: true  },
      { text: '팝업 1개',         available: true  },

      { text: '이메일 지원',      available: true  },
      { text: '커스텀 도메인',    available: false },
      { text: 'API 연동',         available: false }
    ],
    ctaText: '무료로 시작',
    ctaLink: '#',
    ctaStyle: 'secondary'
  },
  {
    id: 'plan-pro',
    name: '프로',
    tagline: '성장하는 비즈니스를 위한 풀 패키지',
    monthlyPrice: 39000,
    annualPrice: 31200,
    recommended: true,
    features: [
      { text: '무제한 페이지',        available: true  },
      { text: '팝업 10개',            available: true  },
      { text: '월 50,000 방문자',     available: true  },
      { text: '고급 분석 대시보드',   available: true  },
      { text: '우선 이메일 지원',     available: true  },
      { text: '커스텀 도메인',        available: true  },
      { text: 'API 연동',             available: false }
    ],
    ctaText: '14일 무료체험',
    ctaLink: '#',
    ctaStyle: 'primary'
  },
  {
    id: 'plan-biz',
    name: '비즈니스',
    tagline: '대규모 운영을 위한 맞춤 솔루션',
    monthlyPrice: 99000,
    annualPrice: 79200,
    recommended: false,
    features: [
      { text: '무제한 페이지',        available: true },
      { text: '무제한 팝업',          available: true },
      { text: '무제한 방문자',        available: true },
      { text: '고급 분석 대시보드',   available: true },
      { text: '전담 지원',            available: true },
      { text: '커스텀 도메인',        available: true },
      { text: 'API 연동',             available: true }
    ],
    ctaText: '상담 신청',
    ctaLink: '#',
    ctaStyle: 'secondary'
  }
];

/* ================================================================
   상태 변수
   ================================================================ */
var currentBilling = 'monthly';
var selectedPlanId = null;
var currentStorageKey = null;

/* ================================================================
   Popup API 호출
   ================================================================ */
async function fetchData() {
  var instData = SAMPLE_POPUP;

  try {
    var res = await axios.get('https://api.di-bo.me/popup?config_id=copy_config_id', {
      headers: { 'access-token': diboToken }
    });
    if (res.data && res.data.length) instData = res.data;
  } catch (e) {
    console.error('Popup API 호출 실패, 샘플 데이터로 렌더링:', e);
  }

  initPopup(instData[0]);
}

/* ================================================================
   팝업 초기화
   ================================================================ */
function initPopup(popup) {
  if (!popup) return;

  var storageKey = 'popup_hidden_' + popup.id;
  if (sessionStorage.getItem(storageKey)) return;

  if (popup.showPages && popup.showPages.length) {
    var path = location.pathname;
    var visible = popup.showPages.some(function (p) { return path.includes(p); });
    if (!visible) return;
  }

  currentStorageKey = storageKey;
  renderModal(popup);
  bindEvents();
  setTimeout(showPopup, 1200);
}

/* ================================================================
   모달 렌더링
   ================================================================ */
function renderModal(popup) {
  document.getElementById('jsPlanTitle').textContent = popup.title || '';
  document.getElementById('jsPlanDesc').innerHTML = (popup.description || '').replace(/\n/g, '<br>');
  renderPlans();
}

/* ================================================================
   플랜 카드 렌더링
   ================================================================ */
function renderPlans() {
  var grid = document.getElementById('jsPlanCards');
  grid.innerHTML = '';
  SAMPLE_PLANS.forEach(function (plan) {
    grid.appendChild(createPlanCard(plan));
  });
}

function createPlanCard(plan) {
  var isSelected   = selectedPlanId === plan.id;
  var isDeselected = selectedPlanId !== null && !isSelected;
  var price = currentBilling === 'annual' ? plan.annualPrice : plan.monthlyPrice;
  var priceFormatted = price === 0 ? null : price.toLocaleString('ko-KR');

  var card = document.createElement('div');
  card.className = 'plan-card'
    + (plan.recommended ? ' is-recommended' : '')
    + (isSelected   ? ' is-selected'   : '')
    + (isDeselected ? ' is-deselected' : '');
  card.setAttribute('data-plan-id', plan.id);
  card.setAttribute('role', 'button');
  card.setAttribute('tabindex', '0');
  card.setAttribute('aria-pressed', isSelected ? 'true' : 'false');

  /* 추천 배지 */
  var badgeHTML = plan.recommended
    ? '<div class="plan-recommend-badge">추천</div>'
    : '';

  /* 선택 인디케이터 */
  var indicatorHTML = '<div class="plan-selected-indicator">'
    + '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
    + '</div>';

  /* 가격 */
  var priceInner = price === 0
    ? '<div class="plan-price"><span class="plan-price-free">무료</span></div>'
    : '<div class="plan-price">'
      + '<span class="plan-price-amount">' + priceFormatted + '</span>'
      + '<span class="plan-price-unit">원/월</span>'
      + '</div>';
  var priceNote = (currentBilling === 'annual' && plan.annualPrice > 0)
    ? '<p class="plan-price-note">연간 결제 시 20% 할인</p>'
    : '';

  /* 기능 목록 */
  var featuresHTML = plan.features.map(function (f) {
    if (f.available) {
      return '<li class="plan-feature-item">'
        + '<span class="plan-feature-icon">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="#635BFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
        + '</span><span>' + f.text + '</span></li>';
    } else {
      return '<li class="plan-feature-item is-unavailable">'
        + '<span class="plan-feature-icon">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
        + '</span><span>' + f.text + '</span></li>';
    }
  }).join('');

  card.innerHTML = badgeHTML
    + indicatorHTML
    + '<div class="plan-name">' + plan.name + '</div>'
    + '<div class="plan-tagline">' + plan.tagline + '</div>'
    + '<div class="plan-price-wrap">' + priceInner + priceNote + '</div>'
    + '<div class="plan-divider"></div>'
    + '<ul class="plan-features">' + featuresHTML + '</ul>'
    + '<a class="plan-cta-btn is-' + plan.ctaStyle + '" href="' + plan.ctaLink + '" target="_blank" rel="noopener noreferrer">'
    + plan.ctaText
    + '<svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>'
    + '</a>';

  card.addEventListener('click', function (e) {
    if (e.target.closest('.plan-cta-btn')) return;
    selectPlan(plan.id);
  });

  card.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && !e.target.closest('.plan-cta-btn')) {
      e.preventDefault();
      selectPlan(plan.id);
    }
  });

  return card;
}

/* ================================================================
   토글: 월간 ↔ 연간
   ================================================================ */
function toggleBilling(type) {
  if (currentBilling === type) return;
  currentBilling = type;

  document.getElementById('jsMonthlyBtn').classList.toggle('is-active', type === 'monthly');
  document.getElementById('jsAnnualBtn').classList.toggle('is-active', type === 'annual');

  /* 가격 영역만 페이드 전환 */
  var priceWraps = document.querySelectorAll('.plan-price-wrap');
  priceWraps.forEach(function (el) {
    el.style.transition = 'opacity 0.18s';
    el.style.opacity = '0';
  });

  setTimeout(function () {
    SAMPLE_PLANS.forEach(function (plan) {
      var card = document.querySelector('[data-plan-id="' + plan.id + '"]');
      if (!card) return;
      var priceWrap = card.querySelector('.plan-price-wrap');
      var price = type === 'annual' ? plan.annualPrice : plan.monthlyPrice;
      var priceFormatted = price === 0 ? null : price.toLocaleString('ko-KR');
      var priceInner = price === 0
        ? '<div class="plan-price"><span class="plan-price-free">무료</span></div>'
        : '<div class="plan-price">'
          + '<span class="plan-price-amount">' + priceFormatted + '</span>'
          + '<span class="plan-price-unit">원/월</span>'
          + '</div>';
      var priceNote = (type === 'annual' && plan.annualPrice > 0)
        ? '<p class="plan-price-note">연간 결제 시 20% 할인</p>'
        : '';
      priceWrap.innerHTML = priceInner + priceNote;
      priceWrap.style.opacity = '0';
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          priceWrap.style.transition = 'opacity 0.22s';
          priceWrap.style.opacity = '1';
        });
      });
    });
  }, 190);
}

/* ================================================================
   카드 선택 (토글 방식)
   ================================================================ */
function selectPlan(planId) {
  selectedPlanId = selectedPlanId === planId ? null : planId;

  document.querySelectorAll('.plan-card').forEach(function (card) {
    var id = card.getAttribute('data-plan-id');
    card.classList.remove('is-selected', 'is-deselected');
    card.setAttribute('aria-pressed', 'false');
    if (selectedPlanId !== null) {
      if (id === selectedPlanId) {
        card.classList.add('is-selected');
        card.setAttribute('aria-pressed', 'true');
      } else {
        card.classList.add('is-deselected');
      }
    }
  });
}

/* ================================================================
   이벤트 바인딩
   ================================================================ */
function bindEvents() {
  document.getElementById('jsCloseBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    closePopup();
  });

  document.getElementById('jsPlanOverlay').addEventListener('click', function (e) {
    if (e.target === this) closePopup();
  });

  document.getElementById('jsMonthlyBtn').addEventListener('click', function () {
    toggleBilling('monthly');
  });

  document.getElementById('jsAnnualBtn').addEventListener('click', function () {
    toggleBilling('annual');
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closePopup();
  });
}

/* ================================================================
   표시 / 숨김
   ================================================================ */
function showPopup() {
  document.getElementById('jsPlanOverlay').classList.add('is-visible');
}

function showPopupDirect() {
  var overlay = document.getElementById('jsPlanOverlay');
  overlay.classList.remove('is-closing');
  overlay.classList.add('is-visible');
}

function closePopup() {
  var overlay = document.getElementById('jsPlanOverlay');
  if (!overlay.classList.contains('is-visible')) return;
  overlay.classList.add('is-closing');
  setTimeout(function () {
    overlay.classList.remove('is-visible', 'is-closing');
    if (currentStorageKey) sessionStorage.setItem(currentStorageKey, '1');
  }, 280);
}

fetchData();
</script>
