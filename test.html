<script>
    /**
     * 입력폼 API 연동 가이드
     * 
     * 본 API는 입력폼 데이터의 생성(Create), 조회(Read)을 지원합니다.
     * 사용 시 필수 파라미터는 `config_id`와 `입력폼_아이디`이며, 두 값의 의미는 아래와 같습니다.
     * 
     * - config_id: 각 코드 복사 시 자동으로 발급되는 고유 설정값으로, 별도의 입력은 필요하지 않습니다.
     * - 입력폼_아이디(data_id): API 호출을 통해 조회되는 각 입력폼의 고유 식별자입니다.
     * 
     * 주요 연동 프로세스는 다음과 같습니다.
     * 
     * 1. 입력폼 목록 조회(fetchIdData)
     *    - 여러 입력폼이 존재할 수 있으므로, 사용자가 원하는 특정 입력폼을 선택하기 위해 `data_id`를 조회합니다.
     * 
     * 2. 입력폼 데이터 조회(fetchListData)
     *    - 특정 입력폼(`입력폼_아이디`)에 저장된 모든 Row 데이터를 조회합니다.
     *    - 데이터는 JSON 포맷으로 반환되며, 후속 UI/UX 구현에 활용할 수 있습니다.
     * 
     * 3. 입력폼 데이터 생성(postEditData)
     *    - 최대 10개의 컬럼(column_01 ~ column_10)을 통해 데이터를 신규 생성할 수 있습니다.
     *    - 입력폼의 사전 정의된 타입(텍스트, 숫자, 이메일 등)에 따라 유효성 검증이 적용되므로, 데이터는 해당 규격을 준수해야 합니다.
     * 
     * 모든 API 요청은 `access-token` 헤더를 통해 인증되며, 코드 상세 페이지에서 토큰 사용법을 확인해주세요
     */
     
	let form_id = null;
    const fetchIdData = async () => {
        try {
            const res = await axios.get(`https://api.di-bo.me/edit-set?config_id=C286ZKEL6YEH`,{
                headers: { 'access-token': diboToken, 'member-token': localStorage.getItem('dibo_member_token') || '' }
            })
            const instData = res.data;
            form_id = instData[0]?.id // 입력폼의 id를 가져옵니다.
        } catch (error) {
            console.error("입력폼 목록 조회 실패:", error);
        }
    }

    // fetchIdData JSON 응답값 예시
    // [
    //     {
    //         "id": "string",
    //         "client_id": "string",
    //         "config_id": "string",
    //         "column_set": [
    //         {
    //             "column": "column_1",
    //             "column_name": "string",
    //             "column_type": "single_line",
    //             "column_data": [
    //             "string"
    //             ]
    //         }
    //         ],
    //         "created_at": "2025-08-26T06:23:25.454Z",
    //         "updated_at": "2025-08-26T06:23:25.454Z"
    //     }
    // ]

    const fetchListData = async () => {
        try {
            const res = await axios.get(`https://api.di-bo.me/edit-set/${form_id}/rows?config_id=C286ZKEL6YEH`, {
                headers: { 'access-token': diboToken, 'member-token': localStorage.getItem('dibo_member_token') || '' }
            })
            const instData = res.data;
            
        } catch (error) {
            console.error("입력폼 데이터 조회 실패:", error);
        }
    }
    
    const postEditData = async () => {
        const formData = new FormData();
        formData.append('req_body', JSON.stringify({ config_id: 'C286ZKEL6YEH' }));
        formData.append('column_01', '');
        formData.append('column_02', '');
        formData.append('column_03', '');
        formData.append('column_04', '');
        formData.append('column_05', '');
        formData.append('column_06', '');
        formData.append('column_07', '');
        formData.append('column_08', '');
        formData.append('column_09', '');
        formData.append('column_10', '');
        try {
            const res = await axios.post(`https://api.di-bo.me/edit-set/${form_id}/rows`,formData,{
                headers: { 'access-token': diboToken, 'member-token': localStorage.getItem('dibo_member_token') || '' }
            });
        } catch (error) {
            console.error("입력폼 데이터 생성 실패:", error);
        }
    }
</script>
