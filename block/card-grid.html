<!--
=======================================================
  카드 그리드 (Card Grid) — DIBO Block Extension
=======================================================

【제목 (Title)】
  반응형 카드 그리드, 상품 목록·포트폴리오 이미지 카드

【설명 (Description)】
  3열 반응형 그리드에 이미지·제목·설명·링크를 카드 형태로 표시합니다.
  마우스를 올리면 메인 이미지가 서브 이미지로 부드럽게 전환됩니다.
  상품 목록, 포트폴리오, 콘텐츠 피드 등 다양한 용도로 활용 가능합니다.

【키워드 (Keywords)】
  카드 그리드, 반응형 카드, 이미지 전환, 포트폴리오 그리드, 상품 목록

【사용 방법】
  1. 이 파일을 디보 익스텐션 에디터에 붙여넣기 하세요.
  2. 디보 백오피스 '코드 복사' 시 copy_config_id가 실제 ID로 자동 교체됩니다.
  3. 로컬 테스트: 브라우저에서 직접 열면 LOCAL_DATA가 표시됩니다.

【LOCAL_DATA 수정 방법】
  아래 JS의 LOCAL_DATA 배열에서 각 카드 항목을 수정하세요.
  ─ main_img_url : 기본 이미지 URL (hover 전)      ← [수정 가능]
  ─ sub_img_url  : hover 시 전환될 이미지 URL       ← [수정 가능]
  ─ title        : 카드 제목                         ← [수정 가능]
  ─ content      : 카드 설명 (2줄 truncate 적용)     ← [수정 가능]
  ─ link         : 카드 클릭 시 이동할 URL           ← [수정 가능]
  ─ display_order: 표시 순서 (숫자가 작을수록 먼저)  ← [수정 가능]

=======================================================
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- [수정 가능] 브라우저 탭 제목 -->
  <title>카드 그리드 — DIBO Block</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --apple-dark:  #1d1d1f;
      --apple-mid:   #6e6e73;
      --apple-light: #f5f5f7;
      --apple-white: #ffffff;
      --apple-blue:  #0071e3;
      --border:      #d2d2d7;
      --ease:        cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Noto Sans KR', 'Poppins', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--apple-light);
      min-height: 100vh;
      padding: 72px 24px;
    }

    #dibo-block { max-width: 1080px; margin: 0 auto; }

    /* ── 섹션 헤더 ── */
    .section-header {
      margin-bottom: 56px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .section-header-left {}
    .section-eyebrow {
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--apple-blue);
      margin-bottom: 10px;
    }
    .section-title {
      font-family: 'Poppins', 'Noto Sans KR', sans-serif;
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 800;
      color: var(--apple-dark);
      letter-spacing: -.04em;
      line-height: 1.12;
    }
    .section-count {
      font-size: 13px;
      color: var(--apple-mid);
      font-weight: 500;
      align-self: center;
      white-space: nowrap;
    }

    /* ── 그리드 ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    @media (max-width: 860px) { .card-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 520px) { .card-grid { grid-template-columns: 1fr; } }

    /* ── 카드 ── */
    .card {
      background: var(--apple-white);
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      /* Apple-style card shadow */
      box-shadow:
        0 1px 2px rgba(0,0,0,.04),
        0 4px 8px rgba(0,0,0,.06);
      transition: transform .32s var(--ease), box-shadow .32s var(--ease);
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow:
        0 2px 4px rgba(0,0,0,.04),
        0 12px 28px rgba(0,0,0,.12);
    }

    /* ── 이미지 영역 ── */
    .card-img-wrap {
      position: relative;
      aspect-ratio: 4/3;
      overflow: hidden;
      background: var(--apple-light);
    }
    .card-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transition: opacity .4s var(--ease), transform .5s var(--ease);
    }
    .card-img.main { opacity: 1; }
    .card-img.sub  { opacity: 0; }
    .card:hover .card-img.main { opacity: 0; transform: scale(1.03); }
    .card:hover .card-img.sub  { opacity: 1; }

    /* ── 번호 배지 ── */
    .card-num {
      position: absolute;
      top: 12px; left: 12px;
      font-family: 'Poppins', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--apple-dark);
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 100px;
      padding: 4px 10px;
      z-index: 2;
    }

    /* ── 화살표 ── */
    .card-arrow {
      position: absolute;
      bottom: 12px; right: 12px;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--apple-dark);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      z-index: 2;
      opacity: 0;
      transform: scale(.6) rotate(-45deg);
      transition: opacity .28s var(--ease), transform .28s var(--ease);
    }
    .card:hover .card-arrow { opacity: 1; transform: scale(1) rotate(0); }

    /* ── 카드 본문 ── */
    .card-body {
      padding: 20px 22px 22px;
      border-top: 1px solid var(--apple-light);
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--apple-dark);
      letter-spacing: -.02em;
      line-height: 1.4;
      margin-bottom: 6px;
      word-break: keep-all;
    }
    .card-content {
      font-size: 13px;
      color: var(--apple-mid);
      line-height: 1.65;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: keep-all;
    }

    /* ── 카드 푸터 ── */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px 18px;
      margin-top: -2px;
    }
    .card-link-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--apple-blue);
    }
    .card-link-arrow {
      color: var(--apple-blue);
      display: flex;
    }

    /* ── 상태 메시지 ── */
    .state-msg {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; height: 320px;
      color: var(--apple-mid); font-size: 14px;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid rgba(0,0,0,.08);
      border-top-color: var(--apple-blue);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="dibo-block"></div>

  <script>
    /* ★ [수정 가능] 로컬 기본 데이터 — API 연동 전 표시되는 샘플 데이터입니다. */
    const LOCAL_DATA = [
      {
        main_img_url: 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=800&q=80',
        sub_img_url:  'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=800&q=80&grayscale',
        title: '리빙 컬렉션',                                /* ← [수정 가능] */
        content: '공간을 완성하는 감각적인 리빙 아이템 모음.', /* ← [수정 가능] */
        link: '#', display_order: 0
      },
      {
        main_img_url: 'https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?w=800&q=80',
        sub_img_url:  'https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?w=800&q=80&grayscale',
        title: '게이밍 셋업', content: '몰입감을 극대화하는 프리미엄 게이밍 환경.',
        link: '#', display_order: 1
      },
      {
        main_img_url: 'https://images.unsplash.com/photo-1524758631624-e2822e304c36?w=800&q=80',
        sub_img_url:  'https://images.unsplash.com/photo-1524758631624-e2822e304c36?w=800&q=80&grayscale',
        title: '미니멀 워크스페이스', content: '집중력을 높이는 깔끔한 업무 공간 구성.',
        link: '#', display_order: 2
      },
      {
        main_img_url: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800&q=80',
        sub_img_url:  'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800&q=80&grayscale',
        title: '포트레이트 시리즈', content: '개성 있는 라이프스타일을 담은 인물 사진.',
        link: '#', display_order: 3
      },
      {
        main_img_url: 'https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=800&q=80',
        sub_img_url:  'https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=800&q=80&grayscale',
        title: '자연과 여행', content: '자연이 빚어낸 색감과 질감에서 찾은 영감.',
        link: '#', display_order: 4
      },
      {
        main_img_url: 'https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800&q=80',
        sub_img_url:  'https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800&q=80&grayscale',
        title: '디지털 크리에이티브', content: '창의적인 디지털 작업 환경의 모든 것.',
        link: '#', display_order: 5
      },
    ];

    let data = LOCAL_DATA;

    async function fetchData() {
      try {
        const res = await axios.get(
          'https://api.di-bo.me/block?config_id=copy_config_id',
          { headers: { 'access-token': diboToken } }
        );
        if (res.data?.length) data = res.data;
      } catch (e) {}
      data.sort((a, b) => a.display_order - b.display_order);
      render();
    }

    function render() {
      const el = document.getElementById('dibo-block');
      if (!data.length) {
        el.innerHTML = `<div class="state-msg">표시할 데이터가 없습니다.</div>`;
        return;
      }

      const cards = data.map((item, i) => {
        const main = item.main_img_url || 'https://via.placeholder.com/800x600';
        const sub  = item.sub_img_url  || main;
        const hasLink = !!item.link;
        return `
          <div class="card${hasLink ? '' : ' no-link'}" onclick="${hasLink ? `window.open('${item.link}','_blank')` : ''}">
            <div class="card-img-wrap">
              <img class="card-img main" src="${main}" alt="${item.title || ''}" loading="lazy" />
              <img class="card-img sub"  src="${sub}"  alt="${item.title || ''}" loading="lazy" />
              <div class="card-num">${String(i + 1).padStart(2, '0')}</div>
              ${hasLink ? `<div class="card-arrow">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
              </div>` : ''}
            </div>
            <div class="card-body">
              <div class="card-title">${item.title || ''}</div>
              <div class="card-content">${item.content || ''}</div>
            </div>
            ${hasLink ? `<div class="card-footer">
              <span class="card-link-text">자세히 보기</span>
              <span class="card-link-arrow">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
              </span>
            </div>` : ''}
          </div>`;
      }).join('');

      el.innerHTML = `
        <div class="section-header">
          <div class="section-header-left">
            <div class="section-eyebrow">Collection</div>
            <h2 class="section-title">큐레이션<br>컬렉션</h2>
          </div>
          <span class="section-count">${data.length}개 아이템</span>
        </div>
        <div class="card-grid">${cards}</div>`;
    }

    document.getElementById('dibo-block').innerHTML =
      `<div class="state-msg"><div class="spinner"></div>불러오는 중...</div>`;

    if (typeof axios !== 'undefined') {
      fetchData();
    } else {
      data.sort((a, b) => a.display_order - b.display_order);
      render();
    }
  </script>
</body>
</html>
