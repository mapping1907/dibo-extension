<!--
=======================================================
  플로팅 카드 (Floating Card) — DIBO Block Extension
=======================================================

【제목 (Title)】
  스크롤 애니메이션 카드 피드, 부드러운 등장 효과 레이아웃

【설명 (Description)】
  스크롤을 내리면 카드가 아래에서 부드럽게 등장하는 피드형 레이아웃입니다.
  홀수·짝수 카드의 이미지·텍스트 위치가 교번하여 리듬감을 줍니다.
  브랜드 스토리, 서비스 소개, 제품 설명 피드에 적합합니다.

【키워드 (Keywords)】
  스크롤 애니메이션, 피드 레이아웃, 등장 효과, 브랜드 스토리, 인터랙티브 피드

【사용 방법】
  1. 이 파일을 디보 익스텐션 에디터에 붙여넣기 하세요.
  2. 디보 백오피스 '코드 복사' 시 copy_config_id가 실제 ID로 자동 교체됩니다.
  3. 로컬 테스트: 브라우저에서 직접 열면 LOCAL_DATA가 표시됩니다.
  4. 스크롤 애니메이션은 IntersectionObserver로 동작합니다. (구형 브라우저 미지원 시 정상 표시)

【LOCAL_DATA 수정 방법】
  아래 JS의 LOCAL_DATA 배열에서 각 피드 항목을 수정하세요.
  ─ main_img_url : 카드 이미지 URL                   ← [수정 가능]
  ─ title        : 카드 제목                          ← [수정 가능]
  ─ content      : 카드 본문 설명                     ← [수정 가능]
  ─ link         : '더 읽기' 버튼 URL                 ← [수정 가능]
  ─ display_order: 표시 순서 (숫자가 작을수록 먼저)    ← [수정 가능]

=======================================================
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- [수정 가능] 브라우저 탭 제목 -->
  <title>플로팅 카드 — DIBO Block</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #f5f5f7;
      --white:  #ffffff;
      --dark:   #1d1d1f;
      --mid:    #6e6e73;
      --border: #d2d2d7;
      --blue:   #0071e3;
      --ease:   cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Noto Sans KR', 'Poppins', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      min-height: 100vh;
      padding: 80px 24px;
      overflow-x: hidden;
    }

    #dibo-block { max-width: 960px; margin: 0 auto; }

    /* ── 헤더 ── */
    .float-header {
      text-align: center;
      margin-bottom: 88px;
    }
    .float-eyebrow {
      font-family: 'Poppins', sans-serif;
      font-size: 11px; font-weight: 600;
      letter-spacing: .2em; text-transform: uppercase;
      color: var(--blue); margin-bottom: 14px;
      display: block;
    }
    .float-title {
      font-family: 'Poppins', 'Noto Sans KR', sans-serif;
      font-size: clamp(32px, 5vw, 58px);
      font-weight: 900; color: var(--dark);
      letter-spacing: -.05em; line-height: 1.08;
    }
    /* 밑줄 강조 */
    .float-title-mark {
      position: relative; display: inline-block;
    }
    .float-title-mark::after {
      content: '';
      position: absolute;
      bottom: 3px; left: 0; right: 0;
      height: 5px;
      background: rgba(0,113,227,.2);
      border-radius: 4px;
    }

    /* ── 피드 ── */
    .float-feed { display: flex; flex-direction: column; gap: 28px; }

    /* ── 카드 ── */
    .float-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-radius: 22px;
      overflow: hidden;
      background: var(--white);
      box-shadow: 0 2px 4px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.06);
      cursor: pointer;
      /* 스크롤 등장 시작 상태 */
      opacity: 0;
      transform: translateY(44px);
      transition:
        opacity .68s var(--ease),
        transform .68s var(--ease),
        box-shadow .32s var(--ease);
    }
    .float-card.visible { opacity: 1; transform: translateY(0); }
    .float-card:hover {
      box-shadow: 0 4px 8px rgba(0,0,0,.06), 0 16px 48px rgba(0,0,0,.11);
    }

    /* 짝수 카드: 이미지·텍스트 위치 교번 */
    .float-card:nth-child(even) { direction: rtl; }
    .float-card:nth-child(even) > * { direction: ltr; }

    @media (max-width: 600px) {
      .float-card, .float-card:nth-child(even) { grid-template-columns: 1fr; direction: ltr; }
      .float-card:nth-child(even) > * { direction: ltr; }
    }

    /* ── 이미지 하프 ── */
    .float-card-img-wrap {
      position: relative; overflow: hidden;
    }
    .float-card-img {
      width: 100%; height: 100%; min-height: 260px;
      object-fit: cover; display: block;
      transition: transform .56s var(--ease);
    }
    .float-card:hover .float-card-img { transform: scale(1.04); }

    /* 컬러 틴트 */
    .float-card-tint {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(0,113,227,.12) 0%, transparent 70%);
      opacity: 0; transition: opacity .36s var(--ease);
    }
    .float-card:hover .float-card-tint { opacity: 1; }

    /* 번호 배지 */
    .float-card-num {
      position: absolute; top: 16px; left: 16px;
      font-family: 'Poppins', sans-serif;
      font-size: 11px; font-weight: 800;
      color: var(--dark);
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius: 100px; padding: 4px 11px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    /* ── 텍스트 하프 ── */
    .float-card-body {
      padding: 48px 52px;
      display: flex; flex-direction: column; justify-content: center;
    }
    @media (max-width: 600px) { .float-card-body { padding: 28px 28px; } }

    .float-card-tag {
      display: inline-block;
      padding: 4px 12px; border-radius: 100px;
      background: rgba(0,113,227,.08); color: var(--blue);
      font-size: 11px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      margin-bottom: 16px; width: fit-content;
    }

    .float-card-title {
      font-family: 'Poppins', 'Noto Sans KR', sans-serif;
      font-size: clamp(18px, 2.4vw, 26px);
      font-weight: 800; color: var(--dark);
      letter-spacing: -.03em; line-height: 1.25;
      margin-bottom: 12px; word-break: keep-all;
    }

    .float-card-content {
      font-size: 14px; color: var(--mid);
      line-height: 1.78; margin-bottom: 28px;
      word-break: keep-all;
    }

    /* 밑줄 애니메이션 CTA */
    .float-card-cta {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: 13px; font-weight: 700; color: var(--dark);
      text-decoration: none; border: none; background: none;
      cursor: pointer; padding: 0; width: fit-content;
      transition: color .2s, gap .22s var(--ease);
    }
    .float-card-cta:hover { color: var(--blue); gap: 14px; }
    .float-card-cta-line {
      display: block; width: 24px; height: 2px;
      background: currentColor; border-radius: 2px;
      transition: width .22s var(--ease);
    }
    .float-card-cta:hover .float-card-cta-line { width: 32px; }

    /* ── 상태 메시지 ── */
    .state-msg {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; height: 320px;
      color: var(--mid); font-size: 14px;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid rgba(0,0,0,.08);
      border-top-color: var(--blue);
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="dibo-block"></div>

  <script>
    /* ★ [수정 가능] 로컬 기본 데이터 — API 연동 전 표시되는 샘플 데이터입니다. */
    const LOCAL_DATA = [
      {
        main_img_url: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80',
        title: '하늘과 돌이 만나는 곳',                                                                    /* ← [수정 가능] */
        content: '구름 위에 솟은 봉우리와 새벽빛이 만드는 고요한 순간. 자연의 장엄함이 말문을 막습니다.',  /* ← [수정 가능] */
        link: '#', display_order: 0
      },
      {
        main_img_url: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&q=80',
        title: '빛이 내리쬐는 숲속',
        content: '나뭇잎 사이로 쏟아지는 금빛 햇살. 자연이 연출하는 최고의 빛의 쇼를 담았습니다.',
        link: '#', display_order: 1
      },
      {
        main_img_url: 'https://images.unsplash.com/photo-1524758631624-e2822e304c36?w=800&q=80',
        title: '생각이 머무는 공간',
        content: '따뜻한 빛이 내리쬐는 미니멀 인테리어. 비움의 미학을 통해 완성된 삶의 질감입니다.',
        link: '#', display_order: 2
      },
      {
        main_img_url: 'https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=800&q=80',
        title: '봄이 터뜨린 색채',
        content: '들판을 가득 채운 야생화의 폭발적인 향연. 짧지만 강렬한 봄의 절정을 포착했습니다.',
        link: '#', display_order: 3
      },
    ];

    /* ★ [수정 가능] 카드 태그 레이블 — 항목 순서에 맞게 변경하세요 */
    const TAGS = ['자연', '숲', '인테리어', '봄'];

    let data = LOCAL_DATA;

    async function fetchData() {
      try {
        const res = await axios.get(
          'https://api.di-bo.me/block?config_id=copy_config_id',
          { headers: { 'access-token': diboToken } }
        );
        if (res.data?.length) data = res.data;
      } catch (e) {}
      data.sort((a, b) => a.display_order - b.display_order);
      render();
    }

    function render() {
      const el = document.getElementById('dibo-block');
      if (!data.length) {
        el.innerHTML = `<div class="state-msg">표시할 데이터가 없습니다.</div>`;
        return;
      }

      const cards = data.map((item, i) => {
        const img = item.main_img_url || 'https://via.placeholder.com/600x400';
        const tag = TAGS[i] || `No.${i + 1}`;
        return `
          <div class="float-card" data-index="${i}">
            <div class="float-card-img-wrap">
              <img class="float-card-img" src="${img}" alt="${item.title || ''}" loading="lazy" />
              <div class="float-card-tint"></div>
              <div class="float-card-num">${String(i + 1).padStart(2, '0')}</div>
            </div>
            <div class="float-card-body">
              <span class="float-card-tag">${tag}</span>
              <h3 class="float-card-title">${item.title || ''}</h3>
              <p class="float-card-content">${item.content || ''}</p>
              ${item.link ? `<a class="float-card-cta" href="${item.link}" target="_blank">
                더 읽기
              </a>` : ''}
            </div>
          </div>`;
      }).join('');

      el.innerHTML = `
        <div class="float-header">
          <span class="float-eyebrow">Our Stories</span>
          <h2 class="float-title">진심으로<br><span class="float-title-mark">담아낸 이야기</span></h2>
        </div>
        <div class="float-feed">${cards}</div>`;

      initScrollReveal();
    }

    function initScrollReveal() {
      const cards = document.querySelectorAll('.float-card');

      if (!('IntersectionObserver' in window)) {
        cards.forEach(c => c.classList.add('visible'));
        return;
      }

      const io = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) entry.target.classList.add('visible');
        });
      }, { threshold: 0.3 });

      cards.forEach(card => io.observe(card));
    }

    document.getElementById('dibo-block').innerHTML =
      `<div class="state-msg"><div class="spinner"></div>불러오는 중...</div>`;

    if (typeof axios !== 'undefined') {
      fetchData();
    } else {
      data.sort((a, b) => a.display_order - b.display_order);
      render();
    }
  </script>
</body>
</html>
