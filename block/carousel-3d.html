<!--
=======================================================
  3D 캐러셀 (Carousel 3D) — DIBO Block Extension
=======================================================

【제목 (Title)】
  3D 캐러셀 슬라이더, 입체감 있는 카드 쇼케이스

【설명 (Description)】
  CSS transform 원근 투영(perspective)으로 구현한 3D 원형 캐러셀입니다.
  중앙 카드를 강조하고 좌우 카드에 자연스러운 깊이감을 부여합니다.
  포트폴리오 쇼케이스, 인물 소개, 제품 하이라이트에 적합합니다.

【키워드 (Keywords)】
  3D 캐러셀, 입체 슬라이더, 카드 쇼케이스, CSS 3D, 포트폴리오

【사용 방법】
  1. 이 파일을 디보 익스텐션 에디터에 붙여넣기 하세요.
  2. 디보 백오피스 '코드 복사' 시 copy_config_id가 실제 ID로 자동 교체됩니다.
  3. 로컬 테스트: 브라우저에서 직접 열면 LOCAL_DATA가 표시됩니다.

【LOCAL_DATA 수정 방법】
  아래 JS의 LOCAL_DATA 배열에서 각 카드 항목을 수정하세요.
  ─ main_img_url : 카드 배경 이미지 URL             ← [수정 가능]
  ─ title        : 카드 제목                         ← [수정 가능]
  ─ content      : 카드 설명                         ← [수정 가능]
  ─ link         : '자세히 보기' 버튼 URL             ← [수정 가능]
  ─ display_order: 표시 순서 (숫자가 작을수록 먼저)   ← [수정 가능]

=======================================================
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- [수정 가능] 브라우저 탭 제목 -->
  <title>3D 캐러셀 — DIBO Block</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { overflow-x: hidden; }

    :root {
      --bg:    #1d1d1f;
      --text:  #f5f5f7;
      --sub:   rgba(245,245,247,.5);
      --blue:  #0071e3;
      --ease:  cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Noto Sans KR', 'Poppins', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      min-height: 100vh;
      width: 100%;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 48px 0;
    }

    #dibo-block { width: 100%; max-width: 100%; box-sizing: border-box; overflow-x: hidden; }

    /* ── 헤더 ── */
    .carousel-header {
      text-align: center;
      margin-bottom: 60px;
      padding: 0 24px;
      box-sizing: border-box;
    }
    .carousel-eyebrow {
      font-family: 'Poppins', sans-serif;
      font-size: 11px; font-weight: 600;
      letter-spacing: .2em; text-transform: uppercase;
      color: var(--blue); margin-bottom: 12px;
    }
    .carousel-title {
      font-family: 'Poppins', 'Noto Sans KR', sans-serif;
      font-size: clamp(28px, 5vw, 52px);
      font-weight: 900;
      color: var(--text);
      letter-spacing: -.05em;
      line-height: 1.1;
    }

    /* ── 스테이지 ── */
    .stage {
      perspective: 1400px;
      width: 100%;
      max-width: 100%;
      height: 400px;
      position: relative;
      box-sizing: border-box;
    }

    .carousel-3d {
      width: 260px; height: 360px;
      position: absolute;
      left: 50%; top: 50%;
      transform-style: preserve-3d;
      transform: translate(-50%, -50%);
      transition: transform .65s var(--ease);
    }

    /* ── 카드 ── */
    .c3d-card {
      position: absolute;
      width: 260px; height: 360px;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      transition: filter .38s, box-shadow .38s, opacity .38s;
      backface-visibility: hidden;
    }

    /* ── 반응형 ── */
    @media (max-width: 768px) {
      .stage { height: 340px; perspective: 1100px; }
      .carousel-3d { width: 220px; height: 300px; }
      .c3d-card { width: 220px; height: 300px; }
      .c3d-title { font-size: 15px; }
      .c3d-body { padding: 18px; }
    }
    @media (max-width: 480px) {
      body { padding: 140px 0; }
      .carousel-header { margin-bottom: 36px; }
      .stage { height: 280px; perspective: 800px; }
      .carousel-3d { width: 180px; height: 248px; }
      .c3d-card { width: 180px; height: 248px; border-radius: 16px; }
      .c3d-title { font-size: 13px; }
      .c3d-content { font-size: 11px; }
      .c3d-body { padding: 14px; }
      .c3d-num { font-size: 10px; margin-bottom: 4px; }
      .carousel-controls { margin-top: 28px; gap: 14px; }
      .c3d-btn { width: 40px; height: 40px; }
      .c3d-cta-wrap { margin-top: 20px; }
    }

    .c3d-img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .c3d-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.88) 0%, rgba(0,0,0,.08) 55%);
    }

    .c3d-body {
      position: absolute; bottom: 0; left: 0;
      padding: 22px;
    }
    .c3d-num {
      font-family: 'Poppins', sans-serif;
      font-size: 11px; font-weight: 700;
      letter-spacing: .1em; color: var(--blue);
      margin-bottom: 6px;
    }
    .c3d-title {
      font-size: 17px; font-weight: 800;
      color: #fff; letter-spacing: -.02em;
      line-height: 1.3; margin-bottom: 5px;
      word-break: keep-all;
    }
    .c3d-content {
      font-size: 12px; color: rgba(255,255,255,.5);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: keep-all;
    }

    /* ── 활성 카드 테두리 ── */
    .c3d-card.is-active {
      box-shadow: 0 0 0 1.5px rgba(0,113,227,.6), 0 32px 64px rgba(0,0,0,.5);
    }

    /* ── 컨트롤 ── */
    .carousel-controls {
      display: flex; align-items: center;
      justify-content: center; gap: 20px;
      margin-top: 48px; padding: 0 24px;
      box-sizing: border-box;
    }
    .c3d-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .2s, transform .15s;
    }
    .c3d-btn:hover { background: rgba(255,255,255,.14); }
    .c3d-btn:active { transform: scale(.9); }

    .c3d-counter {
      font-family: 'Poppins', sans-serif;
      font-size: 13px; font-weight: 600;
      color: var(--sub);
      font-variant-numeric: tabular-nums;
      min-width: 44px; text-align: center;
    }
    .c3d-counter span { color: var(--text); }

    /* ── CTA ── */
    .c3d-cta-wrap { text-align: center; margin-top: 28px; min-height: 44px; }
    .c3d-cta {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 12px 26px; border-radius: 100px;
      background: var(--blue); color: #fff;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px; font-weight: 700;
      border: none; cursor: pointer;
      text-decoration: none;
      transition: filter .2s, transform .2s;
    }
    .c3d-cta:hover { filter: brightness(1.12); transform: translateY(-1px); }

    /* ── 상태 메시지 ── */
    .state-msg {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; height: 360px;
      color: var(--sub); font-size: 14px;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid rgba(255,255,255,.08);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="dibo-block"></div>

  <script>
    /* ★ [수정 가능] 로컬 기본 데이터 — API 연동 전 표시되는 샘플 데이터입니다. */
    const LOCAL_DATA = [
      { main_img_url: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&q=80', title: '산 정상의 새벽', content: '새벽빛이 물드는 봉우리의 고요한 순간.', link: '#', display_order: 0 },
      { main_img_url: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&q=80', title: '숲의 빛',         content: '초록 나뭇잎 사이로 춤추는 금빛 햇살.',   link: '#', display_order: 1 },
      { main_img_url: 'https://images.unsplash.com/photo-1518020382113-a7e8fc38eac9?w=600&q=80', title: '도시의 밤',       content: '네온빛으로 물든 도시의 에너지.',         link: '#', display_order: 2 },
      { main_img_url: 'https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=600&q=80', title: '야생의 봄',       content: '들판을 가득 채운 야생화의 향연.',       link: '#', display_order: 3 },
      { main_img_url: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600&q=80', title: '인물 연구',       content: '빛과 그림자가 빚어낸 감정의 단면.',     link: '#', display_order: 4 },
    ];

    let data = LOCAL_DATA;
    let current = 0;

    async function fetchData() {
      try {
        const res = await axios.get(
          'https://api.di-bo.me/block?config_id=copy_config_id',
          { headers: { 'access-token': diboToken } }
        );
        if (res.data?.length) data = res.data;
      } catch (e) {}
      data.sort((a, b) => a.display_order - b.display_order);
      render();
    }

    function getRadius(n) {
      const w = window.innerWidth;
      if (w <= 480) {
        if (n <= 2) return 130;
        if (n <= 4) return 195;
        return 250;
      } else if (w <= 768) {
        if (n <= 2) return 155;
        if (n <= 4) return 235;
        return 295;
      } else {
        if (n <= 2) return 180;
        if (n <= 4) return 270;
        return 340;
      }
    }

    function render() {
      const el = document.getElementById('dibo-block');
      if (!data.length) {
        el.innerHTML = `<div class="state-msg">표시할 데이터가 없습니다.</div>`;
        return;
      }

      const cards = data.map((item, i) => {
        const img = item.main_img_url || 'https://via.placeholder.com/260x360';
        return `
          <div class="c3d-card" data-index="${i}">
            <img class="c3d-img" src="${img}" alt="${item.title || ''}" loading="lazy" />
            <div class="c3d-overlay"></div>
            <div class="c3d-body">
              <div class="c3d-num">${String(i + 1).padStart(2, '0')}</div>
              <div class="c3d-title">${item.title || ''}</div>
              <div class="c3d-content">${item.content || ''}</div>
            </div>
          </div>`;
      }).join('');

      el.innerHTML = `
        <div class="carousel-header">
          <div class="carousel-eyebrow">Showcase</div>
          <h2 class="carousel-title">3D 쇼케이스</h2>
        </div>
        <div class="stage">
          <div class="carousel-3d">${cards}</div>
        </div>
        <div class="carousel-controls">
          <button class="c3d-btn" id="c3d-prev" aria-label="이전">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="c3d-counter"><span id="c3d-cur">1</span> / ${data.length}</div>
          <button class="c3d-btn" id="c3d-next" aria-label="다음">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
        <div class="c3d-cta-wrap" id="c3d-cta-wrap"></div>`;

      positionCards();
      updateCta();

      document.getElementById('c3d-prev').addEventListener('click', () => { current = (current - 1 + data.length) % data.length; positionCards(); updateCta(); });
      document.getElementById('c3d-next').addEventListener('click', () => { current = (current + 1) % data.length; positionCards(); updateCta(); });

      el.querySelectorAll('.c3d-card').forEach(card => {
        card.addEventListener('click', () => {
          const idx = +card.dataset.index;
          if (idx !== current) { current = idx; positionCards(); updateCta(); }
          else if (data[current]?.link) window.open(data[current].link, '_blank');
        });
      });

      let sx = 0;
      const stage = el.querySelector('.stage');
      stage.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
      stage.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - sx;
        if (Math.abs(dx) > 40) {
          current = dx < 0 ? (current + 1) % data.length : (current - 1 + data.length) % data.length;
          positionCards(); updateCta();
        }
      });

      /* 창 크기 변경 시 카드 위치 재계산 */
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(positionCards, 120);
      });
    }

    function positionCards() {
      const cards = document.querySelectorAll('.c3d-card');
      const n = data.length;
      const r = getRadius(n);
      cards.forEach((card, i) => {
        const offset = i - current;
        const angle  = (360 / n) * offset;
        const rad    = angle * Math.PI / 180;
        const x      = Math.sin(rad) * r;
        const z      = Math.cos(rad) * r - r;
        const isActive = i === current;
        const scale  = isActive ? 1 : 0.76 + 0.1 * Math.cos(rad);
        card.style.transform = `translateX(${x}px) translateZ(${z}px) scale(${scale})`;
        card.style.filter    = `brightness(${isActive ? 1 : 0.45})`;
        card.style.opacity   = Math.max(0.2, isActive ? 1 : 0.4 + 0.25 * Math.cos(rad));
        card.style.zIndex    = isActive ? 10 : Math.round(5 - Math.abs(offset));
        card.classList.toggle('is-active', isActive);
      });
      const cur = document.getElementById('c3d-cur');
      if (cur) cur.textContent = current + 1;
    }

    function updateCta() {
      const wrap = document.getElementById('c3d-cta-wrap');
      if (!wrap) return;
      const item = data[current];
      wrap.innerHTML = item?.link
        ? `<a class="c3d-cta" href="${item.link}" target="_blank">자세히 보기 <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a>`
        : '';
    }

    document.getElementById('dibo-block').innerHTML =
      `<div class="state-msg"><div class="spinner"></div>불러오는 중...</div>`;

    if (typeof axios !== 'undefined') {
      fetchData();
    } else {
      data.sort((a, b) => a.display_order - b.display_order);
      render();
    }
  </script>
</body>
</html>
