<!--
=======================================================
  배너 슬라이더 (Banner Slider) — DIBO Block Extension
=======================================================

【제목 (Title)】
  자동 전환 배너 슬라이더, 쇼핑몰·랜딩페이지 이미지 슬라이드

【설명 (Description)】
  터치 스와이프·자동 재생·진행 바가 내장된 풀스크린 배너 슬라이더입니다.
  디보 Block API와 연동하면 백오피스에서 이미지·제목·링크를 즉시 교체할 수 있습니다.
  랜딩 페이지 메인 비주얼, 이벤트 배너, 브랜드 캠페인에 적합합니다.

【키워드 (Keywords)】
  배너 슬라이더, 이미지 슬라이드, 자동 전환 배너, 풀스크린 슬라이더, 노코드 배너

【사용 방법】
  1. 이 파일을 디보 익스텐션 에디터에 붙여넣기 하세요.
  2. 디보 백오피스에서 '코드 복사' 시 copy_config_id가 실제 ID로 자동 교체됩니다.
  3. 로컬 테스트: 브라우저에서 파일을 직접 열면 LOCAL_DATA가 표시됩니다.

【LOCAL_DATA 수정 방법】
  아래 JS의 LOCAL_DATA 배열에서 각 슬라이드 항목을 수정하세요.
  ─ main_img_url : 슬라이드 배경 이미지 URL           ← [수정 가능]
  ─ title        : 슬라이드 제목                       ← [수정 가능]
  ─ content      : 슬라이드 설명 텍스트                ← [수정 가능]
  ─ link         : 버튼 클릭 시 이동할 URL             ← [수정 가능]
  ─ display_order: 표시 순서 (숫자가 작을수록 먼저)     ← [수정 가능]

=======================================================
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- [수정 가능] 브라우저 탭 제목 -->
  <title>배너 슬라이더 — DIBO Block</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --apple-dark:   #1d1d1f;
      --apple-mid:    #6e6e73;
      --apple-light:  #f5f5f7;
      --apple-white:  #ffffff;
      --apple-blue:   #0071e3;
      --ease:         cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Noto Sans KR', 'Poppins', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--apple-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    #dibo-block { width: 100%; max-width: 1000px; }

    /* ── 상태 메시지 ── */
    .state-msg {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; height: 480px;
      color: rgba(255,255,255,.35);
      font-size: 14px; letter-spacing: .02em;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 2px solid rgba(255,255,255,.1);
      border-top-color: rgba(255,255,255,.5);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 슬라이더 래퍼 ── */
    .slider-wrap {
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      background: #111;
      /* Apple-style subtle shadow */
      box-shadow:
        0 2px 4px rgba(0,0,0,.04),
        0 8px 16px rgba(0,0,0,.08),
        0 32px 64px rgba(0,0,0,.24);
    }

    /* ── 트랙 ── */
    .slider-track {
      display: flex;
      transition: transform .72s var(--ease);
      will-change: transform;
    }

    /* ── 슬라이드 ── */
    .slide {
      flex: 0 0 100%;
      position: relative;
      height: 500px;
      overflow: hidden;
    }

    .slide-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scale(1.04);
      transition: transform 7s linear;
    }
    .slide.active .slide-img { transform: scale(1); }

    /* Apple-style gradient: 세로 + 좌우 */
    .slide-gradient {
      position: absolute; inset: 0;
      background:
        linear-gradient(to right, rgba(0,0,0,.72) 0%, rgba(0,0,0,.0) 65%),
        linear-gradient(to top,   rgba(0,0,0,.3)  0%, transparent 50%);
    }

    /* ── 슬라이드 본문 ── */
    .slide-body {
      position: absolute;
      bottom: 0; left: 0;
      padding: 56px 80px;
      max-width: 580px;
    }

    .slide-chip {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 100px;
      border: 1px solid rgba(255,255,255,.3);
      color: rgba(255,255,255,.8);
      font-family: 'Poppins', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 18px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .5s .15s var(--ease), transform .5s .15s var(--ease);
    }
    .slide.active .slide-chip { opacity: 1; transform: none; }

    .slide-title {
      font-family: 'Poppins', 'Noto Sans KR', sans-serif;
      font-size: clamp(26px, 4vw, 44px);
      font-weight: 800;
      color: #fff;
      line-height: 1.18;
      letter-spacing: -.03em;
      margin-bottom: 14px;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .5s .28s var(--ease), transform .5s .28s var(--ease);
      word-break: keep-all;
    }
    .slide.active .slide-title { opacity: 1; transform: none; }

    .slide-content {
      font-size: 15px;
      color: rgba(255,255,255,.6);
      line-height: 1.7;
      margin-bottom: 30px;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .5s .38s var(--ease), transform .5s .38s var(--ease);
      word-break: keep-all;
    }
    .slide.active .slide-content { opacity: 1; transform: none; }

    .slide-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 12px 24px;
      border-radius: 100px;
      background: var(--apple-white);
      color: var(--apple-dark);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      text-decoration: none;
      opacity: 0;
      transform: translateY(14px);
      transition:
        opacity .5s .48s var(--ease),
        transform .5s .48s var(--ease),
        background .2s,
        color .2s;
    }
    .slide.active .slide-cta { opacity: 1; transform: none; }
    .slide-cta:hover {
      background: var(--apple-blue);
      color: #fff;
    }
    .slide-cta svg { transition: transform .2s var(--ease); }
    .slide-cta:hover svg { transform: translateX(3px); }

    /* ── 좌우 버튼 ── */
    .nav-btn {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,.18);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: background .2s, transform .2s;
    }
    .nav-btn:hover { background: rgba(255,255,255,.22); }
    .nav-btn:active { transform: translateY(-50%) scale(.9); }
    .nav-btn.prev { left: 20px; }
    .nav-btn.next { right: 20px; }

    /* ── Dot 내비게이션 ── */
    .dots {
      position: absolute;
      bottom: 28px; right: 52px;
      display: flex; gap: 6px;
      z-index: 10;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 100px;
      background: rgba(255,255,255,.35);
      cursor: pointer;
      transition: width .35s var(--ease), background .3s;
    }
    .dot.active { width: 22px; background: #fff; }

    /* ── 진행 바 ── */
    .progress-bar {
      position: absolute;
      bottom: 0; left: 0;
      height: 2px;
      background: rgba(255,255,255,.5);
      width: 0%;
      transition: width linear;
      z-index: 10;
    }

    /* ── 카운터 ── */
    .counter {
      position: absolute;
      top: 24px; right: 28px;
      font-family: 'Poppins', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,.4);
      letter-spacing: .08em;
      z-index: 10;
      font-variant-numeric: tabular-nums;
    }
    .counter span { color: rgba(255,255,255,.8); }

    @media (max-width: 600px) {
      .slide { height: 380px; }
      .slide-body { padding: 28px 24px; max-width: 100%; }
      .slide-content { font-size: 14px; margin-bottom: 20px; }
      .nav-btn { display: none; }
      .dots { right: 24px; bottom: 18px; }
      .counter { top: 16px; right: 20px; }
    }
  </style>
</head>
<body>
  <div id="dibo-block"></div>

  <script>
    /* ★ [수정 가능] 로컬 기본 데이터 — API 연동 전 표시되는 샘플 데이터입니다. */
    const LOCAL_DATA = [
      {
        main_img_url: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200&q=80',
        title: '세상의 정상에서',                                    /* ← [수정 가능] 제목 */
        content: '구름 위에 솟은 봉우리, 새벽빛이 물드는 고요한 순간.',  /* ← [수정 가능] 설명 */
        link: '#',                                                     /* ← [수정 가능] 링크 */
        display_order: 0
      },
      {
        main_img_url: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200&q=80',
        title: '숲의 심장으로',
        content: '빛이 스며드는 오솔길을 따라 자연의 소리에 귀 기울여보세요.',
        link: '#',
        display_order: 1
      },
      {
        main_img_url: 'https://images.unsplash.com/photo-1518020382113-a7e8fc38eac9?w=1200&q=80',
        title: '도시의 리듬',
        content: '잠들지 않는 도시, 그 에너지와 빛의 향연 속으로.',
        link: '#',
        display_order: 2
      },
    ];

    const INTERVAL = 5000;
    let data = LOCAL_DATA;
    let current = 0;
    let autoTimer = null;

    /* ── API 호출 ── */
    async function fetchData() {
      try {
        const res = await axios.get(
          'https://api.di-bo.me/block?config_id=copy_config_id',
          { headers: { 'access-token': diboToken } }
        );
        if (res.data?.length) data = res.data;
      } catch (e) {}
      data.sort((a, b) => a.display_order - b.display_order);
      render();
    }

    /* ── 렌더링 ── */
    function render() {
      const el = document.getElementById('dibo-block');
      if (!data.length) {
        el.innerHTML = `<div class="state-msg">표시할 데이터가 없습니다.</div>`;
        return;
      }

      const slides = data.map((item, i) => {
        const img = item.main_img_url || 'https://via.placeholder.com/1200x500';
        return `
          <div class="slide${i === 0 ? ' active' : ''}" data-index="${i}">
            <img class="slide-img" src="${img}" alt="${item.title || ''}" loading="${i === 0 ? 'eager' : 'lazy'}" />
            <div class="slide-gradient"></div>
            <div class="slide-body">
              <div class="slide-chip">Featured</div>
              <div class="slide-title">${item.title || ''}</div>
              <div class="slide-content">${item.content || ''}</div>
              ${item.link ? `<button class="slide-cta" onclick="window.open('${item.link}','_blank')">
                자세히 보기
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
              </button>` : ''}
            </div>
          </div>`;
      }).join('');

      const dots = data.map((_, i) =>
        `<div class="dot${i === 0 ? ' active' : ''}" data-index="${i}"></div>`
      ).join('');

      el.innerHTML = `
        <div class="slider-wrap">
          <div class="slider-track">${slides}</div>
          <button class="nav-btn prev" aria-label="이전">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button class="nav-btn next" aria-label="다음">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>
          <div class="dots">${dots}</div>
          <div class="counter"><span>01</span> / ${String(data.length).padStart(2,'0')}</div>
          <div class="progress-bar"></div>
        </div>`;

      bindEvents();
      startAuto();
    }

    function goTo(idx) {
      const slides = document.querySelectorAll('.slide');
      const dots   = document.querySelectorAll('.dot');
      const track  = document.querySelector('.slider-track');
      const counter = document.querySelector('.counter span');
      slides[current].classList.remove('active');
      dots[current].classList.remove('active');
      current = (idx + data.length) % data.length;
      slides[current].classList.add('active');
      dots[current].classList.add('active');
      track.style.transform = `translateX(-${current * 100}%)`;
      counter.textContent = String(current + 1).padStart(2, '0');
      resetProgress();
    }

    function resetProgress() {
      const bar = document.querySelector('.progress-bar');
      if (!bar) return;
      bar.style.transition = 'none';
      bar.style.width = '0%';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        bar.style.transition = `width ${INTERVAL}ms linear`;
        bar.style.width = '100%';
      }));
    }

    function startAuto() {
      clearInterval(autoTimer);
      autoTimer = setInterval(() => goTo(current + 1), INTERVAL);
      resetProgress();
    }

    function bindEvents() {
      document.querySelector('.prev').addEventListener('click', () => { goTo(current - 1); startAuto(); });
      document.querySelector('.next').addEventListener('click', () => { goTo(current + 1); startAuto(); });
      document.querySelectorAll('.dot').forEach(d =>
        d.addEventListener('click', () => { goTo(+d.dataset.index); startAuto(); })
      );
      const track = document.querySelector('.slider-track');
      let sx = 0;
      track.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
      track.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - sx;
        if (Math.abs(dx) > 48) { goTo(dx < 0 ? current + 1 : current - 1); startAuto(); }
      });
    }

    /* ── 초기화 ── */
    document.getElementById('dibo-block').innerHTML =
      `<div class="state-msg"><div class="spinner"></div>불러오는 중...</div>`;

    if (typeof axios !== 'undefined') {
      fetchData();
    } else {
      data.sort((a, b) => a.display_order - b.display_order);
      render();
    }
  </script>
</body>
</html>
