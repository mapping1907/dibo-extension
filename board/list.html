<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>게시판 — DIBO</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f5f5f7;
      --white:    #ffffff;
      --dark:     #1d1d1f;
      --mid:      #6e6e73;
      --light:    #e8e8ed;
      --blue:     #0071e3;
      --blue-bg:  rgba(0, 113, 227, .08);
      --border:   #d2d2d7;
      --ease:     cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Noto Sans KR', 'Poppins', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      min-height: 100vh;
      padding: 48px 24px 80px;
      font-size: 14px;
    }

    .wrap { max-width: 960px; margin: 0 auto; }

    /* ── 헤더 ── */
    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .page-title {
      font-family: 'Poppins', 'Noto Sans KR', sans-serif;
      font-size: 32px; font-weight: 800;
      color: var(--dark); letter-spacing: -.04em;
    }
    .btn-write {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 11px 22px; border-radius: 100px;
      background: var(--dark); color: #fff;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px; font-weight: 700;
      text-decoration: none; border: none; cursor: pointer;
      transition: background .2s, transform .15s;
      white-space: nowrap;
    }
    .btn-write:hover { background: var(--blue); transform: translateY(-1px); }
    .btn-write svg { flex-shrink: 0; }

    /* ── 필터 + 검색 ── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .filter-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .filter-tab {
      padding: 7px 16px;
      border-radius: 100px;
      font-size: 13px; font-weight: 600;
      color: var(--mid);
      background: var(--white);
      border: 1.5px solid var(--border);
      cursor: pointer;
      transition: all .18s var(--ease);
      white-space: nowrap;
    }
    .filter-tab:hover { border-color: var(--blue); color: var(--blue); }
    .filter-tab.active {
      background: var(--dark); color: #fff;
      border-color: var(--dark);
    }
    .search-wrap {
      position: relative;
      flex-shrink: 0;
    }
    .search-wrap svg {
      position: absolute;
      left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--mid); pointer-events: none;
    }
    .search-input {
      padding: 9px 16px 9px 36px;
      border-radius: 100px;
      border: 1.5px solid var(--border);
      background: var(--white);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px; color: var(--dark);
      width: 220px;
      transition: border-color .18s;
      outline: none;
    }
    .search-input:focus { border-color: var(--blue); }
    .search-input::placeholder { color: var(--mid); }

    /* ── 결과 수 ── */
    .result-count {
      font-size: 13px; color: var(--mid);
      margin-bottom: 12px;
    }
    .result-count strong { color: var(--dark); font-weight: 700; }

    /* ── 게시글 목록 ── */
    .post-list {
      background: var(--white);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.06);
    }
    .post-list-header {
      display: grid;
      grid-template-columns: 60px 72px 1fr 80px 80px 60px 60px;
      padding: 12px 24px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      font-size: 12px; font-weight: 700;
      color: var(--mid);
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .post-item {
      display: grid;
      grid-template-columns: 60px 72px 1fr 80px 80px 60px 60px;
      align-items: center;
      padding: 15px 24px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      text-decoration: none;
      transition: background .15s;
      color: inherit;
    }
    .post-item:last-child { border-bottom: none; }
    .post-item:hover { background: #f0f6ff; }
    .post-item.pinned { background: rgba(0, 113, 227, .03); }

    .post-num {
      font-family: 'Poppins', sans-serif;
      font-size: 13px; color: var(--mid);
      font-weight: 500;
    }
    .post-num.pin-icon {
      display: flex;
      align-items: center;
      color: var(--mid);
    }

    /* ── 분류 배지 (모노톤) ── */
    .cat-badge {
      display: inline-block;
      padding: 3px 8px; border-radius: 5px;
      font-size: 12px; font-weight: 600;
      letter-spacing: .02em;
      width: fit-content;
      background: var(--bg);
      color: var(--mid);
      border: 1px solid var(--border);
    }
    .cat-badge.cat-공지 {
      background: #f0f0f2;
      color: #3a3a3c;
      border-color: #c7c7cc;
    }

    .post-title-wrap { min-width: 0; padding-right: 16px; }
    .post-title-text {
      font-size: 14px; font-weight: 600;
      color: var(--dark); letter-spacing: -.01em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 3px;
      transition: color .15s;
    }
    .post-item:hover .post-title-text { color: var(--blue); }
    .post-tags {
      display: flex; gap: 4px; flex-wrap: wrap;
    }
    .post-tag {
      font-size: 11px; color: var(--mid);
      background: var(--bg);
      padding: 2px 7px; border-radius: 4px;
    }

    .post-author, .post-date, .post-views, .post-likes {
      font-size: 13px; color: var(--mid);
    }
    .post-views { text-align: right; }
    .post-likes { display: flex; align-items: center; gap: 4px; justify-content: flex-end; color: var(--blue); font-weight: 600; }

    /* ── 빈 상태 ── */
    .empty-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; padding: 80px 24px;
      color: var(--mid);
    }
    .empty-state svg { opacity: .4; }
    .empty-state p { font-size: 14px; }

    /* ── 페이지네이션 ── */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 24px;
    }
    .page-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      height: 36px;
      padding: 0 8px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--white);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px; font-weight: 600;
      color: var(--mid);
      cursor: pointer;
      transition: all .15s var(--ease);
      user-select: none;
    }
    .page-btn:hover { border-color: var(--blue); color: var(--blue); }
    .page-btn.active {
      background: var(--dark); color: #fff;
      border-color: var(--dark);
    }
    .page-btn:disabled {
      opacity: .35;
      cursor: not-allowed;
    }
    .page-btn:disabled:hover { border-color: var(--border); color: var(--mid); }

    /* ── 반응형 ── */
    @media (max-width: 680px) {
      .post-list-header { display: none; }
      .post-item {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        gap: 6px;
        padding: 16px 20px;
      }
      .post-num { display: none; }
      .post-author, .post-date, .post-views, .post-likes {
        display: inline;
        font-size: 12px;
      }
      .post-likes { justify-content: flex-start; }
      .post-meta-mobile {
        display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      }
    }
    @media (min-width: 681px) {
      .post-meta-mobile { display: contents; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- 헤더 -->
    <div class="page-header">
      <div>
        <h1 class="page-title">게시판</h1>
      </div>
      <a href="write.html" class="btn-write">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        글쓰기
      </a>
    </div>

    <!-- 필터 + 검색 -->
    <div class="toolbar">
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-tab active" data-cat="전체">전체</button>
        <button class="filter-tab" data-cat="공지">공지</button>
        <button class="filter-tab" data-cat="이벤트">이벤트</button>
        <button class="filter-tab" data-cat="일반">일반</button>
        <button class="filter-tab" data-cat="질문">질문</button>
      </div>
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <circle cx="6" cy="6" r="4.5" stroke="#6e6e73" stroke-width="1.5"/>
          <path d="M9.5 9.5L13 13" stroke="#6e6e73" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input type="text" class="search-input" id="searchInput" placeholder="제목 검색..." />
      </div>
    </div>

    <!-- 결과 수 -->
    <div class="result-count" id="resultCount"></div>

    <!-- 게시글 목록 -->
    <div class="post-list">
      <div class="post-list-header">
        <span>번호</span>
        <span>분류</span>
        <span>제목</span>
        <span>작성자</span>
        <span>날짜</span>
        <span style="text-align:right">조회</span>
        <span style="text-align:right">좋아요</span>
      </div>
      <div id="postList"></div>
    </div>

    <!-- 페이지네이션 -->
    <div class="pagination" id="pagination"></div>
  </div>

  <script src="data.js"></script>
  <script>
    const POSTS_PER_PAGE = 5; // 페이지당 게시글 수

    let currentCat = '전체';
    let currentQuery = '';
    let currentPage = 1;

    function getFilteredPosts() {
      return BOARD_DATA
        .filter(p => currentCat === '전체' || p.category === currentCat)
        .filter(p => !currentQuery || p.title.includes(currentQuery))
        .sort((a, b) => {
          if (a.pinned && !b.pinned) return -1;
          if (!a.pinned && b.pinned) return 1;
          return b.id - a.id;
        });
    }

    function renderPosts() {
      const posts = getFilteredPosts();
      const container = document.getElementById('postList');
      const countEl = document.getElementById('resultCount');
      const totalPages = Math.max(1, Math.ceil(posts.length / POSTS_PER_PAGE));

      // 페이지 범위 보정
      if (currentPage > totalPages) currentPage = totalPages;

      countEl.innerHTML = `총 <strong>${posts.length}</strong>개의 게시글`;

      if (posts.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
              <rect x="6" y="4" width="28" height="34" rx="4" stroke="#6e6e73" stroke-width="2"/>
              <path d="M13 14h14M13 20h14M13 26h8" stroke="#6e6e73" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <p>게시글이 없습니다.</p>
          </div>`;
        renderPagination(0, 1);
        return;
      }

      // 비공지 게시글에 순번 부여 (1, 2, 3…)
      let seqCounter = 1;
      const seqMap = {};
      posts.forEach(p => { if (!p.pinned) seqMap[p.id] = seqCounter++; });

      // 현재 페이지 슬라이스
      const start = (currentPage - 1) * POSTS_PER_PAGE;
      const pagePosts = posts.slice(start, start + POSTS_PER_PAGE);

      const flagIcon = `<svg width="13" height="14" viewBox="0 0 13 14" fill="none">
        <path d="M2 1v12" stroke="#6e6e73" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M2 2h9l-2.5 3.5L11 9H2" fill="#6e6e73" fill-opacity=".18" stroke="#6e6e73" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>`;
      const thumbUpIcon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3m7-10l-4 10v7m0 0h8.5a2 2 0 001.95-1.57l1.5-6A2 2 0 0021.5 9H15V4a2 2 0 00-2-2h-1L8 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

      container.innerHTML = pagePosts.map(post => {
        const num = post.pinned
          ? `<span class="post-num pin-icon">${flagIcon}</span>`
          : `<span class="post-num">${seqMap[post.id]}</span>`;
        const catClass = `cat-${post.category}`;
        const tags = post.tags.slice(0, 2).map(t => `<span class="post-tag">${t}</span>`).join('');
        const dateStr = post.date.slice(5); // MM-DD

        return `
          <a class="post-item${post.pinned ? ' pinned' : ''}" href="view.html?id=${post.id}">
            ${num}
            <div class="post-meta-mobile">
              <span><span class="cat-badge ${catClass}">${post.category}</span></span>
              <div class="post-title-wrap">
                <div class="post-title-text">${post.title}</div>
                <div class="post-tags">${tags}</div>
              </div>
              <span class="post-author">${post.author}</span>
              <span class="post-date">${dateStr}</span>
              <span class="post-views">${post.views.toLocaleString()}</span>
              <span class="post-likes">${thumbUpIcon} ${post.likes || 0}</span>
            </div>
          </a>`;
      }).join('');

      renderPagination(posts.length, totalPages);
    }

    function renderPagination(total, totalPages) {
      const el = document.getElementById('pagination');
      if (total === 0 || totalPages <= 1) { el.innerHTML = ''; return; }

      const prevDisabled = currentPage === 1 ? 'disabled' : '';
      const nextDisabled = currentPage === totalPages ? 'disabled' : '';

      // 페이지 번호 범위 (최대 5개 표시)
      const range = 5;
      let pageStart = Math.max(1, currentPage - Math.floor(range / 2));
      let pageEnd = pageStart + range - 1;
      if (pageEnd > totalPages) { pageEnd = totalPages; pageStart = Math.max(1, pageEnd - range + 1); }

      let nums = '';
      for (let i = pageStart; i <= pageEnd; i++) {
        nums += `<button class="page-btn${i === currentPage ? ' active' : ''}" data-page="${i}">${i}</button>`;
      }

      el.innerHTML = `
        <button class="page-btn" data-page="prev" ${prevDisabled}>
          <svg width="7" height="12" viewBox="0 0 7 12" fill="none">
            <path d="M6 1L1 6l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        ${nums}
        <button class="page-btn" data-page="next" ${nextDisabled}>
          <svg width="7" height="12" viewBox="0 0 7 12" fill="none">
            <path d="M1 1l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>`;
    }

    // 페이지네이션 클릭
    document.getElementById('pagination').addEventListener('click', e => {
      const btn = e.target.closest('.page-btn');
      if (!btn || btn.disabled) return;
      const p = btn.dataset.page;
      const totalPages = Math.max(1, Math.ceil(getFilteredPosts().length / POSTS_PER_PAGE));
      if (p === 'prev') currentPage = Math.max(1, currentPage - 1);
      else if (p === 'next') currentPage = Math.min(totalPages, currentPage + 1);
      else currentPage = parseInt(p, 10);
      renderPosts();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // 필터 탭
    document.getElementById('filterTabs').addEventListener('click', e => {
      const tab = e.target.closest('.filter-tab');
      if (!tab) return;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentCat = tab.dataset.cat;
      currentPage = 1;
      renderPosts();
    });

    // 검색
    document.getElementById('searchInput').addEventListener('input', e => {
      currentQuery = e.target.value.trim();
      currentPage = 1;
      renderPosts();
    });

    renderPosts();
  </script>
</body>
</html>
