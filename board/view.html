<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>게시글 — DIBO</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #f5f5f7;
      --white:  #ffffff;
      --dark:   #1d1d1f;
      --mid:    #6e6e73;
      --border: #d2d2d7;
      --blue:   #0071e3;
      --blue-light: rgba(0,113,227,.08);
      --red:    #ff3b30;
      --green:  #34c759;
      --ease:   cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Noto Sans KR', 'Poppins', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      min-height: 100vh;
      padding: 48px 24px 80px;
    }

    .wrap { max-width: 800px; margin: 0 auto; }

    /* ── 상단 내비 ── */
    .top-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px; flex-wrap: wrap; gap: 10px;
    }
    .btn-back {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 100px;
      background: var(--white); color: var(--mid);
      font-size: 13px; font-weight: 600;
      text-decoration: none; border: 1.5px solid var(--border);
      transition: all .18s;
    }
    .btn-back:hover { border-color: var(--dark); color: var(--dark); }

    .top-actions { display: flex; gap: 8px; }
    .btn {
      padding: 9px 20px; border-radius: 100px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px; font-weight: 700;
      border: none; cursor: pointer;
      transition: all .18s var(--ease);
    }
    .btn-edit   { background: var(--dark); color: #fff; }
    .btn-edit:hover { background: var(--blue); }
    .btn-delete { background: rgba(255,59,48,.1); color: var(--red); }
    .btn-delete:hover { background: var(--red); color: #fff; }
    .btn-save   { background: var(--blue); color: #fff; }
    .btn-save:hover { filter: brightness(1.1); }
    .btn-cancel { background: var(--bg); color: var(--mid); border: 1.5px solid var(--border); }
    .btn-cancel:hover { border-color: var(--dark); color: var(--dark); }

    /* ── 404 ── */
    .not-found {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; padding: 100px 24px; text-align: center;
    }
    .not-found h2 { font-size: 20px; color: var(--dark); }
    .not-found p  { font-size: 14px; color: var(--mid); }

    /* ── 뷰 카드 ── */
    .view-card {
      background: var(--white); border-radius: 20px; overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.07);
    }

    /* 뷰 모드 */
    .view-thumbnail { width: 100%; aspect-ratio: 16/6; object-fit: cover; display: block; }
    .view-head {
      padding: 32px 36px 24px;
      border-bottom: 1px solid var(--border);
    }
    .view-meta-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .cat-badge { display: inline-block; padding: 4px 11px; border-radius: 100px; font-size: 12px; font-weight: 700; }
    .cat-공지   { background: rgba(255, 59, 48, .1); color: #ff3b30; }
    .cat-이벤트 { background: rgba(255,149,  0, .1); color: #ff9500; }
    .cat-일반   { background: rgba( 52,199, 89, .1); color: #34c759; }
    .cat-질문   { background: rgba( 88, 86,214, .1); color: #5856d6; }
    .view-title {
      font-family: 'Poppins', 'Noto Sans KR', sans-serif;
      font-size: 26px; font-weight: 800;
      color: var(--dark); letter-spacing: -.04em;
      line-height: 1.3; word-break: keep-all;
    }
    .view-info { display: flex; align-items: center; gap: 16px; margin-top: 16px; font-size: 13px; color: var(--mid); flex-wrap: wrap; }
    .view-info-item { display: flex; align-items: center; gap: 5px; }
    .view-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 12px; }
    .view-tag { font-size: 11px; color: var(--mid); background: var(--bg); padding: 3px 9px; border-radius: 6px; font-weight: 500; }
    .view-body { padding: 32px 36px; border-bottom: 1px solid var(--border); }
    .view-content {
      font-size: 15px; color: var(--dark);
      line-height: 1.85; word-break: keep-all;
    }
    .view-content p { margin-bottom: .75em; }
    .view-content p:last-child { margin-bottom: 0; }
    .view-content h1 { font-size: 2em; font-weight: 800; margin-bottom: .5em; }
    .view-content h2 { font-size: 1.5em; font-weight: 700; margin-bottom: .5em; }
    .view-content h3 { font-size: 1.2em; font-weight: 700; margin-bottom: .5em; }
    .view-content ul, .view-content ol { padding-left: 1.4em; margin-bottom: .75em; }
    .view-content blockquote { border-left: 3px solid var(--blue); padding-left: 16px; color: var(--mid); margin: 12px 0; }
    .view-content pre { background: #1d1d1f; color: #f5f5f7; border-radius: 10px; padding: 16px 18px; font-size: 13px; overflow-x: auto; margin-bottom: .75em; }
    .view-content code { background: rgba(0,0,0,.06); border-radius: 4px; padding: 2px 5px; font-size: .88em; }
    .view-content pre code { background: none; padding: 0; }
    .view-content a { color: var(--blue); text-decoration: underline; }
    .view-content img { max-width: 100%; border-radius: 8px; display: block; }
    .view-content table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    .view-content td, .view-content th { border: 1.5px solid var(--border); padding: 8px 12px; }
    .view-content th { background: var(--bg); font-weight: 700; }

    /* ── 게시글 좋아요/싫어요 ── */
    .post-vote-row { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 20px 36px; border-bottom: 1px solid var(--border); }
    .btn-post-vote {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 22px; border-radius: 100px;
      border: 1.5px solid var(--border); background: var(--white);
      font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 600;
      color: var(--mid); cursor: pointer; transition: all .15s;
      min-width: 80px; justify-content: center;
    }
    .btn-post-vote:hover { border-color: var(--dark); color: var(--dark); }
    .btn-post-like.active  { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }
    .btn-post-dislike.active { border-color: #8e8e93; color: #3a3a3c; background: #f2f2f7; }
    .btn-post-like.active  { cursor: default; }
    .btn-post-dislike.active { cursor: default; }

    /* ── 편집 폼 ── */
    .edit-form { display: none; }
    .edit-form.active { display: block; }
    .view-mode.hidden { display: none; }

    .edit-head {
      padding: 24px 36px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,113,227,.02);
    }
    .edit-label-row { display: flex; align-items: center; gap: 8px; }
    .edit-badge { padding: 4px 12px; border-radius: 100px; background: rgba(0,113,227,.1); color: var(--blue); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .edit-hint { font-size: 12px; color: var(--mid); }

    .edit-field { margin-bottom: 18px; }
    .edit-field:last-child { margin-bottom: 0; }
    .edit-field-label { font-size: 12px; font-weight: 700; color: var(--mid); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 7px; }
    .edit-input, .edit-select {
      width: 100%; padding: 11px 14px; border-radius: 10px;
      border: 1.5px solid var(--border);
      font-family: 'Noto Sans KR', sans-serif; font-size: 14px; color: var(--dark);
      outline: none; background: var(--white); transition: border-color .18s;
    }
    .edit-input:focus, .edit-select:focus { border-color: var(--blue); }
    .edit-select {
      appearance: none; cursor: pointer;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%236e6e73' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat; background-position: right 14px center; padding-right: 36px;
    }
    .edit-body { padding: 24px 36px 28px; }
    .edit-actions {
      display: flex; justify-content: flex-end; gap: 8px;
      margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border);
    }

    /* ══════════════════════════════
       EDITOR (edit form)
    ══════════════════════════════ */
    .editor-wrap { border: 1.5px solid var(--border); border-radius: 12px; overflow: visible; transition: border-color .18s; position: relative; }
    .editor-wrap:focus-within { border-color: var(--blue); }

    .toolbar {
      display: flex; align-items: center;
      background: var(--bg); border-bottom: 1px solid var(--border);
      border-radius: 10px 10px 0 0;
      position: sticky; top: 0; z-index: 50; overflow: hidden;
    }
    .tb-fixed { display: flex; align-items: center; gap: 1px; padding: 6px 6px 6px 10px; flex-shrink: 0; border-right: 1px solid var(--border); }
    .tb-scroll { display: flex; align-items: center; gap: 1px; padding: 6px 10px 6px 6px; overflow-x: auto; overflow-y: hidden; flex: 1; min-width: 0; scrollbar-width: none; }
    .tb-scroll::-webkit-scrollbar { display: none; }
    .tb-sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; flex-shrink: 0; }
    .tb-group { display: flex; align-items: center; gap: 1px; flex-shrink: 0; }
    .tb-btn {
      width: 26px; height: 26px; border: none; background: transparent; border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--dark); transition: background .14s, color .14s;
      flex-shrink: 0; padding: 0;
    }
    .tb-btn:hover { background: var(--blue-light); color: var(--blue); }
    .tb-btn.active { background: rgba(0,113,227,.14); color: var(--blue); }
    .tb-btn:disabled { opacity: .35; cursor: default; }
    .tb-btn svg { width: 14px; height: 14px; pointer-events: none; }
    .tb-select {
      height: 26px; padding: 0 22px 0 7px; border: 1.5px solid var(--border); border-radius: 5px;
      background: var(--white); font-family: 'Noto Sans KR', sans-serif; font-size: 12px; color: var(--dark);
      cursor: pointer; outline: none; appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%236e6e73' stroke-width='1.3' stroke-linecap='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat; background-position: right 6px center; transition: border-color .15s;
    }
    .tb-select:focus, .tb-select:hover { border-color: var(--blue); }
    .tb-color { position: relative; width: 26px; height: 26px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .14s; }
    .tb-color:hover { background: var(--blue-light); }
    .tb-color input[type=color] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; padding: 0; border: none; }
    .tb-color svg { width: 14px; height: 14px; pointer-events: none; }
    .color-bar { position: absolute; bottom: 3px; left: 4px; right: 4px; height: 3px; border-radius: 2px; pointer-events: none; }

    .link-dialog {
      display: none; position: absolute; top: calc(100% + 6px); left: 0;
      background: var(--white); border: 1.5px solid var(--border); border-radius: 12px;
      padding: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.12); z-index: 200;
      width: 320px; flex-direction: column; gap: 10px;
    }
    .link-dialog.show { display: flex; }
    .link-dialog-title { font-size: 12px; font-weight: 700; color: var(--mid); letter-spacing: .06em; text-transform: uppercase; }
    .link-dialog input { padding: 9px 12px; border-radius: 8px; border: 1.5px solid var(--border); font-family: 'Noto Sans KR', sans-serif; font-size: 13px; color: var(--dark); outline: none; transition: border-color .15s; }
    .link-dialog input:focus { border-color: var(--blue); }
    .link-dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .link-btn { padding: 7px 16px; border-radius: 100px; font-size: 12px; font-weight: 700; border: none; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
    .link-btn-ok { background: var(--blue); color: #fff; }
    .link-btn-cancel { background: var(--bg); color: var(--mid); }

    .table-picker {
      display: none; position: absolute; top: calc(100% + 6px); left: 0;
      background: var(--white); border: 1.5px solid var(--border); border-radius: 12px;
      padding: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.12); z-index: 200;
    }
    .table-picker.show { display: block; }
    .table-grid { display: grid; grid-template-columns: repeat(8,18px); gap: 3px; margin-bottom: 8px; }
    .tg-cell { width: 18px; height: 18px; border-radius: 3px; border: 1.5px solid var(--border); cursor: pointer; transition: all .1s; }
    .tg-cell.hover { background: rgba(0,113,227,.2); border-color: var(--blue); }
    .table-size-label { font-size: 11px; color: var(--mid); text-align: center; font-weight: 600; }

    #editEditorContent {
      min-height: 360px; padding: 24px 28px;
      font-family: 'Noto Sans KR', sans-serif; font-size: 15px; line-height: 1.85;
      color: var(--dark); outline: none; cursor: text;
    }
    #editEditorContent .ProseMirror { outline: none; min-height: 320px; }
    #editEditorContent .ProseMirror p.is-editor-empty:first-child::before { content: attr(data-placeholder); color: var(--mid); pointer-events: none; float: left; height: 0; }
    #editEditorContent .ProseMirror > * + * { margin-top: .75em; }
    #editEditorContent .ProseMirror h1 { font-size: 2em; font-weight: 800; letter-spacing: -.04em; line-height: 1.2; }
    #editEditorContent .ProseMirror h2 { font-size: 1.5em; font-weight: 700; letter-spacing: -.03em; line-height: 1.25; }
    #editEditorContent .ProseMirror h3 { font-size: 1.2em; font-weight: 700; letter-spacing: -.02em; }
    #editEditorContent .ProseMirror ul { padding-left: 1.4em; }
    #editEditorContent .ProseMirror ol { padding-left: 1.4em; }
    #editEditorContent .ProseMirror li > p { margin: 0; }
    #editEditorContent .ProseMirror blockquote { border-left: 3px solid var(--blue); padding-left: 16px; color: var(--mid); margin: 12px 0; }
    #editEditorContent .ProseMirror pre { background: #1d1d1f; color: #f5f5f7; border-radius: 10px; padding: 16px 18px; font-size: 13px; overflow-x: auto; }
    #editEditorContent .ProseMirror code { background: rgba(0,0,0,.06); border-radius: 4px; padding: 2px 5px; font-size: .88em; }
    #editEditorContent .ProseMirror pre code { background: none; padding: 0; }
    #editEditorContent .ProseMirror a { color: var(--blue); text-decoration: underline; }
    #editEditorContent .ProseMirror img { max-width: 100%; border-radius: 8px; display: block; cursor: pointer; transition: outline .15s; }
    #editEditorContent .ProseMirror hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    #editEditorContent .ProseMirror table { border-collapse: collapse; width: 100%; margin: 12px 0; table-layout: fixed; }
    #editEditorContent .ProseMirror td, #editEditorContent .ProseMirror th { border: 1.5px solid var(--border); padding: 8px 12px; min-width: 80px; vertical-align: top; position: relative; }
    #editEditorContent .ProseMirror th { background: var(--bg); font-weight: 700; font-size: 13px; }
    #editEditorContent .ProseMirror .selectedCell::after { content: ''; position: absolute; inset: 0; background: rgba(0,113,227,.08); pointer-events: none; }

    .img-resize-overlay { position: absolute; pointer-events: none; z-index: 30; border: 2px solid var(--blue); border-radius: 2px; }
    .img-resize-handle { position: absolute; width: 10px; height: 10px; background: var(--white); border: 2px solid var(--blue); border-radius: 2px; pointer-events: all; cursor: nwse-resize; }
    .img-resize-handle.nw { top: -5px; left: -5px; cursor: nw-resize; }
    .img-resize-handle.ne { top: -5px; right: -5px; cursor: ne-resize; }
    .img-resize-handle.sw { bottom: -5px; left: -5px; cursor: sw-resize; }
    .img-resize-handle.se { bottom: -5px; right: -5px; cursor: se-resize; }

    .editor-footer { display: flex; justify-content: flex-end; padding: 6px 14px 7px; background: var(--bg); border-top: 1px solid var(--border); border-radius: 0 0 10px 10px; }
    .char-count { font-size: 11px; color: var(--mid); }

    /* ── 이전/다음 글 ── */
    .post-nav { margin-top: 16px; background: var(--white); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.06); }
    .post-nav-item { display: flex; align-items: center; gap: 14px; padding: 16px 24px; text-decoration: none; color: inherit; border-bottom: 1px solid var(--border); transition: background .15s; }
    .post-nav-item:last-child { border-bottom: none; }
    .post-nav-item:hover { background: #f0f6ff; }
    .nav-label { font-size: 11px; font-weight: 700; color: var(--mid); letter-spacing: .08em; text-transform: uppercase; flex-shrink: 0; width: 36px; }
    .nav-title { font-size: 14px; font-weight: 600; color: var(--dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; transition: color .15s; }
    .post-nav-item:hover .nav-title { color: var(--blue); }
    .nav-date { font-size: 12px; color: var(--mid); flex-shrink: 0; }

    /* ── 토스트 ── */
    .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--dark); color: #fff; padding: 12px 24px; border-radius: 100px; font-size: 14px; font-weight: 600; pointer-events: none; opacity: 0; transition: all .3s var(--ease); white-space: nowrap; z-index: 999; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ── 확인 다이얼로그 ── */
    .dialog-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); backdrop-filter: blur(8px); z-index: 900; display: flex; align-items: center; justify-content: center; padding: 24px; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .dialog-backdrop.show { opacity: 1; pointer-events: auto; }
    .dialog-box { background: var(--white); border-radius: 16px; padding: 28px; max-width: 360px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.2); transform: scale(.95); transition: transform .2s var(--ease); }
    .dialog-backdrop.show .dialog-box { transform: scale(1); }
    .dialog-title { font-size: 17px; font-weight: 800; color: var(--dark); margin-bottom: 8px; }
    .dialog-desc  { font-size: 14px; color: var(--mid); line-height: 1.6; margin-bottom: 24px; }
    .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }

    @media (max-width: 600px) {
      .view-head, .view-body, .edit-head, .edit-body { padding-left: 20px; padding-right: 20px; }
    }

    /* ── 댓글 섹션 ── */
    #commentSection, #cmtWriteBox {
      margin-top: 16px;
      background: var(--white); border-radius: 20px; overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.07);
    }
    #cmtWriteBox { padding: 20px 36px 28px; }
    .cmt-section { padding: 0 36px 36px; }
    .cmt-section-title {
      font-size: 15px; font-weight: 700; color: var(--dark);
      display: flex; align-items: center; gap: 8px;
      padding: 28px 0 20px;
    }
    .cmt-count-badge {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--blue); color: #fff; font-size: 11px; font-weight: 700;
      min-width: 20px; padding: 2px 7px; border-radius: 100px;
    }
    .cmt-list { display: flex; flex-direction: column; }
    .cmt-item { padding: 18px 0; border-bottom: 1px solid var(--border); }

    .cmt-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .cmt-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--blue-light); color: var(--blue);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0;
    }
    .cmt-author { font-size: 13px; font-weight: 700; color: var(--dark); }
    .cmt-date   { font-size: 11px; color: var(--mid); }
    .cmt-text   { font-size: 14px; color: var(--dark); line-height: 1.7; word-break: keep-all; }
    .cmt-imgs   { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .cmt-img    {
      width: 72px; height: 72px; border-radius: 8px; object-fit: cover;
      cursor: pointer; border: 1.5px solid var(--border); transition: opacity .15s;
    }
    .cmt-img:hover { opacity: .8; }
    .btn-reply {
      font-size: 11px; font-weight: 600; color: var(--mid);
      background: none; border: 1.5px solid var(--border); border-radius: 100px;
      cursor: pointer; padding: 2px 8px; transition: all .15s; line-height: 1.6;
    }
    .btn-reply:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }

    /* 대댓글 */
    .rply-list {
      margin: 12px 0 0 16px;
    }
    .rply-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
    .rply-item:last-child { border-bottom: none; }
    .rply-form-wrap { margin: 10px 0 0 38px; display: none; }
    .rply-form-wrap.open { display: block; }

    /* 작성 박스 */
    .cmt-write-box {
      background: var(--bg); border-radius: 12px;
      padding: 14px 16px; border: 1.5px solid var(--border); margin-top: 20px;
    }
    .cmt-write-label {
      font-size: 11px; font-weight: 700; color: var(--mid);
      letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px;
    }
    .cmt-input {
      display: block; width: 100%; padding: 8px 12px; border-radius: 8px;
      border: 1.5px solid var(--border); background: var(--white);
      font-family: 'Noto Sans KR', sans-serif; font-size: 13px; color: var(--dark);
      outline: none; transition: border-color .15s; margin-bottom: 7px;
    }
    .cmt-input:focus { border-color: var(--blue); }
    .cmt-textarea {
      display: block; width: 100%; resize: vertical; min-height: 72px;
      padding: 9px 12px; border-radius: 8px;
      border: 1.5px solid var(--border); background: var(--white);
      font-family: 'Noto Sans KR', sans-serif; font-size: 13px; color: var(--dark);
      outline: none; transition: border-color .15s; line-height: 1.65;
    }
    .cmt-textarea:focus { border-color: var(--blue); }
    .cmt-footer {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-top: 8px; flex-wrap: wrap;
    }
    .cmt-img-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 12px; border-radius: 100px;
      border: 1.5px solid var(--border); background: var(--white);
      font-size: 12px; font-weight: 600; color: var(--mid); cursor: pointer;
      transition: all .15s;
    }
    .cmt-img-btn:hover { border-color: var(--blue); color: var(--blue); }
    .cmt-submit {
      padding: 7px 18px; border-radius: 100px;
      background: var(--blue); color: #fff;
      font-family: 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 700;
      border: none; cursor: pointer; transition: filter .15s;
    }
    .cmt-submit:hover { filter: brightness(1.1); }
    .cmt-cancel {
      padding: 7px 14px; border-radius: 100px;
      background: var(--bg); color: var(--mid);
      font-family: 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 700;
      border: 1.5px solid var(--border); cursor: pointer; transition: all .15s;
    }
    .cmt-cancel:hover { border-color: var(--dark); color: var(--dark); }

    /* 이미지 프리뷰 */
    .cmt-preview { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .cmt-prev-item { position: relative; width: 56px; height: 56px; }
    .cmt-prev-item img {
      width: 100%; height: 100%; border-radius: 8px;
      object-fit: cover; border: 1.5px solid var(--border);
    }
    .cmt-prev-rm {
      position: absolute; top: -5px; right: -5px;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--red); color: #fff; border: none;
      font-size: 10px; cursor: pointer; font-weight: 700;
      display: flex; align-items: center; justify-content: center; line-height: 1;
    }

    /* 라이트박스 */
    .lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,.88);
      z-index: 1000; display: none; align-items: center; justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lightbox-img { max-width: 90vw; max-height: 90vh; border-radius: 10px; object-fit: contain; }
    .lightbox-close {
      position: absolute; top: 18px; right: 22px;
      background: none; border: none; color: #fff; font-size: 30px;
      cursor: pointer; line-height: 1; opacity: .8; transition: opacity .15s;
    }
    .lightbox-close:hover { opacity: 1; }

    @media (max-width: 600px) {
      .cmt-section { padding: 0 20px 24px; }
      #cmtWriteBox { padding: 16px 20px 20px; }
      .rply-list, .rply-form-wrap { margin-left: 10px; }
    }

    /* ── 별점 ── */
    .cmt-stars { display: inline-flex; gap: 1px; margin: 0 2px; vertical-align: middle; }
    .star-filled { color: #ff9500; font-size: 13px; line-height: 1; }
    .star-empty  { color: var(--border); font-size: 13px; line-height: 1; }
    .star-input  { display: flex; align-items: center; gap: 3px; margin-bottom: 8px; }
    .star-input-label { font-size: 11px; font-weight: 700; color: var(--mid); text-transform: uppercase; letter-spacing: .06em; margin-right: 4px; }
    .star-btn { background: none; border: none; cursor: pointer; font-size: 22px; color: var(--border); padding: 0 1px; transition: color .1s; line-height: 1; }
    .star-btn.active, .star-btn:hover { color: #ff9500; }
    .star-reset-btn { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 100px; border: 1.5px solid var(--border); background: var(--white); color: var(--mid); cursor: pointer; margin-left: 4px; transition: all .15s; }
    .star-reset-btn:hover { border-color: var(--mid); }

    /* ── 비밀글 토글 ── */
    .cmt-toggle-row { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; }
    .cmt-toggle-item { display: flex; align-items: center; gap: 5px; cursor: pointer; }
    .cmt-toggle-label { font-size: 12px; font-weight: 600; color: var(--mid); user-select: none; cursor: pointer; }
    .cmt-toggle-item input[type=checkbox] { width: 14px; height: 14px; cursor: pointer; accent-color: var(--blue); }
    .secret-pw-row { display: none; margin-top: 0; margin-bottom: 6px; }
    .cmt-secret-badge { font-size: 13px; color: var(--mid); font-style: italic; }

    /* ── 댓글 수정/삭제 버튼 ── */
    .cmt-edit-actions { display: inline-flex; gap: 4px; margin-left: 6px; }
    .btn-cmt-edit, .btn-cmt-del {
      font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 100px;
      border: 1.5px solid var(--border); background: var(--white); cursor: pointer;
      transition: all .15s; color: var(--mid); line-height: 1.6;
    }
    .btn-cmt-edit:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }
    .btn-cmt-del:hover  { border-color: var(--red);  color: var(--red);  background: rgba(255,59,48,.07); }
    .cmt-inline-edit { display: block; width: 100%; resize: vertical; min-height: 60px; padding: 8px 11px; margin-top: 6px; border-radius: 8px; border: 1.5px solid var(--blue); background: var(--white); font-family: 'Noto Sans KR', sans-serif; font-size: 13px; color: var(--dark); outline: none; }
    .cmt-inline-save-row { display: flex; gap: 6px; margin-top: 6px; justify-content: flex-end; }
    .btn-il-save   { font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 100px; border: none; cursor: pointer; background: var(--blue); color: #fff; transition: filter .15s; }
    .btn-il-save:hover { filter: brightness(1.1); }
    .btn-il-cancel { font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 100px; border: 1.5px solid var(--border); background: var(--bg); color: var(--mid); cursor: pointer; transition: all .15s; }
    .btn-il-cancel:hover { border-color: var(--dark); color: var(--dark); }

    /* ── 비밀번호 확인 팝업 ── */
    .pwd-popup-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.4);
      backdrop-filter: blur(8px); z-index: 901;
      display: none; align-items: center; justify-content: center; padding: 24px;
    }
    .pwd-popup-backdrop.show { display: flex; }
    .pwd-popup-box {
      background: var(--white); border-radius: 16px; padding: 24px 26px;
      max-width: 320px; width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }
    .pwd-popup-title { font-size: 16px; font-weight: 800; color: var(--dark); margin-bottom: 6px; }
    .pwd-popup-desc  { font-size: 13px; color: var(--mid); line-height: 1.5; margin-bottom: 14px; }
    .pwd-popup-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }

    /* ── 대댓글 열기/접기 버튼 ── */
    .btn-rply-toggle {
      display: inline-flex; align-items: center; gap: 4px;
      margin-top: 8px; padding: 3px 10px; border-radius: 100px;
      font-size: 12px; font-weight: 600; color: var(--mid);
      background: var(--bg); border: 1.5px solid var(--border);
      cursor: pointer; transition: all .15s;
    }
    .btn-rply-toggle:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }

    /* ── 댓글 정렬 바 ── */
    .cmt-sort-bar { display: flex; align-items: center; justify-content: space-between; padding: 28px 0 20px; }
    .sort-btns { display: flex; gap: 4px; }
    .btn-sort { font-size: 12px; font-weight: 600; padding: 5px 13px; border-radius: 100px; border: 1.5px solid var(--border); background: var(--white); cursor: pointer; color: var(--mid); transition: all .15s; font-family: 'Noto Sans KR', sans-serif; }
    .btn-sort.active { background: var(--dark); color: #fff; border-color: var(--dark); }
    .btn-sort:hover:not(.active) { border-color: var(--dark); color: var(--dark); }

    /* ── 고정 댓글 ── */
    .cmt-item.cmt-pinned { background: rgba(0,113,227,.04); border-radius: 12px; padding: 0 12px; margin: 0 -12px; }
    .cmt-pin-badge { font-size: 11px; font-weight: 700; color: var(--blue); background: var(--blue-light); padding: 2px 8px; border-radius: 100px; white-space: nowrap; }

    /* ── 좋아요/싫어요/신고/관리자 액션 행 ── */
    .cmt-action-row { display: flex; align-items: center; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
    .btn-like, .btn-dislike, .btn-report {
      font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 100px;
      border: 1.5px solid var(--border); background: var(--white); cursor: pointer;
      transition: all .15s; color: var(--mid); display: inline-flex; align-items: center; gap: 3px;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .btn-like:hover, .btn-like.active  { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }
    .btn-like.active { cursor: default; }
    .btn-dislike:hover, .btn-dislike.active { border-color: #8e8e93; color: #3a3a3c; background: #f2f2f7; }
    .btn-dislike.active { cursor: default; }
    .btn-report:hover { border-color: var(--red); color: var(--red); background: rgba(255,59,48,.07); }
    .btn-report:disabled { opacity: 0.55; cursor: default; pointer-events: none; }
    .cmt-action-sep { flex: 1; min-width: 8px; }
    .btn-pin-admin {
      font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 100px;
      border: 1.5px solid var(--border); background: var(--white); cursor: pointer;
      transition: all .15s; color: var(--mid); font-family: 'Noto Sans KR', sans-serif;
    }
    .btn-pin-admin.active { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }

    /* ── 작성 박스 인풋 레이아웃 ── */
    .cmt-input-row { display: flex; gap: 8px; margin-bottom: 7px; }
    .cmt-input-row .cmt-input { width: 155px; margin-bottom: 0; }
    .cmt-top-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .cmt-top-row .cmt-toggle-item { margin-bottom: 0; }
    .cmt-input-sm { width: 200px; }

    /* ── 로그인 사용자 이름 표시 ── */
    .cmt-login-author { font-size: 12px; font-weight: 700; color: var(--blue); background: var(--blue-light); display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 100px; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- 상단 내비 -->
    <div class="top-nav">
      <a href="list.html" class="btn-back">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        목록으로
      </a>
      <div class="top-actions" id="topActions"></div>
    </div>

    <!-- 404 영역 -->
    <div id="notFound" style="display:none">
      <div class="not-found">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <rect x="8" y="6" width="32" height="38" rx="5" stroke="#6e6e73" stroke-width="2"/>
          <path d="M17 20h14M17 27h14M17 34h8" stroke="#6e6e73" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <h2>게시글을 찾을 수 없습니다</h2>
        <p>삭제되었거나 잘못된 주소입니다.</p>
        <a href="list.html" class="btn btn-edit" style="text-decoration:none;margin-top:8px">목록으로 돌아가기</a>
      </div>
    </div>

    <!-- 메인 카드 (뷰 + 편집 폼) -->
    <div class="view-card" id="mainCard" style="display:none">

      <!-- 뷰 모드 -->
      <div id="viewMode" class="view-mode"></div>

      <!-- 편집 폼 (정적 HTML, TipTap 에디터 포함) -->
      <div id="editForm" class="edit-form">
        <div class="edit-head">
          <div class="edit-label-row">
            <span class="edit-badge">EDIT MODE</span>
            <span class="edit-hint">내용을 수정하고 저장 버튼을 누르세요.</span>
          </div>
        </div>
        <div class="edit-body">
          <div class="edit-field">
            <div class="edit-field-label">분류</div>
            <select class="edit-select" id="editCategory">
              <option value="공지">공지</option>
              <option value="이벤트">이벤트</option>
              <option value="일반">일반</option>
              <option value="질문">질문</option>
            </select>
          </div>
          <div class="edit-field">
            <div class="edit-field-label">제목</div>
            <input type="text" class="edit-input" id="editTitle" maxlength="100" />
          </div>
          <div class="edit-field">
            <div class="edit-field-label">내용</div>
            <div class="editor-wrap" id="editEditorWrap">

              <!-- 툴바 -->
              <div class="toolbar" id="editToolbar">
                <!-- 고정 영역 -->
                <div class="tb-fixed">
                  <div class="tb-group">
                    <button class="tb-btn" id="btnUndo" title="실행 취소 (Ctrl+Z)">
                      <svg viewBox="0 0 16 16" fill="none"><path d="M3 6h7a4 4 0 010 8H7M3 6l3-3M3 6l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <button class="tb-btn" id="btnRedo" title="다시 실행 (Ctrl+Y)">
                      <svg viewBox="0 0 16 16" fill="none"><path d="M13 6H6a4 4 0 000 8h3M13 6l-3-3M13 6l-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                  </div>
                  <div class="tb-sep"></div>
                  <div class="tb-group">
                    <select class="tb-select" id="headingSelect" style="width:72px" title="단락 스타일">
                      <option value="0">본문</option>
                      <option value="1">제목 1</option>
                      <option value="2">제목 2</option>
                      <option value="3">제목 3</option>
                    </select>
                  </div>
                  <div class="tb-group" style="margin-left:2px">
                    <select class="tb-select" id="fontSizeSelect" style="width:52px" title="글자 크기">
                      <option value="10">10</option>
                      <option value="12">12</option>
                      <option value="14">14</option>
                      <option value="16" selected>16</option>
                      <option value="18">18</option>
                      <option value="20">20</option>
                      <option value="24">24</option>
                      <option value="28">28</option>
                      <option value="32">32</option>
                      <option value="36">36</option>
                      <option value="48">48</option>
                    </select>
                  </div>
                  <div class="tb-group" style="margin-left:2px">
                    <select class="tb-select" id="lineHeightSelect" style="width:58px" title="행간">
                      <option value="1">1.0</option>
                      <option value="1.2">1.2</option>
                      <option value="1.5">1.5</option>
                      <option value="1.75" selected>1.75</option>
                      <option value="2">2.0</option>
                      <option value="2.5">2.5</option>
                      <option value="3">3.0</option>
                    </select>
                  </div>
                </div>

                <!-- 횡스크롤 영역 -->
                <div class="tb-scroll">
                  <div class="tb-group">
                    <button class="tb-btn" data-cmd="bold" title="굵게 (Ctrl+B)">
                      <svg viewBox="0 0 16 16" fill="none"><path d="M4 3h5a3 3 0 010 6H4V3zM4 9h6a3 3 0 010 6H4V9z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <button class="tb-btn" data-cmd="italic" title="기울임 (Ctrl+I)">
                      <svg viewBox="0 0 16 16" fill="none"><line x1="10" y1="3" x2="6" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="7" y1="3" x2="13" y2="3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="3" y1="13" x2="9" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    </button>
                    <button class="tb-btn" data-cmd="underline" title="밑줄 (Ctrl+U)">
                      <svg viewBox="0 0 16 16" fill="none"><path d="M4 3v5a4 4 0 008 0V3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="2" y1="14" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    </button>
                    <button class="tb-btn" data-cmd="strike" title="취소선">
                      <svg viewBox="0 0 16 16" fill="none"><line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M5.5 5a2.5 2.5 0 015 0c0 1.5-1 2-2.5 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    </button>
                  </div>
                  <div class="tb-sep"></div>
                  <div class="tb-group">
                    <label class="tb-color" title="글자 색상">
                      <svg viewBox="0 0 16 16" fill="none"><path d="M8 2L3 13M8 2l5 11M5.5 9.5h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                      <div class="color-bar" id="colorTextBar" style="background:#1d1d1f"></div>
                      <input type="color" id="colorText" value="#1d1d1f" />
                    </label>
                    <label class="tb-color" title="배경 색상 (형광펜)">
                      <svg viewBox="0 0 16 16" fill="none"><path d="M10.5 3l2.5 2.5-6 6H4.5V9L10.5 3z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><line x1="2" y1="14" x2="14" y2="14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                      <div class="color-bar" id="colorBgBar" style="background:#ffd60a"></div>
                      <input type="color" id="colorBg" value="#ffd60a" />
                    </label>
                  </div>
                  <div class="tb-sep"></div>
                  <div class="tb-group">
                    <button class="tb-btn" data-cmd="align" data-val="" title="왼쪽 정렬">
                      <svg viewBox="0 0 16 16" fill="none"><line x1="2" y1="4" x2="14" y2="4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="2" y1="7" x2="10" y2="7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="2" y1="10" x2="14" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="2" y1="13" x2="8" y2="13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                    </button>
                    <button class="tb-btn" data-cmd="align" data-val="center" title="가운데 정렬">
                      <svg viewBox="0 0 16 16" fill="none"><line x1="2" y1="4" x2="14" y2="4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="4" y1="7" x2="12" y2="7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="2" y1="10" x2="14" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="5" y1="13" x2="11" y2="13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                    </button>
                    <button class="tb-btn" data-cmd="align" data-val="right" title="오른쪽 정렬">
                      <svg viewBox="0 0 16 16" fill="none"><line x1="2" y1="4" x2="14" y2="4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="6" y1="7" x2="14" y2="7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="2" y1="10" x2="14" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="8" y1="13" x2="14" y2="13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                    </button>
                    <button class="tb-btn" data-cmd="align" data-val="justify" title="양쪽 정렬">
                      <svg viewBox="0 0 16 16" fill="none"><line x1="2" y1="4" x2="14" y2="4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="2" y1="7" x2="14" y2="7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="2" y1="10" x2="14" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="2" y1="13" x2="14" y2="13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                    </button>
                  </div>
                  <div class="tb-sep"></div>
                  <div class="tb-group">
                    <button class="tb-btn" data-cmd="bulletList" title="글머리 기호">

                      <svg viewBox="0 0 16 16" fill="none"><path d="M5 5L2 8l3 3M11 5l3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="9" y1="3" x2="7" y2="13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                    </button>
                  </div>
                  <div class="tb-sep"></div>
                  <div class="tb-group" style="position:relative">
                    <button class="tb-btn" data-cmd="link" title="링크 삽입">
                      <svg viewBox="0 0 16 16" fill="none"><path d="M6.5 9.5a3.5 3.5 0 005 0l2-2a3.5 3.5 0 00-5-5l-1 1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M9.5 6.5a3.5 3.5 0 00-5 0l-2 2a3.5 3.5 0 005 5l1-1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                    </button>
                    <div class="link-dialog" id="linkDialog">
                      <div class="link-dialog-title">링크 삽입</div>
                      <input type="url" id="linkUrl" placeholder="https://example.com" />
                      <div class="link-dialog-actions">
                        <button class="link-btn link-btn-cancel" id="linkCancel">취소</button>
                        <button class="link-btn link-btn-ok" id="linkOk">적용</button>

                  <div class="tb-group" style="position:relative">
                    <button class="tb-btn" id="btnImage" title="이미지 삽입">
                      <svg viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="10" rx="2" stroke="currentColor" stroke-width="1.4"/><circle cx="5.5" cy="6.5" r="1.2" stroke="currentColor" stroke-width="1.2"/><path d="M2 10l3.5-3 3 3 2-2 3.5 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                  </div>
                  <div class="tb-group" style="position:relative">
                    <button class="tb-btn" id="btnTable" title="표 삽입">
                      <svg viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/><line x1="2" y1="6" x2="14" y2="6" stroke="currentColor" stroke-width="1.2"/><line x1="2" y1="10" x2="14" y2="10" stroke="currentColor" stroke-width="1.2"/><line x1="7" y1="2" x2="7" y2="14" stroke="currentColor" stroke-width="1.2"/></svg>
                    </button>
                    <div class="table-picker" id="tablePicker">
                      <div class="table-grid" id="tableGrid"></div>
                      <div class="table-size-label" id="tableSizeLabel">표 크기를 선택하세요</div>
                    </div>
                  </div>
                  <div class="tb-sep"></div>
                  <div class="tb-group">
                    <button class="tb-btn" data-cmd="clearFormat" title="서식 지우기">
                      <svg viewBox="0 0 16 16" fill="none"><path d="M3 13l4-4M9 3l4 4-5 5H5l-2-2 4-4 3-3z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
