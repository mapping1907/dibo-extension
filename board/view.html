                </div><!-- /tb-scroll -->
              </div><!-- /toolbar -->

              <!-- 에디터 콘텐츠 -->
              <div id="editEditorContent"></div>

              <!-- 이미지 리사이즈 오버레이 -->
              <div class="img-resize-overlay" id="imgResizeOverlay" style="display:none">
                <div class="img-resize-handle nw" data-dir="nw"></div>
                <div class="img-resize-handle ne" data-dir="ne"></div>
                <div class="img-resize-handle sw" data-dir="sw"></div>
                <div class="img-resize-handle se" data-dir="se"></div>
              </div>

              <div class="editor-footer">
                <span class="char-count" id="charCount">0자</span>
              </div>
            </div><!-- /editor-wrap -->
          </div>

          <div class="edit-actions">
            <button class="btn btn-cancel" onclick="cancelEdit()">취소</button>
            <button class="btn btn-save" onclick="saveEdit()">저장하기</button>
          </div>
        </div>
      </div><!-- /editForm -->
    </div><!-- /mainCard -->

    <!-- 이전/다음 글 -->
    <div class="post-nav" id="postNav" style="display:none"></div>

    <!-- 댓글 목록 (동적 렌더) -->
    <div id="commentSection" style="display:none"></div>

    <!-- 댓글 작성란 (JS가 렌더) -->
    <div id="cmtWriteBox" style="display:none"></div>
  </div>

  <!-- 라이트박스 -->
  <div id="lightbox" class="lightbox">
    <button id="lbClose" class="lightbox-close">×</button>
    <img id="lbImg" class="lightbox-img" alt="" />
  </div>

  <!-- 비밀번호 확인 팝업 (비로그인 댓글 수정/삭제) -->
  <div class="pwd-popup-backdrop" id="pwdPopup">
    <div class="pwd-popup-box">
      <div class="pwd-popup-title">비밀번호 확인</div>
      <p class="pwd-popup-desc">댓글 작성 시 입력한 비밀번호를 입력해주세요.</p>
      <input type="password" class="cmt-input" id="pwdPopupInput" placeholder="비밀번호" style="margin-bottom:0" />
      <div class="pwd-popup-actions">
        <button class="cmt-cancel" onclick="closePwdPopup()">취소</button>
        <button class="cmt-submit" onclick="confirmPwdPopup()">확인</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="dialog-backdrop" id="dialogBackdrop">
    <div class="dialog-box">
      <div class="dialog-title">게시글을 삭제할까요?</div>
      <div class="dialog-desc">삭제된 게시글은 복구할 수 없습니다.<br>정말 삭제하시겠습니까?</div>
      <div class="dialog-actions">
        <button class="btn btn-cancel" onclick="closeDialog()">취소</button>
        <button class="btn btn-delete" onclick="confirmDelete()">삭제</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const postId = parseInt(params.get('id'));
    const post   = BOARD_DATA.find(p => p.id === postId);

    let isEditMode = false;

    // ── 관리자 ID 설정 (디보 로그인 아이디와 일치하면 관리자로 표시) ──
    const ADMIN_ID = 'admin';

    const _NICK_ADJ  = ['졸린','배고픈','행복한','신나는','느긋한','빠른','귀여운','우아한','용감한','수줍은'];
    const _NICK_NOUN = ['고양이','강아지','토끼','여우','다람쥐','너구리','펭귄','판다','부엉이','곰'];

    function getLoginUser() {
      try {
        const raw = localStorage.getItem('member-token');
        if (!raw || raw === 'null') return null;
        const u = JSON.parse(raw);
        return (u && u.id) ? u : null;
      } catch(e) { return null; }
    }

    function randomNickname() {
      const a = _NICK_ADJ [Math.floor(Math.random() * _NICK_ADJ.length)];
      const n = _NICK_NOUN[Math.floor(Math.random() * _NICK_NOUN.length)];
      return a + ' ' + n;
    }

    function getDisplayAuthor(author, memberId) {
      return memberId === ADMIN_ID ? '관리자' : author;
    }

    function isMyComment(c) {
      const u = getLoginUser();
      if (!u) return false;
      if (u.id === ADMIN_ID) return true;
      return c.member_id && c.member_id === u.id;
    }

    function starsHTML(star) {
      if (!star) return '';
      let h = '<span class="cmt-stars">';
      for (let i = 1; i <= 5; i++) h += `<span class="${i <= star ? 'star-filled' : 'star-empty'}">★</span>`;
      return h + '</span>';
    }

    let _pendingPwdAction = null;
    let _sortMode = 'top';
    let _postVote = null; // 'like' | 'dislike' | null
    const _myVotes   = new Map(); // key → 'like' | 'dislike'
    const _myReports = new Set();

    let _cmtImages = [];
    const _replyImages = {};
    const THUMBS_UP_SVG   = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3m7-10l-4 10v7m0 0h8.5a2 2 0 001.95-1.57l1.5-6A2 2 0 0021.5 9H15V4a2 2 0 00-2-2h-1L8 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    const THUMBS_DOWN_SVG = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M17 2h3a2 2 0 012 2v7a2 2 0 01-2 2h-3m-7 10l4-10V5m0 0H5.5a2 2 0 00-1.95 1.57l-1.5 6A2 2 0 002.5 15H9v4a2 2 0 002 2h1l4-10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    const IMG_SVG = `<svg width="13" height="13" viewBox="0 0 14 14" fill="none">
      <rect x="1" y="2" width="12" height="10" rx="2" stroke="currentColor" stroke-width="1.3"/>
      <circle cx="4.5" cy="5.5" r="1" stroke="currentColor" stroke-width="1.2"/>
      <path d="M1 10l3-3 2.5 2.5 2-2 3.5 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;

    if (!post) {
      document.getElementById('notFound').style.display = 'block';
    } else {
      document.getElementById('mainCard').style.display = 'block';
      renderView();
      renderNav();
      renderTopActions();
      renderCommentSection();
      renderCommentWriteBox();
    }

    // 이미지 라이트박스 이벤트 위임 (단 1회 등록)
    document.addEventListener('click', function(e) {
      if (e.target.classList.contains('cmt-img')) {
        openLightbox(e.target.src);
      }
      if (e.target.id === 'lightbox' || e.target.id === 'lbClose') {
        closeLightbox();
      }
    });

    /* ── 뷰 렌더 ── */
    function renderView() {
      const catClass = `cat-${post.category}`;
      const tags = (post.tags || []).map(t => `<span class="view-tag">${t}</span>`).join('');
      const thumb = post.thumbnail
        ? `<img class="view-thumbnail" src="${post.thumbnail}" alt="${escHtml(post.title)}" />`
        : '';

      document.getElementById('viewMode').innerHTML = `
        ${thumb}
        <div class="view-head">
          <div class="view-meta-top">
            <span class="cat-badge ${catClass}">${post.category}</span>
          </div>
          <h1 class="view-title">${escHtml(post.title)}</h1>
          <div class="view-info">
            <span class="view-info-item">
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="6.5" cy="4.5" r="2.5" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 11c0-2.21 2.24-4 5-4s5 1.79 5 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
              ${escHtml(post.author)}
            </span>
            <span class="view-info-item">
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1.5" y="2.5" width="10" height="9" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M4.5 1v3M8.5 1v3M1.5 6h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
              ${post.date}
            </span>
            <span class="view-info-item">
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1 6.5C1 6.5 3 2 6.5 2S12 6.5 12 6.5 10 11 6.5 11 1 6.5 1 6.5z" stroke="currentColor" stroke-width="1.3"/><circle cx="6.5" cy="6.5" r="1.5" stroke="currentColor" stroke-width="1.3"/></svg>
              조회 ${post.views.toLocaleString()}
            </span>
          </div>
          <div class="view-tags">${tags}</div>
        </div>
        <div class="view-body">
          <div class="view-content" id="viewContent"></div>
        </div>
        <div class="post-vote-row" id="postVoteRow"></div>`;

      // 본문 렌더 (HTML / plain text 모두 처리)
      document.getElementById('viewContent').innerHTML = formatContent(post.content);
      renderPostVoteRow();
    }

    function formatContent(content) {
      if (!content) return '';
      // TipTap이 출력한 HTML이면 그대로
      if (/<[a-z][\s\S]*>/i.test(content)) return content;
      // 평문이면 단락 변환
      return content.split(/\n\n+/).map(p =>
        `<p>${escHtml(p).replace(/\n/g, '<br>')}</p>`
      ).join('');
    }

    /* ── 이전/다음 글 ── */
    function renderNav() {
      const sorted = [...BOARD_DATA].sort((a,b) => b.id - a.id);
      const sidx = sorted.findIndex(p => p.id === postId);
      const prev = sorted[sidx - 1];
      const next = sorted[sidx + 1];
      if (!prev && !next) return;
      const navEl = document.getElementById('postNav');
      navEl.style.display = 'block';
      navEl.innerHTML = [
        prev ? `<a class="post-nav-item" href="view.html?id=${prev.id}">
          <span class="nav-label">이전</span>
          <span class="nav-title">${escHtml(prev.title)}</span>
          <span class="nav-date">${prev.date.slice(5)}</span>
        </a>` : '',
        next ? `<a class="post-nav-item" href="view.html?id=${next.id}">
          <span class="nav-label">다음</span>
          <span class="nav-title">${escHtml(next.title)}</span>
          <span class="nav-date">${next.date.slice(5)}</span>
        </a>` : ''
      ].join('');
    }

    /* ── 상단 버튼 ── */
    function renderTopActions() {
      const el = document.getElementById('topActions');
      if (isEditMode) {
        el.innerHTML = `
          <button class="btn btn-cancel" onclick="cancelEdit()">취소</button>
          <button class="btn btn-save"   onclick="saveEdit()">저장하기</button>`;
      } else {
        el.innerHTML = `
          <button class="btn btn-delete" onclick="openDialog()">삭제</button>
          <button class="btn btn-edit"   onclick="enterEdit()">수정</button>`;
      }
    }

    /* ── 편집 모드 진입 ── */
    function enterEdit() {
      isEditMode = true;
      document.getElementById('viewMode').classList.add('hidden');
      document.getElementById('commentSection').style.display = 'none';
      document.getElementById('cmtWriteBox').style.display = 'none';
      document.getElementById('editForm').classList.add('active');
      renderTopActions();

      // 필드 채우기
      document.getElementById('editCategory').value = post.category;
      document.getElementById('editTitle').value    = post.title;

      // 에디터 내용 설정 (TipTap 로드 후 실행)
      const trySetContent = () => {
        if (window._editEditor) {
          window._editEditor.commands.setContent(formatContent(post.content), false);
          window._editEditor.commands.focus();
        } else {
          setTimeout(trySetContent, 50);
        }
      };
      trySetContent();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
      isEditMode = false;
      document.getElementById('viewMode').classList.remove('hidden');
      renderCommentSection();
      document.getElementById('cmtWriteBox').style.display = 'block';
      document.getElementById('editForm').classList.remove('active');
      renderTopActions();
    }

    /* ── 저장 ── */
    function saveEdit() {
      const category = document.getElementById('editCategory').value;
      const title    = document.getElementById('editTitle').value.trim();
      const editor   = window._editEditor;

      if (!title) { showToast('제목을 입력해주세요.'); return; }

      let contentHtml = '<p></p>';
      let contentText = '';
      if (editor) {
        contentHtml = editor.getHTML();
        contentText = editor.getText().trim();
      }
      if (!contentText) { showToast('내용을 입력해주세요.'); return; }

      // 로컬 데이터 업데이트 (API 연동 전)
      post.category = category;
      post.title    = title;
      post.content  = contentHtml;

      const payload = { id: post.id, category, title, content_html: contentHtml };
      console.log('[수정 데이터]', payload);
      // TODO: API 연동 시 fetch PUT/PATCH 로 교체

      cancelEdit();
      renderView();
      renderTopActions();
      showToast('게시글이 수정되었습니다! (API 연동 전 콘솔 확인)');
    }

    /* ── 삭제 ── */
    function openDialog()  { document.getElementById('dialogBackdrop').classList.add('show'); }
    function closeDialog() { document.getElementById('dialogBackdrop').classList.remove('show'); }
    function confirmDelete() {
      closeDialog();
      console.log('[삭제 요청] id:', post.id);
      showToast('게시글이 삭제되었습니다.');
      setTimeout(() => { window.location.href = 'list.html'; }, 1500);
    }

    /* ── 유틸 ── */
    function escHtml(str) {
      return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }
    window.showToast = showToast;

    /* ═══════════════════════════════════════
       댓글 작성 박스 렌더 (로그인/비로그인 분기)
    ═══════════════════════════════════════ */
    function renderCommentWriteBox() {
      const box = document.getElementById('cmtWriteBox');
      if (!box) return;
      const u = getLoginUser();
      const isAdmin = u && u.id === ADMIN_ID;
      let html = '<div class="cmt-write-label">댓글 작성</div>';

      if (u) {
        const displayName = isAdmin ? '관리자' : escHtml(u.name || u.id);
        html += `<div class="cmt-top-row">
          <span class="cmt-login-author">${displayName}으로 작성</span>
          <label class="cmt-toggle-item">
            <input type="checkbox" id="cmtSecretToggle" onchange="toggleCmtSecretPw()" />
            <span class="cmt-toggle-label">비밀글</span>
          </label>
        </div>
        <div class="secret-pw-row" id="cmtSecretPwRow">
          <input class="cmt-input cmt-input-sm" type="password" id="cmtSecretPw" placeholder="비밀글 비밀번호" maxlength="30" />
        </div>`;
      } else {
        html += `<div class="cmt-input-row">
          <input class="cmt-input" id="cmtAuthor" placeholder="이름" maxlength="20" value="${escHtml(randomNickname())}" />
          <input class="cmt-input" type="password" id="cmtGuestPw" placeholder="비밀번호" maxlength="30" />
        </div>`;
      }

      html += `<textarea class="cmt-textarea" id="cmtText" placeholder="댓글을 입력하세요."></textarea>
        <div class="cmt-preview" id="cmtPreview"></div>
        <div class="cmt-footer">
          <label class="cmt-img-btn">
            ${IMG_SVG} 사진 첨부
            <input type="file" accept="image/*" multiple id="cmtImgInput" style="display:none" />
          </label>
          <button class="cmt-submit" onclick="submitComment()">댓글 등록</button>
        </div>`;

      box.innerHTML = html;
      document.getElementById('cmtImgInput').addEventListener('change', function(e) {
        loadImageFiles(e.target.files, _cmtImages, 'cmtPreview', null);
        e.target.value = '';
      });
    }

    function buildReplyFormHTML(cid) {
      const u = getLoginUser();
      const isAdmin = u && u.id === ADMIN_ID;
      let html = '<div class="cmt-write-box" style="margin-top:0"><div class="cmt-write-label">대댓글 작성</div>';

      if (u) {
        const displayName = isAdmin ? '관리자' : escHtml(u.name || u.id);
        html += `<div class="cmt-top-row">
          <span class="cmt-login-author">${displayName}으로 작성</span>
          <label class="cmt-toggle-item">
            <input type="checkbox" id="rSecretToggle-${cid}" onchange="toggleRplySecretPw(${cid})" />
            <span class="cmt-toggle-label">비밀글</span>
          </label>
        </div>
        <div class="secret-pw-row" id="rSecretPwRow-${cid}">
          <input class="cmt-input cmt-input-sm" type="password" id="rSecretPw-${cid}" placeholder="비밀글 비밀번호" maxlength="30" />
        </div>`;
      } else {
        html += `<div class="cmt-input-row">
          <input class="cmt-input" id="rAuthor-${cid}" placeholder="이름" maxlength="20" value="${escHtml(randomNickname())}" />
          <input class="cmt-input" type="password" id="rGuestPw-${cid}" placeholder="비밀번호" maxlength="30" />
        </div>`;
      }

      html += `<textarea class="cmt-textarea" id="rText-${cid}" placeholder="대댓글을 입력하세요." style="min-height:60px"></textarea>
        <div class="cmt-preview" id="rPreview-${cid}"></div>
        <div class="cmt-footer">
          <label class="cmt-img-btn">
            ${IMG_SVG} 사진 첨부
            <input type="file" accept="image/*" multiple id="rImgInput-${cid}" style="display:none" />
          </label>
          <div style="display:flex;gap:6px">
            <button class="cmt-cancel" onclick="toggleReplyForm(${cid})">취소</button>
            <button class="cmt-submit" onclick="submitReply(${cid})">등록</button>
          </div>
        </div></div>`;
      return html;
    }

    function toggleCmtSecretPw() {
      const cb  = document.getElementById('cmtSecretToggle');
      const row = document.getElementById('cmtSecretPwRow');
      if (row) row.style.display = cb && cb.checked ? 'block' : 'none';
    }

    function toggleRplySecretPw(cid) {
      const cb  = document.getElementById('rSecretToggle-' + cid);
      const row = document.getElementById('rSecretPwRow-' + cid);
      if (row) row.style.display = cb && cb.checked ? 'block' : 'none';
    }

    /* ═══════════════════════════════════════
       댓글 / 대댓글
    ═══════════════════════════════════════ */
    function renderCommentSection() {
      const el = document.getElementById('commentSection');
      if (!el) return;
      const comments = COMMENT_DATA.filter(c => c.post_id === postId);
      const replyCount = comments.reduce((sum, c) => sum + REPLY_DATA.filter(r => r.comment_id === c.id).length, 0);
      const totalCount = comments.length + replyCount;

      // 정렬: 고정 댓글 항상 최상단, 나머지는 모드에 따라
      const pinned = comments.filter(c => c.pinned);
      const rest   = comments.filter(c => !c.pinned);
      if (_sortMode === 'top') {
        rest.sort((a, b) => (b.likes || 0) - (a.likes || 0));
      } else {
        rest.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      }
      const sorted = [...pinned, ...rest];

      el.style.display = totalCount > 0 ? 'block' : 'none';
      document.getElementById('cmtWriteBox').style.display = 'block';
      el.innerHTML = `
        <div class="cmt-section">
          <div class="cmt-sort-bar">
            <span class="cmt-count-badge">댓글 ${totalCount}</span>
            <div style="display:flex;gap:6px">
              <button class="btn-sort${_sortMode === 'top' ? ' active' : ''}" onclick="setSortMode('top')">인기댓글순</button>
              <button class="btn-sort${_sortMode === 'new' ? ' active' : ''}" onclick="setSortMode('new')">최신순</button>
            </div>
          </div>
          <div class="cmt-list">${sorted.map(cmtHTML).join('')}</div>
        </div>`;
      sorted.forEach(function(c) {
        const input = document.getElementById('rImgInput-' + c.id);
        if (!input) return;
        input.addEventListener('change', function(e) {
          if (!_replyImages[c.id]) _replyImages[c.id] = [];
          loadImageFiles(e.target.files, _replyImages[c.id], 'rPreview-' + c.id, c.id);
          e.target.value = '';
        });
      });
    }

    function cmtHTML(c) {
      const replies = REPLY_DATA.filter(r => r.comment_id === c.id);
      const u = getLoginUser();
      const isMine = u && (u.id === ADMIN_ID || (c.member_id && c.member_id === u.id));

      // 비밀글: 작성자·관리자만 열람
      let contentHTML;
      if (c.secret && !isMine) {
        contentHTML = '<div class="cmt-secret-badge">🔒 비밀글입니다.</div>';
      } else {
        contentHTML = `<div class="cmt-text">${escHtml(c.content).replace(/\n/g,'<br>')}</div>`;
      }

      const imgs = (c.images || []).map(src => '<img class="cmt-img" src="' + src + '" alt="" />').join('');
      const displayAuthor = escHtml(getDisplayAuthor(c.author, c.member_id));
      const isAdminUser = u && u.id === ADMIN_ID;
      const likeKey     = 'cmt-' + c.id;
      const myVoteCmt   = _myVotes.get(likeKey);
      const likedCmt    = myVoteCmt === 'like';
      const dislikedCmt = myVoteCmt === 'dislike';
      const reportedCmt = _myReports.has(likeKey);

      // 수정/삭제: 로그인→내 댓글만, 비로그인→게스트 댓글 전부(비번 검증)
      let actionBtns = '';
      if (isMine) {
        actionBtns = `<span class="cmt-edit-actions">
          <button class="btn-cmt-edit" onclick="startEditCmt(${c.id})">수정</button>
          <button class="btn-cmt-del"  onclick="deleteCmt(${c.id})">삭제</button>
        </span>`;
      } else if (!c.member_id) {
        actionBtns = `<span class="cmt-edit-actions">
          <button class="btn-cmt-edit" onclick="openPwdPopup('edit','cmt',${c.id})">수정</button>
          <button class="btn-cmt-del"  onclick="openPwdPopup('del','cmt',${c.id})">삭제</button>
        </span>`;
      }

      const pinnedBadge  = c.pinned ? '<span class="cmt-pin-badge">📌 고정댓글</span>' : '';
      const adminPinBtn  = isAdminUser ? `<button class="btn-pin-admin${c.pinned ? ' active' : ''}" onclick="togglePin(${c.id})" title="${c.pinned ? '고정 해제' : '고정'}">${c.pinned ? '📌' : '📍'}</button>` : '';
      const actionRow = `
          <div class="cmt-action-row">
            <button class="btn-like${likedCmt ? ' active' : ''}" onclick="voteLike('cmt',${c.id})">${THUMBS_UP_SVG} ${c.likes || 0}</button>
            <button class="btn-dislike${dislikedCmt ? ' active' : ''}" onclick="voteDislike('cmt',${c.id})">${THUMBS_DOWN_SVG}</button>
            <button class="btn-report${reportedCmt ? ' active' : ''}" ${reportedCmt ? 'disabled' : ''} onclick="reportItem('cmt',${c.id})">${reportedCmt ? '신고됨' : '신고'}</button>
            <span class="cmt-action-sep"></span>
            ${adminPinBtn}
          </div>`;

      return `
        <div class="cmt-item${c.pinned ? ' cmt-pinned' : ''}" id="cmt-${c.id}">
          ${pinnedBadge}
          <div class="cmt-meta">
            <span class="cmt-author">${displayAuthor}</span>
            <span class="cmt-date">${escHtml(c.date)}</span>
            ${actionBtns}
            <button class="btn-reply" onclick="toggleReplyForm(${c.id})">
              ↪ 대댓글${replies.length > 0 ? ' (' + replies.length + ')' : ' 달기'}
            </button>
          </div>
          ${contentHTML}
          ${actionRow}
          <div class="cmt-inline-edit-area" id="cmt-edit-area-${c.id}" style="display:none">
            <textarea class="cmt-inline-edit" id="cmt-edit-text-${c.id}">${escHtml(c.content)}</textarea>
            <div class="cmt-inline-save-row">
              <button class="btn-il-cancel" onclick="cancelEditCmt(${c.id})">취소</button>
              <button class="btn-il-save"   onclick="saveEditCmt(${c.id})">저장</button>
            </div>
          </div>
          ${imgs ? '<div class="cmt-imgs">' + imgs + '</div>' : ''}
          ${replies.length > 0 ? `
          <button class="btn-rply-toggle" id="rplyToggleBtn-${c.id}" onclick="toggleRplyList(${c.id})">
            ▾ 대댓글 ${replies.length}개 보기
          </button>` : ''}
          <div class="rply-list" id="rList-${c.id}" style="display:none">
            ${replies.map(r => replyHTML(r, c.id)).join('')}
          </div>
          <div class="rply-form-wrap" id="rForm-${c.id}">
            ${buildReplyFormHTML(c.id)}
          </div>
        </div>`;
    }

    function replyHTML(r, cid) {
      const u = getLoginUser();
      const isMine = u && (u.id === ADMIN_ID || (r.member_id && r.member_id === u.id));

      let contentHTML;
      if (r.secret && !isMine) {
        contentHTML = '<div class="cmt-secret-badge">🔒 비밀글입니다.</div>';
      } else {
        contentHTML = `<div class="cmt-text">${escHtml(r.content).replace(/\n/g,'<br>')}</div>`;
      }

      const imgs = (r.images || []).map(src => '<img class="cmt-img" src="' + src + '" alt="" />').join('');
      const displayAuthor = escHtml(getDisplayAuthor(r.author, r.member_id));
      const rawAuthor  = (r.member_id === ADMIN_ID ? '관리자' : r.author).replace(/'/g, "\\'");
      const likeKeyR   = 'rply-' + r.id;
      const myVoteR    = _myVotes.get(likeKeyR);
      const likedR     = myVoteR === 'like';
      const dislikedR  = myVoteR === 'dislike';
      const reportedR  = _myReports.has(likeKeyR);
      const actionRowR = `
          <div class="cmt-action-row">
            <button class="btn-like${likedR ? ' active' : ''}" onclick="voteLike('rply',${r.id})">${THUMBS_UP_SVG} ${r.likes || 0}</button>
            <button class="btn-dislike${dislikedR ? ' active' : ''}" onclick="voteDislike('rply',${r.id})">${THUMBS_DOWN_SVG}</button>
            <button class="btn-report${reportedR ? ' active' : ''}" ${reportedR ? 'disabled' : ''} onclick="reportItem('rply',${r.id})">${reportedR ? '신고됨' : '신고'}</button>
          </div>`;

      let actionBtns = '';
      if (isMine) {
        actionBtns = `<span class="cmt-edit-actions">
          <button class="btn-cmt-edit" onclick="startEditRply(${r.id})">수정</button>
          <button class="btn-cmt-del"  onclick="deleteRply(${r.id})">삭제</button>
        </span>`;
      } else if (!r.member_id) {
        actionBtns = `<span class="cmt-edit-actions">
          <button class="btn-cmt-edit" onclick="openPwdPopup('edit','rply',${r.id},${cid})">수정</button>
          <button class="btn-cmt-del"  onclick="openPwdPopup('del','rply',${r.id},${cid})">삭제</button>
        </span>`;
      }

      return `
        <div class="rply-item" id="rply-${r.id}">
          <div class="cmt-meta">
            <span class="cmt-author">${displayAuthor}</span>
            <span class="cmt-date">${escHtml(r.date)}</span>
            ${actionBtns}
            <button class="btn-reply" onclick="openReplyWithTag(${cid}, '${rawAuthor}')">↪ 대댓글 달기</button>
          </div>
          ${contentHTML}
          ${actionRowR}
          <div class="cmt-inline-edit-area" id="rply-edit-area-${r.id}" style="display:none">
            <textarea class="cmt-inline-edit" id="rply-edit-text-${r.id}">${escHtml(r.content)}</textarea>
            <div class="cmt-inline-save-row">
              <button class="btn-il-cancel" onclick="cancelEditRply(${r.id})">취소</button>
              <button class="btn-il-save"   onclick="saveEditRply(${r.id})">저장</button>
            </div>
          </div>
          ${imgs ? '<div class="cmt-imgs">' + imgs + '</div>' : ''}
        </div>`;
    }

    function toggleRplyList(cid) {
      const list = document.getElementById('rList-' + cid);
      const btn  = document.getElementById('rplyToggleBtn-' + cid);
      if (!list) return;
      const open = list.style.display !== 'none';
      list.style.display = open ? 'none' : 'block';
      const count = list.querySelectorAll('.rply-item').length;
      if (btn) btn.textContent = open ? `▾ 대댓글 ${count}개 보기` : '▴ 대댓글 접기';
    }

    function toggleReplyForm(cid) {
      const el = document.getElementById('rForm-' + cid);
      if (el) el.classList.toggle('open');
    }

    function openReplyWithTag(cid, author) {
      const formEl = document.getElementById('rForm-' + cid);
      if (formEl && !formEl.classList.contains('open')) formEl.classList.add('open');
      const ta = document.getElementById('rText-' + cid);
      if (!ta) return;
      const tag = '@' + author + ' ';
      // 이미 @태그가 앞에 있으면 교체, 없으면 앞에 붙임
      ta.value = tag + ta.value.replace(/^@\S+\s*/, '');
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    }

    function renderPostVoteRow() {
      const el = document.getElementById('postVoteRow');
      if (!el) return;
      el.innerHTML = `
        <button class="btn-post-vote btn-post-like${_postVote === 'like' ? ' active' : ''}" onclick="votePost('like')">
          ${THUMBS_UP_SVG} <span class="post-vote-count">${post.likes || 0}</span>
        </button>
        <button class="btn-post-vote btn-post-dislike${_postVote === 'dislike' ? ' active' : ''}" onclick="votePost('dislike')">
          ${THUMBS_DOWN_SVG} <span class="post-vote-count">${post.dislikes || 0}</span>
        </button>`;
    }

    function votePost(type) {
      if (!getLoginUser()) { showToast('로그인 후 이용 가능합니다.'); return; }
      if (_postVote === type) return;
      if (_postVote === 'like')    post.likes    = Math.max(0, (post.likes    || 0) - 1);
      if (_postVote === 'dislike') post.dislikes = Math.max(0, (post.dislikes || 0) - 1);
      _postVote = type;
      if (type === 'like')    post.likes    = (post.likes    || 0) + 1;
      if (type === 'dislike') post.dislikes = (post.dislikes || 0) + 1;
      renderPostVoteRow();
    }

    function setSortMode(mode) {
      _sortMode = mode;
      renderCommentSection();
    }

    function voteLike(type, id) {
      if (!getLoginUser()) { showToast('로그인 후 이용 가능합니다.'); return; }
      const key = type + '-' + id;
      if (_myVotes.get(key) === 'like') return; // 이미 좋아요, 재클릭 불가
      const item = type === 'cmt'
        ? COMMENT_DATA.find(c => c.id === id)
        : REPLY_DATA.find(r => r.id === id);
      _myVotes.set(key, 'like');
      if (item) item.likes = (item.likes || 0) + 1;
      renderCommentSection();
    }

    function voteDislike(type, id) {
      if (!getLoginUser()) { showToast('로그인 후 이용 가능합니다.'); return; }
      const key = type + '-' + id;
      if (_myVotes.get(key) === 'dislike') return; // 이미 싫어요, 재클릭 불가
      const item = type === 'cmt'
        ? COMMENT_DATA.find(c => c.id === id)
        : REPLY_DATA.find(r => r.id === id);
      if (_myVotes.get(key) === 'like') {
        // 좋아요 → 싫어요 전환: likes 카운트 감소
        if (item) item.likes = Math.max(0, (item.likes || 0) - 1);
      }
      _myVotes.set(key, 'dislike');
      renderCommentSection();
    }

    function reportItem(type, id) {
      if (!getLoginUser()) { showToast('로그인 후 이용 가능합니다.'); return; }
      const key = type + '-' + id;
      if (_myReports.has(key)) return;
      _myReports.add(key);
      showToast('신고가 접수되었습니다.');
      renderCommentSection();
    }

    function togglePin(id) {
      const u = getLoginUser();
      if (!u || u.id !== ADMIN_ID) return;
      const item = COMMENT_DATA.find(c => c.id === id);
      if (item) item.pinned = !item.pinned;
      renderCommentSection();
    }

    function loadImageFiles(files, arr, previewId, cid) {
      Array.from(files).forEach(function(file) {
        if (file.size > 10 * 1024 * 1024) { showToast('이미지는 10MB 이하여야 합니다.'); return; }
        const fr = new FileReader();
        fr.onload = function(ev) {
          arr.push(ev.target.result);
          renderImgPreview(arr, previewId, cid);
        };
        fr.readAsDataURL(file);
      });
    }

    function renderImgPreview(arr, previewId, cid) {
      const el = document.getElementById(previewId);
      if (!el) return;
      el.innerHTML = arr.map(function(src, i) {
        const rmFn = cid === null ? 'removeCmtImg(' + i + ')' : 'removeReplyImg(' + cid + ',' + i + ')';
        return '<div class="cmt-prev-item"><img src="' + src + '" alt="" /><button class="cmt-prev-rm" onclick="' + rmFn + '">×</button></div>';
      }).join('');
    }

    function removeCmtImg(i) {
      _cmtImages.splice(i, 1);
      renderImgPreview(_cmtImages, 'cmtPreview', null);
    }

    function removeReplyImg(cid, i) {
      if (_replyImages[cid]) {
        _replyImages[cid].splice(i, 1);
        renderImgPreview(_replyImages[cid], 'rPreview-' + cid, cid);
      }
    }

    function submitComment() {
      const content = (document.getElementById('cmtText')?.value || '').trim();
      if (!content) { showToast('댓글 내용을 입력해주세요.'); return; }

      const u = getLoginUser();
      const isAdmin = u && u.id === ADMIN_ID;
      let author, member_id = null, secret = false, password = null;

      if (u) {
        author    = isAdmin ? '관리자' : (u.name || u.id);
        member_id = u.id;
        const secretCb = document.getElementById('cmtSecretToggle');
        secret = !!(secretCb && secretCb.checked);
        if (secret) {
          const pw = (document.getElementById('cmtSecretPw')?.value || '').trim();
          if (!pw) { showToast('비밀글 비밀번호를 입력해주세요.'); return; }
          password = pw;
        }
      } else {
        author = (document.getElementById('cmtAuthor')?.value || '').trim();
        if (!author) { showToast('이름을 입력해주세요.'); return; }
        const pw = (document.getElementById('cmtGuestPw')?.value || '').trim();
        if (!pw) { showToast('비밀번호를 입력해주세요.'); return; }
        password = pw;
      }

      const newId = COMMENT_DATA.length ? Math.max(...COMMENT_DATA.map(c => c.id)) + 1 : 1;
      COMMENT_DATA.push({ id: newId, post_id: postId, member_id, author, date: todayStr(), content, images: [..._cmtImages], secret, password, likes: 0, pinned: false });
      _cmtImages = [];
      document.getElementById('cmtText').value = '';
      document.getElementById('cmtPreview').innerHTML = '';
      showToast('댓글이 등록되었습니다.');
      renderCommentSection();
    }

    function submitReply(cid) {
      const content = (document.getElementById('rText-' + cid)?.value || '').trim();
      if (!content) { showToast('대댓글 내용을 입력해주세요.'); return; }

      const u = getLoginUser();
      const isAdmin = u && u.id === ADMIN_ID;
      let author, member_id = null, secret = false, password = null;

      if (u) {
        author    = isAdmin ? '관리자' : (u.name || u.id);
        member_id = u.id;
        const secretCb = document.getElementById('rSecretToggle-' + cid);
        secret = !!(secretCb && secretCb.checked);
        if (secret) {
          const pw = (document.getElementById('rSecretPw-' + cid)?.value || '').trim();
          if (!pw) { showToast('비밀글 비밀번호를 입력해주세요.'); return; }
          password = pw;
        }
      } else {
        author = (document.getElementById('rAuthor-' + cid)?.value || '').trim();
        if (!author) { showToast('이름을 입력해주세요.'); return; }
        const pw = (document.getElementById('rGuestPw-' + cid)?.value || '').trim();
        if (!pw) { showToast('비밀번호를 입력해주세요.'); return; }
        password = pw;
      }

      const imgs  = _replyImages[cid] || [];
      const newId = REPLY_DATA.length ? Math.max(...REPLY_DATA.map(r => r.id)) + 1 : 1;
      REPLY_DATA.push({ id: newId, comment_id: cid, member_id, author, date: todayStr(), content, images: [...imgs], secret, password, likes: 0 });
      delete _replyImages[cid];
      showToast('대댓글이 등록되었습니다.');
      renderCommentSection();
    }

    function todayStr() {
      return new Date().toISOString().slice(0, 10);
    }

    function openLightbox(src) {
      document.getElementById('lbImg').src = src;
      document.getElementById('lightbox').classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.getElementById('lbImg').src = '';
    }

    /* ── 댓글 인라인 수정/삭제 (로그인) ── */
    function startEditCmt(id) {
      const c = COMMENT_DATA.find(c => c.id === id);
      if (!c) return;
      const item = document.getElementById('cmt-' + id);
      if (!item) return;
      const textDiv = item.querySelector('.cmt-text, .cmt-secret-badge');
      if (textDiv) textDiv.style.display = 'none';
      const editArea = document.getElementById('cmt-edit-area-' + id);
      if (editArea) { editArea.style.display = 'block'; }
      const ta = document.getElementById('cmt-edit-text-' + id);
      if (ta) { ta.value = c.content; ta.focus(); }
    }
    function cancelEditCmt(id) {
      const item = document.getElementById('cmt-' + id);
      if (!item) return;
      const textDiv = item.querySelector('.cmt-text, .cmt-secret-badge');
      if (textDiv) textDiv.style.display = '';
      const editArea = document.getElementById('cmt-edit-area-' + id);
      if (editArea) editArea.style.display = 'none';
    }
    function saveEditCmt(id) {
      const c = COMMENT_DATA.find(c => c.id === id);
      if (!c) return;
      const newContent = (document.getElementById('cmt-edit-text-' + id)?.value || '').trim();
      if (!newContent) { showToast('내용을 입력해주세요.'); return; }
      c.content = newContent;
      showToast('댓글이 수정되었습니다.');
      renderCommentSection();
    }
    function deleteCmt(id) {
      const idx = COMMENT_DATA.findIndex(c => c.id === id);
      if (idx === -1) return;
      COMMENT_DATA.splice(idx, 1);
      for (let i = REPLY_DATA.length - 1; i >= 0; i--) {
        if (REPLY_DATA[i].comment_id === id) REPLY_DATA.splice(i, 1);
      }
      showToast('댓글이 삭제되었습니다.');
      renderCommentSection();
    }

    /* ── 대댓글 인라인 수정/삭제 (로그인) ── */
    function startEditRply(rid) {
      const r = REPLY_DATA.find(r => r.id === rid);
      if (!r) return;
      const item = document.getElementById('rply-' + rid);
      if (!item) return;
      const textDiv = item.querySelector('.cmt-text, .cmt-secret-badge');
      if (textDiv) textDiv.style.display = 'none';
      const editArea = document.getElementById('rply-edit-area-' + rid);
      if (editArea) editArea.style.display = 'block';
      const ta = document.getElementById('rply-edit-text-' + rid);
      if (ta) { ta.value = r.content; ta.focus(); }
    }
    function cancelEditRply(rid) {
      const item = document.getElementById('rply-' + rid);
      if (!item) return;
      const textDiv = item.querySelector('.cmt-text, .cmt-secret-badge');
      if (textDiv) textDiv.style.display = '';
      const editArea = document.getElementById('rply-edit-area-' + rid);
      if (editArea) editArea.style.display = 'none';
    }
    function saveEditRply(rid) {
      const r = REPLY_DATA.find(r => r.id === rid);
      if (!r) return;
      const newContent = (document.getElementById('rply-edit-text-' + rid)?.value || '').trim();
      if (!newContent) { showToast('내용을 입력해주세요.'); return; }
      r.content = newContent;
      showToast('대댓글이 수정되었습니다.');
      renderCommentSection();
    }
    function deleteRply(rid) {
      const idx = REPLY_DATA.findIndex(r => r.id === rid);
      if (idx === -1) return;
      REPLY_DATA.splice(idx, 1);
      showToast('대댓글이 삭제되었습니다.');
      renderCommentSection();
    }

    /* ── 비밀번호 팝업 (비로그인 댓글 수정/삭제) ── */
    function openPwdPopup(type, target, id, cid) {
      _pendingPwdAction = { type, target, id, cid: cid || null };
      const popup = document.getElementById('pwdPopup');
      if (!popup) return;
      document.getElementById('pwdPopupInput').value = '';
      popup.classList.add('show');
      setTimeout(() => document.getElementById('pwdPopupInput').focus(), 50);
    }
    function closePwdPopup() {
      _pendingPwdAction = null;
      document.getElementById('pwdPopup')?.classList.remove('show');
    }
    function confirmPwdPopup() {
      const a = _pendingPwdAction;
      if (!a) { closePwdPopup(); return; }
      const entered = (document.getElementById('pwdPopupInput')?.value || '').trim();
      if (!entered) { showToast('비밀번호를 입력해주세요.'); return; }

      const record = a.target === 'cmt'
        ? COMMENT_DATA.find(c => c.id === a.id)
        : REPLY_DATA.find(r => r.id === a.id);

      if (!record || record.password !== entered) {
        showToast('비밀번호가 올바르지 않습니다.');
        return;
      }
      closePwdPopup();
      if (a.type === 'del') {
        a.target === 'cmt' ? deleteCmt(a.id) : deleteRply(a.id);
      } else {
        a.target === 'cmt' ? startEditCmt(a.id) : startEditRply(a.id);
      }
    }

    // Enter 키로 팝업 확인
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && document.getElementById('pwdPopup')?.classList.contains('show')) {
        confirmPwdPopup();
      }
    });
  </script>

  <!-- TipTap via esm.sh — MIT License -->
  <script type="module">
    import { Editor, Extension } from 'https://esm.sh/@tiptap/core@2.2.4'
    import StarterKit             from 'https://esm.sh/@tiptap/starter-kit@2.2.4'
    import Underline              from 'https://esm.sh/@tiptap/extension-underline@2.2.4'
    import TextAlign              from 'https://esm.sh/@tiptap/extension-text-align@2.2.4'
    import TiptapImage            from 'https://esm.sh/@tiptap/extension-image@2.2.4'
    import Link                   from 'https://esm.sh/@tiptap/extension-link@2.2.4'
    import Color                  from 'https://esm.sh/@tiptap/extension-color@2.2.4'
    import TextStyle              from 'https://esm.sh/@tiptap/extension-text-style@2.2.4'
    import Highlight              from 'https://esm.sh/@tiptap/extension-highlight@2.2.4'
    import Table                  from 'https://esm.sh/@tiptap/extension-table@2.2.4'
    import TableRow               from 'https://esm.sh/@tiptap/extension-table-row@2.2.4'
    import TableHeader            from 'https://esm.sh/@tiptap/extension-table-header@2.2.4'
    import TableCell              from 'https://esm.sh/@tiptap/extension-table-cell@2.2.4'
    import Placeholder            from 'https://esm.sh/@tiptap/extension-placeholder@2.2.4'

    /* ── Custom LineHeight ── */
    const LineHeight = Extension.create({
      name: 'lineHeight',
      addGlobalAttributes() {
        return [{ types: ['paragraph','heading'], attributes: { lineHeight: {
          default: null,
          parseHTML: el => el.style.lineHeight || null,
          renderHTML: a => a.lineHeight ? { style: `line-height:${a.lineHeight}` } : {}
        }}}]
      },
      addCommands() {
        return {
          setLineHeight: value => ({ commands }) =>
            ['paragraph','heading'].every(t => commands.updateAttributes(t, { lineHeight: value })),
          unsetLineHeight: () => ({ commands }) =>
            ['paragraph','heading'].every(t => commands.updateAttributes(t, { lineHeight: null })),
        }
      }
    })

    /* ── Custom FontSize ── */
    const FontSize = Extension.create({
      name: 'fontSize',
      addGlobalAttributes() {
        return [{ types: ['textStyle'], attributes: { fontSize: {
          default: null,
          parseHTML: el => el.style.fontSize || null,
          renderHTML: a => a.fontSize ? { style: `font-size:${a.fontSize}` } : {}
        }}}]
      },
      addCommands() {
        return {
          setFontSize: size => ({ chain }) => chain().setMark('textStyle', { fontSize: size ? size+'px' : null }).run()
        }
      }
    })

    /* ── Editor init ── */
    const editor = new Editor({
      element: document.getElementById('editEditorContent'),
      extensions: [
        StarterKit,
        Underline,
        TextAlign.configure({ types: ['heading','paragraph'] }),
        TiptapImage.configure({ inline: false, allowBase64: true }),
        Link.configure({ openOnClick: false, autolink: true }),
        TextStyle, Color, FontSize,
        Highlight.configure({ multicolor: true }),
        LineHeight,
        Table.configure({ resizable: false }),
        TableRow, TableHeader, TableCell,
        Placeholder.configure({ placeholder: '내용을 입력하세요.' }),
      ],
      content: '<p></p>',
      onUpdate: () => { syncToolbar(); updateCharCount(); },
      onSelectionUpdate: () => syncToolbar(),
    })
    window._editEditor = editor

    /* ── Sync toolbar ── */
    function syncToolbar() {
      const e = editor
      ;['bold','italic','underline','strike','bulletList','orderedList','blockquote','codeBlock'].forEach(cmd => {
        const btn = document.querySelector(`#editToolbar [data-cmd="${cmd}"]`)
        if (btn) btn.classList.toggle('active', e.isActive(cmd))
      })
      document.querySelectorAll('#editToolbar [data-cmd="align"]').forEach(btn => {
        const val = btn.dataset.val
        const active = val === '' ? (!e.isActive({ textAlign:'center' }) && !e.isActive({ textAlign:'right' }) && !e.isActive({ textAlign:'justify' })) : e.isActive({ textAlign: val })
        btn.classList.toggle('active', active)
      })
      const linkBtn = document.querySelector('#editToolbar [data-cmd="link"]')
      if (linkBtn) linkBtn.classList.toggle('active', e.isActive('link'))
      const hs = document.getElementById('headingSelect')
      if (e.isActive('heading',{level:1})) hs.value = '1'
      else if (e.isActive('heading',{level:2})) hs.value = '2'
      else if (e.isActive('heading',{level:3})) hs.value = '3'
      else hs.value = '0'
      const attrs = e.getAttributes('textStyle')
      const fs = document.getElementById('fontSizeSelect')
      const size = attrs.fontSize ? attrs.fontSize.replace('px','') : '16'
      if ([...fs.options].some(o => o.value === size)) fs.value = size
      const lhAttrs = e.getAttributes('paragraph') || {}
      const lhSel = document.getElementById('lineHeightSelect')
      const lh = lhAttrs.lineHeight || '1.75'
      if ([...lhSel.options].some(o => o.value === lh)) lhSel.value = lh
      document.getElementById('btnUndo').disabled = !e.can().undo()
      document.getElementById('btnRedo').disabled = !e.can().redo()
    }
    function updateCharCount() {
      document.getElementById('charCount').textContent = `${editor.getText().trim().length.toLocaleString()}자`
    }

    /* ── Toolbar clicks ── */
    document.getElementById('editToolbar').addEventListener('click', e => {
      const btn = e.target.closest('[data-cmd]')
      if (!btn) return
      e.preventDefault()
      const cmd = btn.dataset.cmd, val = btn.dataset.val, ed = editor.chain().focus()
      switch(cmd) {
        case 'bold':        ed.toggleBold().run(); break
        case 'italic':      ed.toggleItalic().run(); break
        case 'underline':   ed.toggleUnderline().run(); break
        case 'strike':      ed.toggleStrike().run(); break
        case 'bulletList':  ed.toggleBulletList().run(); break
        case 'orderedList': ed.toggleOrderedList().run(); break
        case 'blockquote':  ed.toggleBlockquote().run(); break
        case 'codeBlock':   ed.toggleCodeBlock().run(); break
        case 'align':       ed.setTextAlign(val || 'left').run(); break
        case 'link':        openLinkDialog(); return
        case 'clearFormat': editor.chain().focus().clearNodes().unsetAllMarks().run(); break
      }
      syncToolbar()
    })

    document.getElementById('btnUndo').addEventListener('click', () => { editor.chain().focus().undo().run(); syncToolbar() })
    document.getElementById('btnRedo').addEventListener('click', () => { editor.chain().focus().redo().run(); syncToolbar() })

    document.getElementById('headingSelect').addEventListener('change', function() {
      const v = this.value
      if (v === '0') editor.chain().focus().setParagraph().run()
      else editor.chain().focus().toggleHeading({ level: parseInt(v) }).run()
      syncToolbar()
    })
    document.getElementById('fontSizeSelect').addEventListener('change', function() {
      editor.chain().focus().setFontSize(this.value).run()
      syncToolbar()
    })
    document.getElementById('lineHeightSelect').addEventListener('change', function() {
      editor.chain().focus().setLineHeight(this.value).run()
      syncToolbar()
    })
    document.getElementById('colorText').addEventListener('input', function() {
      editor.chain().focus().setColor(this.value).run()
      document.getElementById('colorTextBar').style.background = this.value
    })
    document.getElementById('colorBg').addEventListener('input', function() {
      editor.chain().focus().setHighlight({ color: this.value }).run()
      document.getElementById('colorBgBar').style.background = this.value
    })

    /* ── 횡스크롤 마우스 휠 ── */
    document.querySelector('#editToolbar .tb-scroll').addEventListener('wheel', e => {
      e.preventDefault()
      e.currentTarget.scrollLeft += e.deltaY || e.deltaX
    }, { passive: false })

    /* ── 이미지 삽입 ── */
    document.getElementById('btnImage').addEventListener('click', () => {
      const input = document.createElement('input')
      input.type = 'file'; input.accept = 'image/*'
      input.onchange = () => {
        const file = input.files[0]; if (!file) return
        if (file.size > 10*1024*1024) { window.showToast('이미지 크기는 10MB 이하여야 합니다.'); return }
        const r = new FileReader()
        r.onload = e => editor.chain().focus().setImage({ src: e.target.result }).run()
        r.readAsDataURL(file)
      }
      input.click()
    })

    /* ── 링크 다이얼로그 ── */
    const linkDialog = document.getElementById('linkDialog')
    function openLinkDialog() {
      document.getElementById('linkUrl').value = editor.getAttributes('link').href || ''
      linkDialog.classList.add('show')
      document.getElementById('linkUrl').focus()
    }
    document.getElementById('linkOk').addEventListener('click', () => {
      const url = document.getElementById('linkUrl').value.trim()
      if (!url) editor.chain().focus().extendMarkRange('link').unsetLink().run()
      else editor.chain().focus().extendMarkRange('link').setLink({ href: url }).run()
      linkDialog.classList.remove('show')
    })
    document.getElementById('linkCancel').addEventListener('click', () => {
      linkDialog.classList.remove('show'); editor.commands.focus()
    })
    document.getElementById('linkUrl').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('linkOk').click()
      if (e.key === 'Escape') document.getElementById('linkCancel').click()
    })
    document.addEventListener('click', e => {
      if (!linkDialog.contains(e.target) && !e.target.closest('[data-cmd="link"]')) linkDialog.classList.remove('show')
    })

    /* ── 표 피커 ── */
    const tablePicker = document.getElementById('tablePicker')
    const tableGrid   = document.getElementById('tableGrid')
    for (let r = 1; r <= 8; r++) {
      for (let c = 1; c <= 8; c++) {
        const cell = document.createElement('div')
        cell.className = 'tg-cell'; cell.dataset.r = r; cell.dataset.c = c
        cell.addEventListener('mouseover', () => {
          tableGrid.querySelectorAll('.tg-cell').forEach(cl => cl.classList.toggle('hover', +cl.dataset.r <= r && +cl.dataset.c <= c))
          document.getElementById('tableSizeLabel').textContent = `${r} × ${c}`
        })
        cell.addEventListener('click', () => {
          editor.chain().focus().insertTable({ rows: r, cols: c, withHeaderRow: true }).run()
          tablePicker.classList.remove('show')
        })
        tableGrid.appendChild(cell)
      }
    }
    document.getElementById('btnTable').addEventListener('click', e => { e.stopPropagation(); tablePicker.classList.toggle('show') })
    document.addEventListener('click', e => { if (!tablePicker.contains(e.target) && e.target.id !== 'btnTable') tablePicker.classList.remove('show') })

    /* ── 이미지 리사이즈 오버레이 ── */
    const editorEl   = document.getElementById('editEditorContent')
    const editorWrap = document.getElementById('editEditorWrap')
    const overlay    = document.getElementById('imgResizeOverlay')
    let resizeImg    = null

    editorEl.addEventListener('click', e => {
      if (e.target.tagName === 'IMG') selectImg(e.target)
      else if (!overlay.contains(e.target)) deselectImg()
    })
    function selectImg(img) {
      deselectImg(); resizeImg = img
      img.style.outline = '2px solid #0071e3'
      positionOverlay(); overlay.style.display = 'block'
    }
    function deselectImg() {
      if (resizeImg) resizeImg.style.outline = ''
      resizeImg = null; overlay.style.display = 'none'
    }
    function positionOverlay() {
      if (!resizeImg) return
      const wr = editorWrap.getBoundingClientRect(), ir = resizeImg.getBoundingClientRect()
      overlay.style.left   = (ir.left - wr.left) + 'px'
      overlay.style.top    = (ir.top  - wr.top)  + 'px'
      overlay.style.width  = ir.width  + 'px'
      overlay.style.height = ir.height + 'px'
    }
    overlay.querySelectorAll('.img-resize-handle').forEach(h => {
      h.addEventListener('mousedown', e => {
        e.preventDefault(); e.stopPropagation()
        const dir = h.dataset.dir
        const startX = e.clientX
        const startW = resizeImg.offsetWidth, startH = resizeImg.offsetHeight
        const ratio = startW / startH
        const onMove = e => {
          const dx = e.clientX - startX
          let w = startW
          if (dir === 'se' || dir === 'ne') w = Math.max(80, startW + dx)
          if (dir === 'sw' || dir === 'nw') w = Math.max(80, startW - dx)
          resizeImg.style.width = w + 'px'
          resizeImg.style.height = (w / ratio) + 'px'
          positionOverlay()
        }
        const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp) }
        document.addEventListener('mousemove', onMove)
        document.addEventListener('mouseup', onUp)
      })
    })
    window.addEventListener('scroll', () => { if (resizeImg) positionOverlay() })
  </script>
