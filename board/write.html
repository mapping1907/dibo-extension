<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>글쓰기 — DIBO</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f5f7; --white: #ffffff; --dark: #1d1d1f;
      --mid: #6e6e73; --border: #d2d2d7; --blue: #0071e3;
      --blue-light: rgba(0,113,227,.08); --red: #ff3b30;
      --ease: cubic-bezier(0.4,0,0.2,1);
    }
    body { font-family:'Noto Sans KR','Poppins',-apple-system,sans-serif; -webkit-font-smoothing:antialiased; background:var(--bg); min-height:100vh; padding:40px 24px 80px; }
    .wrap { max-width:860px; margin:0 auto; }

    /* ── Page Header ── */
    .page-header { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
    .btn-back { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:100px; background:var(--white); color:var(--mid); font-size:13px; font-weight:600; text-decoration:none; border:1.5px solid var(--border); transition:all .18s; flex-shrink:0; }
    .btn-back:hover { border-color:var(--dark); color:var(--dark); }
    .page-title { font-family:'Poppins','Noto Sans KR',sans-serif; font-size:24px; font-weight:800; color:var(--dark); letter-spacing:-.04em; }

    /* ── Form Card ── */
    .form-card { background:var(--white); border-radius:20px; padding:32px 36px; box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.07); }

    /* ── Fields ── */
    .field-row { display:grid; grid-template-columns:160px 1fr; gap:14px; margin-bottom:20px; }
    @media(max-width:600px){ .field-row { grid-template-columns:1fr; } }
    .field { margin-bottom:20px; }
    .field:last-child { margin-bottom:0; }
    .field-label { font-size:12px; font-weight:700; color:var(--mid); letter-spacing:.06em; text-transform:uppercase; margin-bottom:7px; display:flex; align-items:center; gap:4px; }
    .required { color:var(--red); }
    .field-hint { font-size:11px; color:var(--mid); margin-top:5px; }
    .field-input, .field-select {
      width:100%; padding:11px 14px; border-radius:10px; border:1.5px solid var(--border);
      background:var(--white); font-family:'Noto Sans KR',sans-serif; font-size:14px; color:var(--dark);
      outline:none; transition:border-color .18s;
    }
    .field-input:focus, .field-select:focus { border-color:var(--blue); }
    .field-input::placeholder { color:var(--mid); }
    .field-select { cursor:pointer; appearance:none;
      background-image:url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%236e6e73' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
      background-repeat:no-repeat; background-position:right 12px center; padding-right:32px; }

    /* ══════════════════════════════
       EDITOR
    ══════════════════════════════ */
    .editor-wrap { border:1.5px solid var(--border); border-radius:12px; overflow:visible; transition:border-color .18s; position:relative; }
    .editor-wrap:focus-within { border-color:var(--blue); }

    /* ── Toolbar ── */
    .toolbar {
      display:flex; align-items:center;
      background:var(--bg);
      border-bottom:1px solid var(--border);
      border-radius:10px 10px 0 0;
      position:sticky; top:0; z-index:50;
      overflow:hidden;
    }
    .tb-fixed {
      display:flex; align-items:center; gap:1px;
      padding:6px 6px 6px 10px;
      flex-shrink:0;
      border-right:1px solid var(--border);
    }
    .tb-scroll {
      display:flex; align-items:center; gap:1px;
      padding:6px 10px 6px 6px;
      overflow-x:auto; overflow-y:hidden;
      flex:1; min-width:0;
      scrollbar-width:none;
    }
    .tb-scroll::-webkit-scrollbar { display:none; }
    .tb-sep { width:1px; height:18px; background:var(--border); margin:0 4px; flex-shrink:0; }
    .tb-group { display:flex; align-items:center; gap:1px; flex-shrink:0; }
    .tb-btn {
      width:26px; height:26px; border:none; background:transparent; border-radius:5px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; color:var(--dark); transition:background .14s,color .14s;
      flex-shrink:0; padding:0;
    }
    .tb-btn:hover { background:var(--blue-light); color:var(--blue); }
    .tb-btn.active { background:rgba(0,113,227,.14); color:var(--blue); }
    .tb-btn:disabled { opacity:.35; cursor:default; }
    .tb-btn svg { width:14px; height:14px; pointer-events:none; }

    /* Toolbar selects */
    .tb-select {
      height:26px; padding:0 22px 0 7px; border:1.5px solid var(--border); border-radius:5px;
      background:var(--white); font-family:'Noto Sans KR',sans-serif; font-size:12px; color:var(--dark);
      cursor:pointer; outline:none; appearance:none;
      background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%236e6e73' stroke-width='1.3' stroke-linecap='round'/%3E%3C/svg%3E");
      background-repeat:no-repeat; background-position:right 6px center;
      transition:border-color .15s;
    }
    .tb-select:focus, .tb-select:hover { border-color:var(--blue); }

    /* Color buttons */
    .tb-color { position:relative; width:26px; height:26px; border-radius:5px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .14s; }
    .tb-color:hover { background:var(--blue-light); }
    .tb-color input[type=color] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; padding:0; border:none; }
    .tb-color svg { width:14px; height:14px; pointer-events:none; }
    .color-bar { position:absolute; bottom:3px; left:4px; right:4px; height:3px; border-radius:2px; pointer-events:none; }

    /* Link dialog */
    .link-dialog {
      display:none; position:absolute; top:calc(100% + 6px); left:0;
      background:var(--white); border:1.5px solid var(--border); border-radius:12px;
      padding:14px; box-shadow:0 8px 28px rgba(0,0,0,.12); z-index:200;
      width:320px; flex-direction:column; gap:10px;
    }
    .link-dialog.show { display:flex; }
    .link-dialog-title { font-size:12px; font-weight:700; color:var(--mid); letter-spacing:.06em; text-transform:uppercase; }
    .link-dialog input { padding:9px 12px; border-radius:8px; border:1.5px solid var(--border); font-family:'Noto Sans KR',sans-serif; font-size:13px; color:var(--dark); outline:none; transition:border-color .15s; }
    .link-dialog input:focus { border-color:var(--blue); }
    .link-dialog-actions { display:flex; gap:8px; justify-content:flex-end; }
    .link-btn { padding:7px 16px; border-radius:100px; font-size:12px; font-weight:700; border:none; cursor:pointer; font-family:'Noto Sans KR',sans-serif; }
    .link-btn-ok { background:var(--blue); color:#fff; }
    .link-btn-cancel { background:var(--bg); color:var(--mid); }

    /* Table picker */
    .table-picker {
      display:none; position:absolute; top:calc(100% + 6px); left:0;
      background:var(--white); border:1.5px solid var(--border); border-radius:12px;
      padding:12px; box-shadow:0 8px 28px rgba(0,0,0,.12); z-index:200;
    }
    .table-picker.show { display:block; }
    .table-grid { display:grid; grid-template-columns:repeat(8,18px); gap:3px; margin-bottom:8px; }
    .tg-cell { width:18px; height:18px; border-radius:3px; border:1.5px solid var(--border); cursor:pointer; transition:all .1s; }
    .tg-cell.hover { background:rgba(0,113,227,.2); border-color:var(--blue); }
    .table-size-label { font-size:11px; color:var(--mid); text-align:center; font-weight:600; }

    /* ── Editor Content ── */
    #editorContent {
      min-height:420px; padding:24px 28px;
      font-family:'Noto Sans KR',sans-serif; font-size:15px; line-height:1.85;
      color:var(--dark); outline:none; cursor:text;
      border-radius:0;
    }
    /* TipTap ProseMirror */
    #editorContent .ProseMirror { outline:none; min-height:380px; }
    #editorContent .ProseMirror p.is-editor-empty:first-child::before {
      content:attr(data-placeholder); color:var(--mid); pointer-events:none;
      float:left; height:0;
    }
    #editorContent .ProseMirror > * + * { margin-top:.75em; }
    #editorContent .ProseMirror h1 { font-size:2em; font-weight:800; letter-spacing:-.04em; line-height:1.2; }
    #editorContent .ProseMirror h2 { font-size:1.5em; font-weight:700; letter-spacing:-.03em; line-height:1.25; }
    #editorContent .ProseMirror h3 { font-size:1.2em; font-weight:700; letter-spacing:-.02em; }
    #editorContent .ProseMirror ul { padding-left:1.4em; }
    #editorContent .ProseMirror ol { padding-left:1.4em; }
    #editorContent .ProseMirror li > p { margin:0; }
    #editorContent .ProseMirror blockquote { border-left:3px solid var(--blue); padding-left:16px; color:var(--mid); margin:12px 0; }
    #editorContent .ProseMirror pre { background:#1d1d1f; color:#f5f5f7; border-radius:10px; padding:16px 18px; font-size:13px; overflow-x:auto; }
    #editorContent .ProseMirror code { background:rgba(0,0,0,.06); border-radius:4px; padding:2px 5px; font-size:.88em; }
    #editorContent .ProseMirror pre code { background:none; padding:0; }
    #editorContent .ProseMirror a { color:var(--blue); text-decoration:underline; }
    #editorContent .ProseMirror img { max-width:100%; border-radius:8px; display:block; cursor:pointer; transition:outline .15s; }
    #editorContent .ProseMirror img.selected, #editorContent .ProseMirror img:focus { outline:2px solid var(--blue); outline-offset:2px; }
    #editorContent .ProseMirror hr { border:none; border-top:1px solid var(--border); margin:24px 0; }
    /* Table */
    #editorContent .ProseMirror table { border-collapse:collapse; width:100%; margin:12px 0; table-layout:fixed; }
    #editorContent .ProseMirror td, #editorContent .ProseMirror th { border:1.5px solid var(--border); padding:8px 12px; min-width:80px; vertical-align:top; position:relative; }
    #editorContent .ProseMirror th { background:var(--bg); font-weight:700; font-size:13px; }
    #editorContent .ProseMirror .selectedCell::after { content:''; position:absolute; inset:0; background:rgba(0,113,227,.08); pointer-events:none; }

    /* Image resize overlay */
    .img-resize-overlay {
      position:absolute; pointer-events:none; z-index:30;
      border:2px solid var(--blue); border-radius:2px;
    }
    .img-resize-handle {
      position:absolute; width:10px; height:10px; background:var(--white);
      border:2px solid var(--blue); border-radius:2px; pointer-events:all; cursor:nwse-resize;
    }
    .img-resize-handle.nw { top:-5px; left:-5px; cursor:nw-resize; }
    .img-resize-handle.ne { top:-5px; right:-5px; cursor:ne-resize; }
    .img-resize-handle.sw { bottom:-5px; left:-5px; cursor:sw-resize; }
    .img-resize-handle.se { bottom:-5px; right:-5px; cursor:se-resize; }

    /* Editor footer */
    .editor-footer { display:flex; justify-content:flex-end; padding:6px 14px 7px; background:var(--bg); border-top:1px solid var(--border); border-radius:0 0 10px 10px; }
    .char-count { font-size:11px; color:var(--mid); }

    /* ── Thumbnail ── */
    .thumbnail-wrap { border:1.5px solid var(--border); border-radius:10px; overflow:hidden; cursor:pointer; position:relative; transition:border-color .18s; }
    .thumbnail-wrap:hover { border-color:var(--blue); }
    .thumbnail-wrap input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
    .thumbnail-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:28px; background:var(--bg); }
    .thumb-icon { width:40px; height:40px; background:var(--blue-light); border-radius:10px; display:flex; align-items:center; justify-content:center; color:var(--blue); }
    .thumb-label { font-size:13px; font-weight:600; color:var(--dark); }
    .thumb-sub { font-size:11px; color:var(--mid); }
    .thumbnail-preview { display:none; position:relative; }
    .thumbnail-preview img { width:100%; aspect-ratio:16/5; object-fit:cover; display:block; }
    .thumb-remove { position:absolute; top:10px; right:10px; padding:5px 14px; border-radius:100px; background:rgba(0,0,0,.5); color:#fff; font-size:12px; font-weight:600; border:none; cursor:pointer; backdrop-filter:blur(8px); transition:background .15s; }
    .thumb-remove:hover { background:var(--red); }

    /* ── Tags ── */
    .tag-input-wrap { border:1.5px solid var(--border); border-radius:10px; padding:7px 11px; display:flex; flex-wrap:wrap; gap:5px; align-items:center; cursor:text; transition:border-color .18s; }
    .tag-input-wrap:focus-within { border-color:var(--blue); }
    .tag-chip { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:100px; background:var(--blue-light); color:var(--blue); font-size:12px; font-weight:600; }
    .tag-chip button { background:none; border:none; color:var(--blue); cursor:pointer; padding:0; line-height:1; font-size:13px; }
    .tag-text-input { border:none; outline:none; font-family:'Noto Sans KR',sans-serif; font-size:13px; color:var(--dark); min-width:100px; flex:1; background:transparent; }
    .tag-text-input::placeholder { color:var(--mid); }

    /* ── Actions ── */
    .form-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:28px; padding-top:22px; border-top:1px solid var(--border); }
    .btn { padding:11px 28px; border-radius:100px; font-family:'Noto Sans KR',sans-serif; font-size:14px; font-weight:700; border:none; cursor:pointer; transition:all .18s var(--ease); }
    .btn-cancel { background:var(--bg); color:var(--mid); border:1.5px solid var(--border); }
    .btn-cancel:hover { border-color:var(--dark); color:var(--dark); }
    .btn-submit { background:var(--blue); color:#fff; }
    .btn-submit:hover { filter:brightness(1.1); transform:translateY(-1px); }

    /* ── Toast ── */
    .toast { position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--dark); color:#fff; padding:11px 22px; border-radius:100px; font-size:13px; font-weight:600; pointer-events:none; opacity:0; transition:all .3s var(--ease); white-space:nowrap; z-index:999; }
    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

    @media(max-width:600px){ .form-card { padding:24px 16px; } }
  </style>
</head>
<body>
<div class="wrap">

  <!-- Header -->
  <div class="page-header">
    <a href="list.html" class="btn-back">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      목록
    </a>
    <h1 class="page-title">글쓰기</h1>
  </div>

  <!-- Form -->
  <div class="form-card">

    <!-- Category + Title -->
    <div class="field-row">
      <div class="field" style="margin-bottom:0">
        <div class="field-label">분류 <span class="required">*</span></div>
        <select class="field-select" id="category">
          <option value="">선택</option>
          <option value="공지">공지</option>
          <option value="이벤트">이벤트</option>
          <option value="일반">일반</option>
          <option value="질문">질문</option>
        </select>
      </div>
      <div class="field" style="margin-bottom:0">
        <div class="field-label">제목 <span class="required">*</span></div>
        <input type="text" class="field-input" id="title" placeholder="제목을 입력하세요" maxlength="100" />
      </div>
    </div>
    <div style="height:20px"></div>

    <!-- Editor -->
    <div class="field">
      <div class="field-label">내용 <span class="required">*</span></div>
      <div class="editor-wrap" id="editorWrap">

        <!-- Toolbar -->
        <div class="toolbar" id="toolbar">

          <!-- 고정 영역: History + 드롭다운들 -->
          <div class="tb-fixed">
            <div class="tb-group">
              <button class="tb-btn" id="btnUndo" title="실행 취소 (Ctrl+Z)">
                <svg viewBox="0 0 16 16" fill="none"><path d="M3 6h7a4 4 0 010 8H7M3 6l3-3M3 6l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button class="tb-btn" id="btnRedo" title="다시 실행 (Ctrl+Y)">
                <svg viewBox="0 0 16 16" fill="none"><path d="M13 6H6a4 4 0 000 8h3M13 6l-3-3M13 6l-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
            <div class="tb-sep"></div>
            <div class="tb-group">
              <select class="tb-select" id="headingSelect" style="width:72px" title="단락 스타일">
                <option value="0">본문</option>
                <option value="1">제목 1</option>
                <option value="2">제목 2</option>
                <option value="3">제목 3</option>
              </select>
            </div>
            <div class="tb-group" style="margin-left:2px">
              <select class="tb-select" id="fontSizeSelect" style="width:52px" title="글자 크기">
                <option value="10">10</option>
                <option value="12">12</option>
                <option value="14">14</option>
                <option value="16" selected>16</option>
                <option value="18">18</option>
                <option value="20">20</option>
                <option value="24">24</option>
                <option value="28">28</option>
                <option value="32">32</option>
                <option value="36">36</option>
                <option value="48">48</option>
              </select>
            </div>
            <div class="tb-group" style="margin-left:2px">
              <select class="tb-select" id="lineHeightSelect" style="width:58px" title="행간">
                <option value="1">1.0</option>
                <option value="1.2">1.2</option>
                <option value="1.5">1.5</option>
                <option value="1.75" selected>1.75</option>
                <option value="2">2.0</option>
                <option value="2.5">2.5</option>
                <option value="3">3.0</option>
              </select>
            </div>
          </div>

          <!-- 횡스크롤 영역: 서식 버튼들 -->
          <div class="tb-scroll">

          <!-- Text format -->
          <div class="tb-group">
            <button class="tb-btn" data-cmd="bold" title="굵게 (Ctrl+B)">
              <svg viewBox="0 0 16 16" fill="none"><path d="M4 3h5a3 3 0 010 6H4V3zM4 9h6a3 3 0 010 6H4V9z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="tb-btn" data-cmd="italic" title="기울임 (Ctrl+I)">
              <svg viewBox="0 0 16 16" fill="none"><line x1="10" y1="3" x2="6" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="7" y1="3" x2="13" y2="3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="3" y1="13" x2="9" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <button class="tb-btn" data-cmd="underline" title="밑줄 (Ctrl+U)">
              <svg viewBox="0 0 16 16" fill="none"><path d="M4 3v5a4 4 0 008 0V3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="2" y1="14" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <button class="tb-btn" data-cmd="strike" title="취소선">
              <svg viewBox="0 0 16 16" fill="none"><line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M5.5 5a2.5 2.5 0 015 0c0 1.5-1 2-2.5 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="tb-sep"></div>

          <!-- Colors -->
          <div class="tb-group">
            <label class="tb-color" title="글자 색상">
              <svg viewBox="0 0 16 16" fill="none"><path d="M8 2L3 13M8 2l5 11M5.5 9.5h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              <div class="color-bar" id="colorTextBar" style="background:#1d1d1f"></div>
              <input type="color" id="colorText" value="#1d1d1f" />
            </label>
            <label class="tb-color" title="배경 색상 (형광펜)">
              <svg viewBox="0 0 16 16" fill="none"><path d="M10.5 3l2.5 2.5-6 6H4.5V9L10.5 3z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><line x1="2" y1="14" x2="14" y2="14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
              <div class="color-bar" id="colorBgBar" style="background:#ffd60a"></div>
              <input type="color" id="colorBg" value="#ffd60a" />
            </label>
          </div>
          <div class="tb-sep"></div>

          <!-- Alignment -->
          <div class="tb-group">
            <button class="tb-btn" data-cmd="align" data-val="" title="왼쪽 정렬">
              <svg viewBox="0 0 16 16" fill="none"><line x1="2" y1="4" x2="14" y2="4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="2" y1="7" x2="10" y2="7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="2" y1="10" x2="14" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="2" y1="13" x2="8" y2="13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </button>
            <button class="tb-btn" data-cmd="align" data-val="center" title="가운데 정렬">

<script type="module">
import { Editor, Extension } from 'https://esm.sh/@tiptap/core@2.2.4'
import StarterKit             from 'https://esm.sh/@tiptap/starter-kit@2.2.4'
import Underline              from 'https://esm.sh/@tiptap/extension-underline@2.2.4'
import TextAlign              from 'https://esm.sh/@tiptap/extension-text-align@2.2.4'
import TiptapImage            from 'https://esm.sh/@tiptap/extension-image@2.2.4'
import Link                   from 'https://esm.sh/@tiptap/extension-link@2.2.4'
import Color                  from 'https://esm.sh/@tiptap/extension-color@2.2.4'
import TextStyle              from 'https://esm.sh/@tiptap/extension-text-style@2.2.4'
import Highlight              from 'https://esm.sh/@tiptap/extension-highlight@2.2.4'
import Table                  from 'https://esm.sh/@tiptap/extension-table@2.2.4'
import TableRow               from 'https://esm.sh/@tiptap/extension-table-row@2.2.4'
import TableHeader            from 'https://esm.sh/@tiptap/extension-table-header@2.2.4'
import TableCell              from 'https://esm.sh/@tiptap/extension-table-cell@2.2.4'
import Placeholder            from 'https://esm.sh/@tiptap/extension-placeholder@2.2.4'

/* ── Custom LineHeight extension ── */
const LineHeight = Extension.create({
  name: 'lineHeight',
  addGlobalAttributes() {
    return [{
      types: ['paragraph', 'heading'],
      attributes: {
        lineHeight: {
          default: null,
          parseHTML: el => el.style.lineHeight || null,
          renderHTML: a => a.lineHeight ? { style: `line-height:${a.lineHeight}` } : {}
        }
      }
    }]
  },
  addCommands() {
    return {
      setLineHeight: value => ({ commands }) =>
        ['paragraph','heading'].every(t => commands.updateAttributes(t, { lineHeight: value })),
      unsetLineHeight: () => ({ commands }) =>
        ['paragraph','heading'].every(t => commands.updateAttributes(t, { lineHeight: null })),
    }
  }
})

/* ── Custom FontSize extension ── */
const FontSize = Extension.create({
  name: 'fontSize',
  addGlobalAttributes() {
    return [{ types: ['textStyle'], attributes: { fontSize: {
      default: null,
      parseHTML: el => el.style.fontSize || null,
      renderHTML: a => a.fontSize ? { style: `font-size:${a.fontSize}` } : {}
    }}}]
  },
  addCommands() {
    return {
      setFontSize: size => ({ chain }) => chain().setMark('textStyle', { fontSize: size ? size+'px' : null }).run()
    }
  }
})

/* ── Editor init ── */
const editor = new Editor({
  element: document.getElementById('editorContent'),
  extensions: [
    StarterKit,
    Underline,
    TextAlign.configure({ types: ['heading','paragraph'] }),
    TiptapImage.configure({ inline: false, allowBase64: true }),
    Link.configure({ openOnClick: false, autolink: true }),
    TextStyle,
    Color,
    FontSize,
    Highlight.configure({ multicolor: true }),
    LineHeight,
    Table.configure({ resizable: false }),
    TableRow, TableHeader, TableCell,
    Placeholder.configure({ placeholder: '내용을 입력하세요. 이미지는 툴바의 이미지 버튼으로 본문에 삽입할 수 있습니다.' }),
  ],
  content: '<p></p>',
  onUpdate: () => { syncToolbar(); updateCharCount(); },
  onSelectionUpdate: () => syncToolbar(),
})
window._editor = editor

/* ── Sync toolbar state ── */
function syncToolbar() {
  const e = editor
  const cmds = ['bold','italic','underline','strike','bulletList','orderedList','blockquote','codeBlock']
  cmds.forEach(cmd => {
    const btn = document.querySelector(`[data-cmd="${cmd}"]`)
    if (btn) btn.classList.toggle('active', e.isActive(cmd))
  })
  // Alignment
  document.querySelectorAll('[data-cmd="align"]').forEach(btn => {
    const val = btn.dataset.val
    const active = val === '' ? e.isActive({ textAlign: 'left' }) || !e.isActive({ textAlign: 'center' }) && !e.isActive({ textAlign: 'right' }) && !e.isActive({ textAlign: 'justify' })
      : e.isActive({ textAlign: val })
    btn.classList.toggle('active', active)
  })
  // Link
  const linkBtn = document.querySelector('[data-cmd="link"]')
  if (linkBtn) linkBtn.classList.toggle('active', e.isActive('link'))
  // Heading select
  const hs = document.getElementById('headingSelect')
  if (e.isActive('heading',{level:1})) hs.value = '1'
  else if (e.isActive('heading',{level:2})) hs.value = '2'
  else if (e.isActive('heading',{level:3})) hs.value = '3'
  else hs.value = '0'
  // Font size
  const attrs = e.getAttributes('textStyle')
  const fs = document.getElementById('fontSizeSelect')
  const size = attrs.fontSize ? attrs.fontSize.replace('px','') : '16'
  if ([...fs.options].some(o => o.value === size)) fs.value = size
  // Line height
  const lhAttrs = e.getAttributes('paragraph') || e.getAttributes('heading') || {}
  const lhSel = document.getElementById('lineHeightSelect')
  const lh = lhAttrs.lineHeight || '1.75'
  if ([...lhSel.options].some(o => o.value === lh)) lhSel.value = lh
  // Undo/Redo
  document.getElementById('btnUndo').disabled = !e.can().undo()
  document.getElementById('btnRedo').disabled = !e.can().redo()
}

function updateCharCount() {
  const len = editor.getText().trim().length
  document.getElementById('charCount').textContent = `${len.toLocaleString()}자`
}

/* ── Toolbar button clicks ── */
document.getElementById('toolbar').addEventListener('click', e => {
  const btn = e.target.closest('[data-cmd]')
  if (!btn) return
  e.preventDefault()
  const cmd = btn.dataset.cmd, val = btn.dataset.val, ed = editor.chain().focus()
  switch(cmd) {
    case 'bold':        ed.toggleBold().run(); break
    case 'italic':      ed.toggleItalic().run(); break
    case 'underline':   ed.toggleUnderline().run(); break
    case 'strike':      ed.toggleStrike().run(); break
    case 'bulletList':  ed.toggleBulletList().run(); break
    case 'orderedList': ed.toggleOrderedList().run(); break
    case 'blockquote':  ed.toggleBlockquote().run(); break
    case 'codeBlock':   ed.toggleCodeBlock().run(); break
    case 'align':       ed.setTextAlign(val || 'left').run(); break
    case 'link':        openLinkDialog(); return
    case 'clearFormat': editor.chain().focus().clearNodes().unsetAllMarks().run(); break
  }
  syncToolbar()
})

/* ── Undo / Redo ── */
document.getElementById('btnUndo').addEventListener('click', () => { editor.chain().focus().undo().run(); syncToolbar() })
document.getElementById('btnRedo').addEventListener('click', () => { editor.chain().focus().redo().run(); syncToolbar() })

/* ── Heading select ── */
document.getElementById('headingSelect').addEventListener('change', function() {
  const v = this.value
  if (v === '0') editor.chain().focus().setParagraph().run()
  else editor.chain().focus().toggleHeading({ level: parseInt(v) }).run()
  syncToolbar()
})

/* ── Font size select ── */
document.getElementById('fontSizeSelect').addEventListener('change', function() {
  editor.chain().focus().setFontSize(this.value).run()
  syncToolbar()
})

/* ── Line height select ── */
document.getElementById('lineHeightSelect').addEventListener('change', function() {
  editor.chain().focus().setLineHeight(this.value).run()
  syncToolbar()
})

/* ── Color pickers ── */
document.getElementById('colorText').addEventListener('input', function() {
  editor.chain().focus().setColor(this.value).run()
  document.getElementById('colorTextBar').style.background = this.value
})
document.getElementById('colorBg').addEventListener('input', function() {
  editor.chain().focus().setHighlight({ color: this.value }).run()
  document.getElementById('colorBgBar').style.background = this.value
})

/* ── Image upload ── */
document.getElementById('btnImage').addEventListener('click', () => {
  const input = document.createElement('input')
  input.type = 'file'; input.accept = 'image/*'
  input.onchange = () => {
    const file = input.files[0]; if (!file) return
    if (file.size > 10*1024*1024) { showToast('이미지 크기는 10MB 이하여야 합니다.'); return }
    const r = new FileReader()
    r.onload = e => editor.chain().focus().setImage({ src: e.target.result }).run()
    r.readAsDataURL(file)
  }
  input.click()
})

/* ── Link dialog ── */
const linkDialog = document.getElementById('linkDialog')
function openLinkDialog() {
  document.getElementById('linkUrl').value = editor.getAttributes('link').href || ''
  linkDialog.classList.add('show')
  document.getElementById('linkUrl').focus()
}
document.getElementById('linkOk').addEventListener('click', () => {
  const url = document.getElementById('linkUrl').value.trim()
  if (!url) editor.chain().focus().extendMarkRange('link').unsetLink().run()
  else editor.chain().focus().extendMarkRange('link').setLink({ href: url }).run()
  linkDialog.classList.remove('show')
})
document.getElementById('linkCancel').addEventListener('click', () => {
  linkDialog.classList.remove('show'); editor.commands.focus()
})
document.getElementById('linkUrl').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('linkOk').click()
  if (e.key === 'Escape') document.getElementById('linkCancel').click()
})
document.addEventListener('click', e => {
  if (!linkDialog.contains(e.target) && !e.target.closest('[data-cmd="link"]')) linkDialog.classList.remove('show')
})

/* ── Table picker ── */
const tablePicker = document.getElementById('tablePicker')
const tableGrid   = document.getElementById('tableGrid')
let tHover = { r:0, c:0 }
for (let r = 1; r <= 8; r++) {
  for (let c = 1; c <= 8; c++) {
    const cell = document.createElement('div')
    cell.className = 'tg-cell'; cell.dataset.r = r; cell.dataset.c = c
    cell.addEventListener('mouseover', () => {
      tHover = { r, c }
      tableGrid.querySelectorAll('.tg-cell').forEach(cl => cl.classList.toggle('hover', +cl.dataset.r <= r && +cl.dataset.c <= c))
      document.getElementById('tableSizeLabel').textContent = `${r} × ${c}`
    })
    cell.addEventListener('click', () => {
      editor.chain().focus().insertTable({ rows: r, cols: c, withHeaderRow: true }).run()
      tablePicker.classList.remove('show')
    })
    tableGrid.appendChild(cell)
  }
}
document.getElementById('btnTable').addEventListener('click', e => { e.stopPropagation(); tablePicker.classList.toggle('show') })
document.addEventListener('click', e => { if (!tablePicker.contains(e.target) && e.target.id !== 'btnTable') tablePicker.classList.remove('show') })

/* ── Image resize overlay ── */
const editorEl = document.getElementById('editorContent')
const editorWrap = document.getElementById('editorWrap')
const overlay  = document.getElementById('imgResizeOverlay')
let resizeImg  = null

editorEl.addEventListener('click', e => {
  if (e.target.tagName === 'IMG') selectImg(e.target)
  else if (!overlay.contains(e.target)) deselectImg()
})
function selectImg(img) {
  deselectImg(); resizeImg = img
  img.style.outline = '2px solid #0071e3'
  positionOverlay(); overlay.style.display = 'block'
}
function deselectImg() {
  if (resizeImg) resizeImg.style.outline = ''
  resizeImg = null; overlay.style.display = 'none'
}
function positionOverlay() {
  if (!resizeImg) return
  const wr = editorWrap.getBoundingClientRect(), ir = resizeImg.getBoundingClientRect()
  overlay.style.left   = (ir.left - wr.left) + 'px'
  overlay.style.top    = (ir.top  - wr.top)  + 'px'
  overlay.style.width  = ir.width  + 'px'
  overlay.style.height = ir.height + 'px'
}
overlay.querySelectorAll('.img-resize-handle').forEach(h => {
  h.addEventListener('mousedown', e => {
    e.preventDefault(); e.stopPropagation()
    const dir = h.dataset.dir
    const startX = e.clientX, startY = e.clientY
    const startW = resizeImg.offsetWidth, startH = resizeImg.offsetHeight
    const ratio = startW / startH
    const onMove = e => {
      const dx = e.clientX - startX
      let w = startW
      if (dir === 'se' || dir === 'ne') w = Math.max(80, startW + dx)
      if (dir === 'sw' || dir === 'nw') w = Math.max(80, startW - dx)
      resizeImg.style.width = w + 'px'
      resizeImg.style.height = (w / ratio) + 'px'
      positionOverlay()
    }
    const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp) }
    document.addEventListener('mousemove', onMove)
    document.addEventListener('mouseup', onUp)
  })
})
window.addEventListener('scroll', () => { if (resizeImg) positionOverlay() })

/* ── Thumbnail ── */
let thumbnailData = null
document.getElementById('thumbnailInput').addEventListener('change', function() {
  const f = this.files[0]; if (!f) return
  const r = new FileReader()
  r.onload = e => {
    thumbnailData = e.target.result
    document.getElementById('thumbnailImg').src = thumbnailData
    document.getElementById('thumbnailEmpty').style.display = 'none'
    document.getElementById('thumbnailPreview').style.display = 'block'
  }
  r.readAsDataURL(f)
})
document.getElementById('thumbRemoveBtn').addEventListener('click', e => {
  e.stopPropagation(); e.preventDefault()
  thumbnailData = null
  document.getElementById('thumbnailInput').value = ''
  document.getElementById('thumbnailEmpty').style.display = ''
  document.getElementById('thumbnailPreview').style.display = 'none'
})

/* ── Tags ── */
const tags = []
const tagInput = document.getElementById('tagInput')
tagInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addTag(tagInput.value.replace(',','').trim()) }
  if (e.key === 'Backspace' && !tagInput.value && tags.length) { tags.pop(); renderTags() }
})
tagInput.addEventListener('blur', () => { if (tagInput.value.trim()) addTag(tagInput.value.trim()) })
function addTag(v) { if (!v || tags.length >= 5 || tags.includes(v)) { tagInput.value=''; return } tags.push(v); tagInput.value=''; renderTags() }
window.removeTag = i => { tags.splice(i,1); renderTags() }
function renderTags() {
  const w = document.getElementById('tagWrap')
  w.querySelectorAll('.tag-chip').forEach(el => el.remove())
  tags.forEach((t,i) => {
    const c = document.createElement('span'); c.className='tag-chip'
    c.innerHTML=`${t}<button type="button" onclick="removeTag(${i})">✕</button>`
    w.insertBefore(c, tagInput)
  })
}

/* ── Submit ── */
document.getElementById('submitBtn').addEventListener('click', () => {
  const cat  = document.getElementById('category').value
  const ttl  = document.getElementById('title').value.trim()
  const html = editor.getHTML()
  const txt  = editor.getText().trim()
  if (!cat) { showToast('분류를 선택해주세요.'); return }
  if (!ttl) { showToast('제목을 입력해주세요.'); return }
  if (!txt) { showToast('내용을 입력해주세요.'); return }
  const payload = { category:cat, title:ttl, content_html:html, content_text:txt, thumbnail:thumbnailData, tags:[...tags] }
  console.log('[게시글 데이터]', payload)
  // TODO: API 연동 시 fetch POST 로 교체
  showToast('게시글이 등록되었습니다!')
  setTimeout(() => window.location.href = 'list.html', 1800)
})

/* ── Toast ── */
function showToast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg; t.classList.add('show')
  setTimeout(() => t.classList.remove('show'), 2500)
}
window.showToast = showToast

/* ── 횡스크롤 영역: 마우스 휠 → 좌우 스크롤 ── */
document.querySelector('.tb-scroll').addEventListener('wheel', e => {
  e.preventDefault()
  e.currentTarget.scrollLeft += e.deltaY || e.deltaX
}, { passive: false })
