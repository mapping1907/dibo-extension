<!DOCTYPE html>
<!--
  ================================================================
  ✦ 디보(dibo) 익스텐션 | 플로팅 퀵메뉴 (Floating Quick Menu)
  ================================================================

  【페이지 개요】
  화면 하단에 고정되는 문의 전환 유도 플로팅 버튼입니다.
  카카오채널 · 채널톡 · 전화문의 · 신청폼 등 다양한 채널을
  하나의 FAB(Floating Action Button)로 통합 관리합니다.

  【사용 전 필수 설정】
  1. items 배열에서 사용할 채널 추가/삭제
     - url : 실제 링크 URL 입력                 ★ [수정 필수]
     - icon : 'kakao' | 'phone' | 'chat' | 'form' | 'email' | 'link'
              또는 이모지(예: '🎁') 직접 입력    [수정 가능]
     - color / iconColor : 버튼 배경색·아이콘 색 [수정 가능]
  2. position : 'right'(기본) 또는 'left'       [수정 가능]
  3. scrollTop : true 이면 스크롤 위로 버튼 표시 [수정 가능]
  ================================================================
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>플로팅 퀵메뉴</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f0f2f5;
      -webkit-font-smoothing: antialiased;
    }

    /* 데모 배경 (팝업과 무관) */
    .demo-bg {
      min-height: 300vh;
      background: linear-gradient(to bottom, #f0f2f5, #e8eaf0 50%, #f0f2f5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 120px;
      gap: 12px;
      color: #9ca3af;
      font-size: 15px;
    }
    .demo-bg-icon { font-size: 48px; }

    /* ================================================================
       플로팅 퀵메뉴 전체 래퍼
       ================================================================ */
    .dibo-float-wrap {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9000;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    /* 왼쪽 배치 변형 */
    .dibo-float-wrap.pos-left {
      right: auto;
      left: 24px;
      align-items: flex-start;
    }

    /* ================================================================
       스크롤 위로 버튼
       ================================================================ */
    .dibo-scrolltop {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.14);
      color: #6b7280;
      opacity: 0;
      visibility: hidden;
      transform: translateY(12px);
      transition: opacity 0.3s ease, visibility 0.3s ease,
                  transform 0.3s ease, box-shadow 0.2s;
      flex-shrink: 0;
    }

    .dibo-scrolltop.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dibo-scrolltop:hover {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
      color: #374151;
    }

    .dibo-scrolltop svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* ================================================================
       아이템 컨테이너 (speed dial)
       ================================================================ */
    .dibo-float-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }

    .pos-left .dibo-float-items { align-items: flex-start; }

    /* ================================================================
       개별 아이템
       ================================================================ */
    .dibo-float-item {
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: scale(0.5) translateY(16px);
      pointer-events: none;
      transition:
        opacity 0.28s ease,
        transform 0.32s cubic-bezier(0.34, 1.4, 0.64, 1);
      transition-delay: 0s; /* 닫힐 때는 지연 없음 */
    }

    /* 열렸을 때 */
    .dibo-float-wrap.is-open .dibo-float-item {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: auto;
      transition-delay: calc(var(--i, 0) * 0.055s);
    }

    /* 왼쪽 배치: 아이템 방향 반전 */
    .pos-left .dibo-float-item { flex-direction: row-reverse; }

    /* 라벨 */
    .float-item-label {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      background: rgba(30, 30, 50, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 5px 12px;
      border-radius: 20px;
      white-space: nowrap;
      pointer-events: none;
      letter-spacing: 0.01em;
    }

    /* 아이템 버튼 (원형) */
    .float-item-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .float-item-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.26);
    }

    .float-item-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      pointer-events: none;
    }

    .float-item-btn .float-emoji {
      font-size: 22px;
      line-height: 1;
      pointer-events: none;
    }

    /* ================================================================
       메인 FAB 버튼
       ================================================================ */
    .dibo-float-main {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.22);
      transition: transform 0.28s cubic-bezier(0.34, 1.4, 0.64, 1),
                  box-shadow 0.2s;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .dibo-float-main:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.28);
    }

    /* 열렸을 때 메인 버튼 살짝 눌린 느낌 */
    .dibo-float-wrap.is-open .dibo-float-main {
      transform: scale(0.95);
    }

    .dibo-float-main:hover { transform: scale(1.08); }
    .dibo-float-wrap.is-open .dibo-float-main:hover { transform: scale(1.02); }

    /* 메인 아이콘 (chat ↔ X 전환) */
    .fab-icon-chat,
    .fab-icon-close {
      position: absolute;
      transition: opacity 0.2s ease, transform 0.28s cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    .fab-icon-chat svg, .fab-icon-close svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
      display: block;
    }

    /* 닫힌 상태 */
    .fab-icon-chat  { opacity: 1; transform: rotate(0deg) scale(1); }
    .fab-icon-close { opacity: 0; transform: rotate(-90deg) scale(0.6); }

    /* 열린 상태 */
    .dibo-float-wrap.is-open .fab-icon-chat  { opacity: 0; transform: rotate(90deg) scale(0.6); }
    .dibo-float-wrap.is-open .fab-icon-close { opacity: 1; transform: rotate(0deg) scale(1); }

    /* ================================================================
       배경 클릭으로 닫기용 오버레이
       ================================================================ */
    .dibo-float-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 8999;
    }

    .dibo-float-backdrop.is-active { display: block; }

    /* ================================================================
       반응형
       ================================================================ */
    @media (max-width: 600px) {
      .dibo-float-wrap {
        bottom: 18px;
        right: 16px;
      }

      .pos-left.dibo-float-wrap {
        right: auto;
        left: 16px;
      }

      .dibo-float-main { width: 52px; height: 52px; }
      .float-item-btn  { width: 44px; height: 44px; }

      .fab-icon-chat svg, .fab-icon-close svg { width: 22px; height: 22px; }
      .float-item-btn svg { width: 20px; height: 20px; }
    }
  </style>
</head>
<body>

<!-- 데모 배경 -->
<div class="demo-bg">
  <div class="demo-bg-icon">🖥️</div>
  <p>페이지 콘텐츠 영역</p>
  <p style="font-size:13px;">우측 하단 버튼을 클릭해보세요.</p>
</div>

<!-- ================================================================
     플로팅 퀵메뉴
     ================================================================ -->
<div class="dibo-float-wrap" id="jsFloatWrap">

  <!-- 스크롤 위로 버튼 -->
  <button class="dibo-scrolltop" id="jsScrollTop" aria-label="맨 위로 이동">
    <svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
  </button>

  <!-- 아이템 목록 (JS로 채워짐) -->
  <div class="dibo-float-items" id="jsFloatItems"></div>

  <!-- 메인 FAB 버튼 -->
  <button class="dibo-float-main" id="jsFloatMain" aria-label="퀵메뉴 열기/닫기">
    <span class="fab-icon-chat">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
    </span>
    <span class="fab-icon-close">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </span>
  </button>

</div>

<!-- 배경 클릭 닫기용 오버레이 -->
<div class="dibo-float-backdrop" id="jsFloatBackdrop"></div>

<script>
/* ================================================================
   【플로팅 퀵메뉴 설정】
   ================================================================ */
const floatConfig = {

  position:   'right',   // [수정 가능] 'right' | 'left'
  mainColor:  '#6366f1', // [수정 가능] 메인 FAB 버튼 색상

  // ── 메뉴 아이템 ─────────────────────────────────────────
  // icon 옵션: 'kakao' | 'phone' | 'chat' | 'form' | 'email' | 'link'
  //            또는 이모지 문자열 (예: '🎁', '📞')
  items: [
    {
      label:     '카카오 채널',  // [수정 가능] 버튼 옆 라벨
      icon:      'kakao',        // [수정 가능] 아이콘 종류
      color:     '#FEE500',      // [수정 가능] 버튼 배경색
      iconColor: '#3B1D1D',      // [수정 가능] 아이콘/이모지 색
      url:       '#',            // ★ [수정 필수] 이동 URL (카카오: 'https://pf.kakao.com/...')
      newTab:    true,           // [수정 가능] 새 탭 열기 여부
    },
    {
      label:     '채널톡',
      icon:      'chat',
      color:     '#5865f2',
      iconColor: '#fff',
      url:       '#',            // ★ [수정 필수] 채널톡 링크
      newTab:    true,
    },
    {
      label:     '전화 문의',
      icon:      'phone',
      color:     '#10b981',
      iconColor: '#fff',
      url:       'tel:01012345678', // ★ [수정 필수] 전화번호
      newTab:    false,
    },
    {
      label:     '무료 신청',
      icon:      'form',
      color:     '#f97316',
      iconColor: '#fff',
      url:       '#',            // ★ [수정 필수] 신청 폼 URL 또는 앵커 (#section-id)
      newTab:    false,
    },
  ],

  scrollTop: true, // [수정 가능] 스크롤 위로 버튼 표시 여부
};

/* ================================================================
   이하 코드는 수정하지 않아도 됩니다
   ================================================================ */

// ── SVG 아이콘 정의 ──────────────────────────────────────────
const ICONS = {
  kakao: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 5.816 2 10.527c0 3.012 1.878 5.653 4.7 7.194-.207.773-.745 2.797-.852 3.23-.132.537.196.53.411.387.169-.114 2.687-1.825 3.773-2.564.643.09 1.298.137 1.968.137 5.523 0 10-3.816 10-8.527S17.523 2 12 2z"/></svg>`,
  phone: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>`,
  chat:  `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>`,
  form:  `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13zm-2 8H7v-2h4v2zm4-4H7v-2h8v2z"/></svg>`,
  email: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>`,
  link:  `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>`,
};

const wrap      = document.getElementById('jsFloatWrap');
const mainBtn   = document.getElementById('jsFloatMain');
const itemsEl   = document.getElementById('jsFloatItems');
const backdrop  = document.getElementById('jsFloatBackdrop');
const scrollBtn = document.getElementById('jsScrollTop');

// ── 위치 설정 ────────────────────────────────────────────────
if (floatConfig.position === 'left') {
  wrap.classList.add('pos-left');
}

// ── 메인 버튼 색상 ───────────────────────────────────────────
mainBtn.style.background = floatConfig.mainColor || '#6366f1';
mainBtn.style.color = '#fff';

// ── 스크롤 위로 버튼 ─────────────────────────────────────────
if (!floatConfig.scrollTop) {
  scrollBtn.style.display = 'none';
}

scrollBtn.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

window.addEventListener('scroll', () => {
  if (floatConfig.scrollTop) {
    if (window.scrollY > 300) {
      scrollBtn.classList.add('is-visible');
    } else {
      scrollBtn.classList.remove('is-visible');
    }
  }
}, { passive: true });

// ── 아이템 렌더링 ────────────────────────────────────────────
const total = floatConfig.items.length;

floatConfig.items.forEach((item, idx) => {
  // 가장 아래 아이템(마지막 index)이 먼저 나타나도록 --i 역순 계산
  const delayIndex = total - 1 - idx;

  const itemEl = document.createElement('div');
  itemEl.className = 'dibo-float-item';
  itemEl.style.setProperty('--i', String(delayIndex));

  // 아이콘 결정 (built-in SVG vs 이모지)
  const isEmoji = !ICONS[item.icon];
  const iconHTML = isEmoji
    ? `<span class="float-emoji">${item.icon}</span>`
    : ICONS[item.icon];

  // 링크 버튼
  const btn = document.createElement('a');
  btn.className = 'float-item-btn';
  btn.href      = item.url || '#';
  btn.target    = item.newTab ? '_blank' : '_self';
  if (item.newTab) btn.rel = 'noopener noreferrer';
  btn.style.background = item.color || '#6366f1';
  btn.style.color      = item.iconColor || '#fff';
  btn.setAttribute('aria-label', item.label);
  btn.innerHTML = iconHTML;

  // 라벨
  const label = document.createElement('span');
  label.className = 'float-item-label';
  label.textContent = item.label;

  // 위치에 따라 순서 결정 (right: label-left btn-right, left: btn-left label-right)
  if (floatConfig.position === 'left') {
    itemEl.appendChild(btn);
    itemEl.appendChild(label);
  } else {
    itemEl.appendChild(label);
    itemEl.appendChild(btn);
  }

  itemsEl.appendChild(itemEl);
});

// ── 메뉴 열기/닫기 ──────────────────────────────────────────
let isOpen = false;

function openMenu() {
  isOpen = true;
  wrap.classList.add('is-open');
  backdrop.classList.add('is-active');
  mainBtn.setAttribute('aria-label', '퀵메뉴 닫기');
}

function closeMenu() {
  isOpen = false;
  wrap.classList.remove('is-open');
  backdrop.classList.remove('is-active');
  mainBtn.setAttribute('aria-label', '퀵메뉴 열기');
}

mainBtn.addEventListener('click', () => {
  isOpen ? closeMenu() : openMenu();
});

backdrop.addEventListener('click', closeMenu);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && isOpen) closeMenu();
});
</script>

</body>
</html>
